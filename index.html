<title>Painel de Inspeções SESMT</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
/* ============================================================
   Tema claro: fundo branco, destaques em laranja.
   Neutros com leve viés quente para conversar com o acento.
   ============================================================ */
:root{
  --fundo:#ffffff;          /* ground da página */
  --canvas:#ffffff;
  --painel:#ffffff;         /* superfície dos visuais */
  --painel-alt:#fbf8f4;     /* cabeçalhos de tabela, faixas */
  --linha-borda:#e6e0d8;
  --sombra:0 1px 3px rgba(60,44,28,.08);

  --txt:#241f1a;
  --txt2:#7b7168;
  --txt3:#a49a90;

  --acento:#fb4513;         /* laranja oficial Teccel */
  --acento-forte:#c8300a;   /* laranja escuro, para texto sobre branco */
  --acento-suave:#fdeee9;   /* fundo de realce */

  --c1:#fb4513;             /* série principal (realizado) */
  --c2:#b9c4ce;             /* série de referência (meta) */
  --c3:#7a5cff;
  --c-linha:#123f5e;        /* linha de %: azul-ardósia, contrasta com o laranja */
  --c-total:#8a9aa8;

  --ruim:#c62828; --medio:#ef8f00; --bom:#2e7d32;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--txt);
  font-family:"Segoe UI","Open Sans",system-ui,-apple-system,sans-serif;overflow:hidden}

/* ---- palco: canvas 1510x720 escalado ---- */
#palco{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#canvas{position:relative;flex:0 0 auto;width:1510px;height:720px;transform-origin:center center;
  background:var(--canvas);
  box-shadow:0 10px 40px rgba(60,44,28,.14);border-radius:6px;overflow:hidden}
.pagina{position:absolute;inset:0;display:none}
.pagina.ativa{display:block}

/* ---- visuais ---- */
.v{position:absolute}
.painel{background:var(--painel);border:1px solid var(--linha-borda);border-radius:8px;
  box-shadow:var(--sombra)}
.titulo{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--txt2);
  text-transform:uppercase;padding:8px 10px 0}
.corpo{position:absolute;left:6px;right:6px;top:26px;bottom:6px}
.corpo.semtitulo{top:6px}

/* cards de KPI */
.card{background:var(--painel);border:1px solid var(--linha-borda);border-radius:8px;
  box-shadow:var(--sombra);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.card .valor{font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.card .rot{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2)}
.card.destaque{border-color:var(--acento)}
.card.destaque .valor{color:var(--acento-forte)}
.card.alerta .valor{color:var(--ruim)}
.card.ok .valor{color:var(--bom)}

/* cabeçalho */
.faixa-topo{position:absolute;left:0;right:0;top:0;height:78px;
  background:var(--painel-alt);border-bottom:3px solid var(--acento)}
.marca{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:14px}
.marca .logo{height:36px;width:auto;border-radius:5px;display:block}
.marca .divisor{width:1px;height:34px;background:var(--linha-borda)}
.marca .nome{font-size:15px;font-weight:700;letter-spacing:.04em}
.marca .sub{font-size:10px;color:var(--txt2);letter-spacing:.1em;text-transform:uppercase}
.voltar{position:absolute;left:16px;top:86px;width:44px;height:44px;border-radius:10px;
  background:var(--painel);border:1px solid var(--linha-borda);color:var(--txt);
  cursor:pointer;font-size:18px}
.voltar:hover{border-color:var(--acento);color:var(--acento-forte);background:var(--acento-suave)}

/* slicers */
.faixa-slicers{position:absolute;left:70px;right:16px;top:88px;height:44px;
  display:flex;gap:8px;align-items:center}
.slicer{position:relative;flex:1;max-width:150px}
.slicer>button{width:100%;height:40px;border-radius:8px;background:var(--painel);
  border:1px solid var(--linha-borda);color:var(--txt);text-align:left;padding:4px 22px 4px 9px;
  cursor:pointer;font-size:11px;line-height:1.15}
.slicer>button .lb{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2)}
.slicer>button .vl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slicer>button::after{content:"▾";position:absolute;right:8px;top:12px;color:var(--txt3)}
.slicer.on>button{border-color:var(--acento);background:var(--acento-suave);color:var(--acento-forte)}
.lista{position:absolute;z-index:40;top:42px;left:0;min-width:100%;max-height:230px;overflow:auto;
  background:var(--painel);border:1px solid var(--acento);border-radius:8px;padding:4px;display:none;
  box-shadow:0 8px 24px rgba(60,44,28,.16)}
.slicer.aberto .lista{display:block}
.lista label{display:flex;gap:6px;align-items:center;padding:4px 6px;font-size:11px;
  border-radius:5px;cursor:pointer;white-space:nowrap}
.lista label:hover{background:var(--acento-suave)}
.lista input{accent-color:var(--acento)}
.limpar{flex:0 0 auto;height:40px;padding:0 12px;border-radius:8px;white-space:nowrap;
  background:transparent;border:1px solid var(--linha-borda);color:var(--txt2);cursor:pointer;font-size:11px}
.limpar:hover{border-color:var(--ruim);color:var(--ruim)}
.btn-filtros{display:none}

/* navegação (PAINEL) */
.menu-btn{display:flex;align-items:center;gap:14px;width:100%;height:100%;
  background:var(--painel);border:1px solid var(--linha-borda);
  border-left:4px solid var(--acento);border-radius:10px;color:var(--txt);cursor:pointer;
  padding:0 18px;font-size:16px;font-weight:600;letter-spacing:.03em;text-align:left;
  box-shadow:var(--sombra);transition:.15s}
.menu-btn:hover{background:var(--acento-suave);border-color:var(--acento);transform:translateX(3px)}
.menu-btn .ic{font-size:20px;width:26px;text-align:center}
.menu-btn .desc{display:block;font-size:10.5px;font-weight:400;color:var(--txt2)}

/* rodapé de páginas */
.abas{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--painel-alt);
  border-top:1px solid var(--linha-borda);display:flex;align-items:center;gap:2px;padding:0 8px;z-index:30}
.abas button{background:transparent;border:0;color:var(--txt2);font-size:11px;padding:5px 10px;
  border-radius:5px;cursor:pointer}
.abas button:hover{color:var(--acento-forte);background:var(--acento-suave)}
.abas button.on{background:var(--acento);color:#fff;font-weight:700}
.abas .att{margin-left:auto;font-size:10px;color:var(--txt3);padding-right:6px}

/* tabelas */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl thead th{position:sticky;top:0;background:var(--painel-alt);color:var(--txt2);text-align:left;
  padding:6px 8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  border-bottom:2px solid var(--acento);white-space:nowrap}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--linha-borda)}
.tbl tbody tr:hover{background:var(--acento-suave)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .ok{color:var(--bom);font-weight:600}
.tbl .nok{color:var(--ruim);font-weight:600}
.rolagem{overflow:auto;height:100%}
.medalha{font-size:14px}

/* svg */
.chart{display:block}
.grade{stroke:#eee7de;stroke-width:1}
.eixo{fill:var(--txt2);font-size:9.5px}
.eixo2{fill:var(--c-linha)}
.rotulo{fill:var(--txt);font-size:9px;font-weight:600}
.rotulo-linha{fill:var(--c-linha);font-size:9.5px;font-weight:800;
  paint-order:stroke fill;stroke:var(--painel);stroke-width:3px;stroke-linejoin:round}
/* o rótulo fica por cima da barra colorida: contorno branco garante leitura
   tanto sobre a barra quanto sobre o fundo, quando o texto passa dela */
.rotulo-barra{fill:var(--txt);font-size:10px;
  paint-order:stroke fill;stroke:var(--painel);stroke-width:3px;stroke-linejoin:round}
.vazio{fill:var(--txt3);font-size:12px}
.meta{stroke:var(--c2);stroke-width:1.5;stroke-dasharray:5 4}
.ponteiro{stroke:var(--txt);stroke-width:3;stroke-linecap:round}
.pivo{fill:var(--txt)}
.gauge-valor{fill:var(--txt);font-size:22px;font-weight:800}
.legenda{position:absolute;right:8px;top:6px;display:flex;gap:10px;font-size:9px;color:var(--txt2)}
.legenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ============================================================
   RESUMO GERAL — bloco de progresso + cartões + gravidade
   (mesmo desenho do painel de obras, com as cores da Teccel)
   ============================================================ */
/* o corpo do painel segura as pílulas no topo; quem rola é o conteúdo */
#pg-painel .corpo{display:flex;flex-direction:column;gap:9px}
.rp-sel{flex:0 0 auto;align-self:flex-start}
.rp-sel button{font-size:12px;padding:7px 15px}
.rp-conteudo{flex:1 1 auto;min-height:0;overflow:auto}
.rp-vazio{color:var(--txt3);font-size:12px;padding:10px 2px}

/* lista de progresso: mês a mês, por polo ou por equipe */
.rp-lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 2px 8px}
/* busca da lista: campo discreto, colado no topo enquanto a lista rola */
.rp-busca{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding:2px 2px 8px;background:var(--painel)}
.rp-busca input{flex:1 1 auto;min-width:0;height:32px;border-radius:8px;padding:0 10px;
  border:1px solid var(--linha-borda);background:var(--painel-alt);color:inherit;
  font:inherit;font-size:12px}
.rp-busca input:focus{outline:2px solid var(--acento);outline-offset:-1px}
.rp-conta{flex:0 0 auto;font-size:10px;font-weight:700;color:var(--txt3);
  font-variant-numeric:tabular-nums}
.rp-lista.vazia::after{content:"Nenhuma linha bate com a busca.";grid-column:1/-1;
  color:var(--txt3);font-size:12px;padding:10px 2px}
/* cada bloco é um botão: abre o relatório completo do mês, polo ou equipe */
.rp-item{position:relative;display:block;width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--painel-alt);border:1px solid var(--linha-borda);
  border-radius:10px;padding:8px 10px;cursor:pointer;transition:.12s}
.rp-item:hover{border-color:var(--acento);background:var(--acento-suave)}
/* .rp-item declara display:block, que ganha do [hidden] do navegador */
.rp-item[hidden]{display:none}
.rp-item:focus-visible{outline:2px solid var(--acento);outline-offset:1px}
.rp-abrir{position:absolute;right:10px;bottom:7px;font-size:9.5px;font-weight:700;
  color:var(--acento-forte);opacity:0;transition:.12s}
.rp-item:hover .rp-abrir,.rp-item:focus-visible .rp-abrir{opacity:1}
.rp-voltar{align-self:flex-start;margin-bottom:2px;height:30px;padding:0 12px;border-radius:8px;
  background:var(--painel);border:1px solid var(--linha-borda);color:var(--txt2);
  font-size:11.5px;font-weight:700;cursor:pointer}
.rp-voltar:hover{border-color:var(--acento);color:var(--acento-forte);background:var(--acento-suave)}
.rp-cab{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rp-cab b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-pct{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rp-pct.bom{color:var(--bom)} .rp-pct.medio{color:var(--medio)} .rp-pct.ruim{color:var(--acento-forte)}
.rp-item .rg-barra{height:7px;margin:5px 0 4px}
.rp-pe{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10px;color:var(--txt2);
  font-variant-numeric:tabular-nums}

.rg{display:flex;flex-direction:column;gap:9px;padding:0 2px 4px}
.rg-cab{display:flex;align-items:center;justify-content:space-between;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2);font-weight:700}
.rg-progresso,.rg-desvios{background:var(--painel-alt);border:1px solid var(--linha-borda);
  border-radius:10px;padding:10px 12px}
.rg-pct{font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.rg-pct.bom{color:var(--bom)} .rg-pct.medio{color:var(--medio)} .rg-pct.ruim{color:var(--acento-forte)}
.rg-barra{height:9px;border-radius:20px;background:#ece5dd;overflow:hidden;margin:6px 0 5px}
.rg-barra i{display:block;height:100%;border-radius:20px;background:var(--acento)}
.rg-barra i.bom{background:var(--bom)} .rg-barra i.medio{background:var(--medio)}
.rg-pe{display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);
  font-variant-numeric:tabular-nums}

.rg-cartoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rg-card{background:var(--painel);border:1px solid var(--linha-borda);border-radius:10px;
  padding:9px 10px;box-shadow:var(--sombra)}
.rg-val{font-size:21px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.rg-val.bom{color:var(--bom)} .rg-val.medio{color:var(--medio)} .rg-val.ruim{color:var(--ruim)}
.rg-rot{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);margin-top:2px}
.rg-dica{font-size:10px;color:var(--txt3);line-height:1.25;margin-top:3px}
.rg-nota{font-size:10.5px;color:var(--txt2);line-height:1.4;padding:0 2px}
.rg-nota b{color:var(--txt)}
/* o cartão inteiro explica o número ao parar o cursor em cima */
.card.comdica{cursor:help}

.rg-linha{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:4px 0}
.rg-linha i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.rg-linha>span{flex:0 0 118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg-mini{flex:1 1 auto;height:7px;border-radius:20px;background:#ece5dd;overflow:hidden}
.rg-mini i{display:block;height:100%;width:0;border-radius:20px}
.rg-linha b{flex:0 0 38px;text-align:right;font-variant-numeric:tabular-nums}
.rg-linha em{flex:0 0 44px;text-align:right;font-style:normal;color:var(--txt2);font-size:10.5px}

.rg-pedaco{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-size:11px;color:var(--txt2);padding:0 2px}
.rg-pedaco b{color:var(--txt)}

/* ============================================================
   MODO FLUIDO — telas estreitas (celular / tablet retrato)
   Os mesmos visuais, reempilhados numa grade de 2 colunas.
   ============================================================ */
@media (max-width:1099px){
  html,body{overflow:auto;height:auto;-webkit-text-size-adjust:100%}
  #palco{position:static;display:block}
  #canvas{width:100%;height:auto;min-height:100vh;transform:none;border-radius:0;box-shadow:none}
  .pagina{position:static;inset:auto}
  .pagina.ativa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;padding:10px 10px 66px;align-content:start}

  .faixa-topo{display:none}
  .marca{position:static;grid-column:1/-1;padding:4px 0}
  .voltar{position:static;grid-column:1/-1;width:auto;height:38px;padding:0 14px;
    justify-self:start;font-size:14px}

  /* todo visual perde o posicionamento absoluto e vira item da grade */
  .v{position:relative;left:auto!important;top:auto!important;
    width:auto!important;height:auto!important}
  .card{grid-column:span 1;min-height:74px;padding:8px 4px}
  /* no fluido o painel vira coluna flex: o título pode quebrar em 2 linhas
     sem passar por cima do conteúdo */
  .painel{grid-column:1/-1;min-height:290px;display:flex;flex-direction:column}
  .titulo{position:static;flex:0 0 auto;padding:9px 10px 4px;font-size:11px}
  .corpo{position:static;flex:1 1 auto;min-height:240px;margin:0 6px 6px}
  .legenda{position:static;justify-content:flex-end;padding:0 8px 4px}

  /* filtros recolhidos atrás de um botão */
  .btn-filtros{display:flex;align-items:center;justify-content:center;gap:8px;
    grid-column:1/-1;height:42px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
    background:var(--painel);border:1px solid var(--linha-borda);color:var(--txt);
    box-shadow:var(--sombra)}
  .btn-filtros .cont{font-size:11px;color:var(--txt2)}
  .btn-filtros.on{border-color:var(--acento);color:var(--acento-forte);background:var(--acento-suave)}
  .faixa-slicers{display:none}
  .pagina.filtros-abertos .faixa-slicers{position:static;grid-column:1/-1;height:auto;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
  .slicer{max-width:none}
  .limpar{grid-column:1/-1;width:100%;height:42px}
  .lista{max-height:52vh}

  /* tabela rola na horizontal em vez de espremer as colunas */
  .rolagem{max-height:66vh}
  .tbl{font-size:12.5px;min-width:620px}
  .tbl td,.tbl thead th{padding:8px 9px;white-space:nowrap}

  .abas{position:fixed;bottom:0;overflow-x:auto;flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    box-shadow:0 -2px 10px rgba(60,44,28,.10)}
  .abas::-webkit-scrollbar{display:none}
  .abas button{white-space:nowrap;flex:0 0 auto}
  .abas .att{display:none}

  /* resumo geral: rola junto com a página, sem caixa de rolagem interna */
  .rg{height:auto;overflow:visible}
  .rg-pct{font-size:30px}
  #pg-painel .corpo{display:block}
  .rp-conteudo{overflow:visible;min-height:0}
  .rp-sel{margin-bottom:9px;display:flex;overflow-x:auto;scrollbar-width:none}
  .rp-sel::-webkit-scrollbar{display:none}
  .rp-sel button{flex:1 0 auto;white-space:nowrap}

  /* no fluido o painel cresce, então o pódio precisa de altura mínima própria */
  .podio{min-height:250px}
  .podio.piores{min-height:170px}
  /* alvos de toque maiores */
  .lista label{padding:9px 8px}
  .slicer>button{height:46px}

  /* (as regras da aba Ajustes no modo fluido ficam no fim
      da folha, depois das regras base, para não serem sobrescritas por elas) */
}

/* celular estreito: 2 cards por linha, visuais mais altos */
@media (max-width:520px){
  .pagina.ativa{padding:8px 8px 66px;gap:8px}
  .card{min-height:62px;padding:6px 4px}
  .card .valor{font-size:20px}
  .card .rot{font-size:8.5px}
  .painel{min-height:300px}
  .marca .nome{font-size:14px}
  .voltar{height:36px}
  /* três cartões não cabem lado a lado num celular: passam a dois */
  .rg-cartoes{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* num celular estreito os blocos de progresso ficam um por linha */
  .rp-lista{grid-template-columns:1fr}
  .rg-linha>span{flex:0 0 100px;font-size:11px}
  .rg-pedaco{flex-direction:column;gap:3px}
}

/* ============================================================
   AJUSTES — tela de cadastro
   ============================================================ */
/* começa depois do botão ← (16px + 44px + folga), senão as abas ficam por baixo dele */
.aj{position:absolute;left:74px;right:16px;top:88px;bottom:38px;display:flex;flex-direction:column;gap:10px}
.aj-estado{position:absolute;left:70px;right:16px;top:88px;height:0;display:flex;align-items:center;
  gap:10px;font-size:11.5px;overflow:visible;z-index:5}
.aj-estado span{padding:6px 10px;border-radius:7px;line-height:1.35}
.aj-estado i{font-style:normal;opacity:.75}
.aj-estado.ok span{background:#e8f5e9;color:#1b5e20;border:1px solid #c3e6c8}
.aj-estado.aviso span{background:var(--acento-suave);color:var(--acento-forte);border:1px solid #f7cdbd}
.aj-estado.erro span{background:#fdecea;color:#b3261e;border:1px solid #f5c6c2}
.aj-estado button{height:28px;padding:0 12px;border-radius:7px;cursor:pointer;font-size:11.5px;
  border:1px solid var(--linha-borda);background:var(--painel);color:var(--txt)}
.aj-estado button:hover{border-color:var(--acento);color:var(--acento-forte)}

/* seletor de seção: botões de verdade, não texto sublinhado.
   Mesmo desenho nos cadastros (.aj-abas) e no resumo do PAINEL (.pilulas). */
.pilulas,.aj-abas{display:inline-flex;gap:4px;padding:4px;border-radius:10px;
  background:var(--painel-alt);border:1px solid var(--linha-borda);align-self:flex-start}
.aj-abas{margin-top:26px}
.pilulas button,.aj-abas button{background:transparent;border:1px solid transparent;border-radius:7px;
  color:var(--txt2);font-size:13px;font-weight:700;padding:9px 22px;cursor:pointer;transition:.12s}
.pilulas button:hover,.aj-abas button:hover{color:var(--acento-forte);background:var(--acento-suave)}
.pilulas button.on,.aj-abas button.on{background:var(--acento);color:#fff;
  box-shadow:0 1px 4px rgba(251,69,19,.4)}
.pilulas button.on:hover,.aj-abas button.on:hover{background:var(--acento-forte);color:#fff}

.aj-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.aj-tit{margin:0;font-size:20px;font-weight:800;border-left:4px solid var(--acento);padding-left:10px}
.aj-desc{margin:3px 0 0 14px;font-size:11.5px;color:var(--txt2)}
.aj-novo{height:38px;padding:0 16px;border-radius:8px;border:0;cursor:pointer;
  background:var(--acento);color:#fff;font-size:13px;font-weight:700;box-shadow:var(--sombra)}
.aj-novo:hover{background:var(--acento-forte)}

.aj-filtros{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;
  background:var(--painel-alt);border:1px solid var(--linha-borda);border-radius:8px;padding:8px 10px}
.aj-filtro{display:flex;flex-direction:column;gap:3px;font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--txt2)}
.aj-filtro select,.aj-filtro input{height:32px;min-width:135px;border-radius:7px;padding:0 8px;
  border:1px solid var(--linha-borda);background:var(--painel);color:var(--txt);
  font-size:12px;text-transform:none;letter-spacing:0}
.aj-filtro select:focus,.aj-filtro input:focus{outline:2px solid var(--acento);outline-offset:-1px}
.aj-busca input{min-width:190px}
.aj-cont{margin-left:auto;font-size:11.5px;color:var(--txt2);align-self:center}

.aj-tabela{flex:1 1 auto;border:1px solid var(--linha-borda);border-radius:8px;background:var(--painel)}
.aj-tabela .forte{font-weight:700}
.etiqueta{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;
  background:var(--painel-alt);border:1px solid var(--linha-borda);color:var(--txt2)}
.situacao{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600}
.situacao.sim{background:#e8f5e9;color:#1b5e20}
.situacao.nao{background:#f3f0ec;color:var(--txt2)}

/* menu de ações da linha */
.aj-acoes{position:relative}
.aj-pontos{width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;
  border:1px solid var(--linha-borda);background:var(--painel);color:var(--txt2)}
.aj-pontos:hover{border-color:var(--acento);color:var(--acento-forte)}
.aj-menu{display:none;position:absolute;z-index:20;left:0;top:30px;min-width:132px;padding:4px;
  background:var(--painel);border:1px solid var(--linha-borda);border-radius:8px;
  box-shadow:0 8px 24px rgba(60,44,28,.18)}
.aj-acoes.aberto .aj-menu{display:block}
/* nas últimas linhas não cabe para baixo: abre para cima */
.aj-acoes.cima .aj-menu{top:auto;bottom:30px}
.aj-acoes.direita .aj-menu{left:auto;right:0}
.aj-menu button{display:block;width:100%;text-align:left;padding:7px 9px;border:0;border-radius:6px;
  background:transparent;color:var(--txt);font-size:12px;cursor:pointer}
.aj-menu button:hover:not(:disabled){background:var(--acento-suave)}
.aj-menu button.perigo{color:var(--ruim)}
.aj-menu button:disabled{opacity:.45;cursor:not-allowed}

/* diálogo */
.aj-fundo{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(36,31,26,.45);padding:20px}
.aj-dialogo{width:min(430px,100%);max-height:100%;overflow:auto;background:var(--painel);
  border-radius:12px;box-shadow:0 20px 60px rgba(36,31,26,.35);display:flex;flex-direction:column}
/* chama atenção quando alguém tenta sair com alterações pendentes */
.aj-dialogo.chama{animation:aj-chama .28s ease}
@keyframes aj-chama{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}
@media (prefers-reduced-motion:reduce){
  .aj-dialogo.chama{animation:none;outline:2px solid var(--acento);outline-offset:2px}
}
.aj-dcab{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.aj-dcab h3{margin:0;font-size:17px;font-weight:800}
.aj-x{border:0;background:transparent;color:var(--txt2);font-size:16px;cursor:pointer;
  width:28px;height:28px;border-radius:6px}
.aj-x:hover{background:var(--acento-suave);color:var(--acento-forte)}
.aj-dcorpo{padding:0 18px;display:flex;flex-direction:column;gap:12px}
.aj-campo{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--txt)}
.aj-campo input,.aj-campo select{height:38px;border-radius:8px;padding:0 10px;font-size:13px;
  border:1px solid var(--linha-borda);background:var(--painel);color:var(--txt);font-weight:400}
.aj-campo input:focus,.aj-campo select:focus{outline:2px solid var(--acento);outline-offset:-1px}
.aj-aviso{margin:0;font-size:12px;color:var(--txt2);line-height:1.45}
.aj-aviso.forte{color:var(--ruim)}
.aj-dtexto{margin:0;font-size:12.5px;line-height:1.55;color:var(--txt2)}
.aj-dtexto.aj-alerta{color:var(--acento-forte);background:var(--acento-suave);
  border:1px solid #f3c4bb;border-radius:8px;padding:9px 11px;font-weight:600}
.aj-vermostrar{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt2);
  cursor:pointer;margin-top:-4px}
.aj-vermostrar input{width:15px;height:15px;accent-color:var(--acento);cursor:pointer}
.aj-derro{padding:0 18px;color:var(--ruim);font-size:12px;min-height:16px;margin-top:8px}
.aj-drod{display:flex;justify-content:flex-end;gap:8px;padding:6px 18px 18px}
.aj-drod button{height:38px;padding:0 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.aj-cancelar{border:1px solid var(--linha-borda);background:var(--painel);color:var(--txt)}
.aj-cancelar:hover{background:var(--painel-alt)}
.aj-ok{border:0;background:var(--acento);color:#fff}
.aj-ok:hover:not(:disabled){background:var(--acento-forte)}
.aj-ok:disabled{opacity:.6;cursor:progress}
.aj-ok.perigo{background:var(--ruim)}
.aj-ok.perigo:hover:not(:disabled){background:#a01f1f}

/* siglas com descrição ao passar o cursor */
.sigla{border-bottom:1px dotted currentColor;cursor:help}

/* ---- pódio ---- */
.podio{position:relative;height:100%;border-radius:6px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:10px;padding:14px 16px 16px;text-align:center;
  background-image:var(--foto-podio);background-size:cover;background-position:center 30%}
/* véu escuro: a foto é contraluz, o texto precisa de base para ler */
.podio::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,18,26,.30) 0%,rgba(10,18,26,.62) 45%,rgba(10,18,26,.88) 100%)}
.podio>*{position:relative;z-index:1}
.podio .marca-podio{position:absolute;top:9px;right:12px;height:21px;width:auto;border-radius:4px;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.podio .coroa{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;
  max-width:400px;padding:12px 14px;border-radius:12px;
  background:rgba(251,69,19,.80);border:1px solid rgba(255,255,255,.34);
  box-shadow:0 6px 22px rgba(0,0,0,.35)}
.podio .tit{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#ffe4da}
.podio .eq{font-size:27px;font-weight:800;color:#fff;line-height:1.05;
  text-shadow:0 2px 10px rgba(0,0,0,.45)}
.podio .pts{font-size:12px;color:#ffeee8;font-variant-numeric:tabular-nums}
.podio .chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;
  max-height:140px;overflow-y:auto;margin-top:2px}
.podio .chip{font-size:10.5px;font-weight:600;color:#fff;padding:3px 8px;border-radius:20px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.30);white-space:nowrap;cursor:help}
.podio .chip.lider{background:#fff;color:var(--acento-forte);border-color:#fff}
.podio .sup{font-size:11px;color:#ffeee8;opacity:.9}
.podio .empate{font-size:10px;color:#ffe4da;line-height:1.35;max-width:340px;cursor:help;
  border-top:1px solid rgba(255,255,255,.25);padding-top:6px;margin-top:2px}
.podio .lista-lugares{display:flex;flex-direction:column;gap:6px;width:100%;max-width:400px}
.podio .lugar{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:8px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);font-size:12.5px;
  color:#fff;backdrop-filter:blur(3px)}
.podio .lugar .nomes{text-align:left;line-height:1.25}
.podio .lugar .detalhe{margin-left:auto;font-size:10.5px;opacity:.85;white-space:nowrap}
/* ============================================================
   Ajustes no modo fluido — precisa vir DEPOIS das regras base
   da tela de cadastro, senão elas vencem por ordem na cascata.
   ============================================================ */
@media (max-width:1099px){
  .aj{position:static;grid-column:1/-1;inset:auto;height:auto;gap:12px;padding-bottom:8px}
  .aj-estado{position:static;grid-column:1/-1;inset:auto;height:auto;flex-wrap:wrap}
  .aj-abas{margin-top:0}
  .aj-cab{flex-direction:column;align-items:stretch;gap:10px}
  .aj-novo{width:100%;height:44px}
  .aj-filtro{flex:1 1 140px}
  .aj-filtro select,.aj-filtro input{min-width:0;width:100%;height:40px}
  .aj-cont{margin-left:0;width:100%}
  .aj-tabela{max-height:60vh;min-height:220px}
  .aj-fundo{position:fixed}
}
.podio .lugar b{font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.podio .lugar .detalhe + b{margin-left:0}

/* pódio invertido: mesma linguagem, sem foto e em tom de alerta */
.podio.piores{justify-content:center;gap:8px;padding:10px 14px 12px;
  background-image:none;background:#2b2320}
.podio.piores::before{background:linear-gradient(180deg,rgba(198,40,40,.18),rgba(198,40,40,.30))}
.podio.piores .tit{color:#ffc9c4}
.podio.piores .lugar{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18);padding:5px 12px;font-size:12px}
.podio.piores .lugar.pior{background:rgba(198,40,40,.62);border-color:rgba(255,255,255,.34)}
.podio.piores .empate{color:#e8cfc9;max-width:400px}

let IDX_INSPETOR, IDX_EQUIPE, FATO;

function reconstruirModelo() {
  IDX_INSPETOR = Object.fromEntries(INSPETORES.map(r => [r[0], r]));
  IDX_EQUIPE   = Object.fromEntries(EQUIPES.map(r => [r[0], r]));

       chaves versionadas por mês (INSPETOR_ID / EQUIPE_ID em "Meta Inspetores" e
       "Equipes"), e só existiam de abr a jul/2026. As inspeções de agosto ficavam
       sem equipe e sem inspetor, caindo no grupo "(vazio)" — mesmo com a equipe
       cadastrada, porque faltava a versão daquele mês.

       inspeção casa pelo nome em qualquer mês. Quem continua em "(vazio)" é só
       quem realmente não está cadastrado.
       META_MESES segue valendo para a META, que essa sim é cadastrada por mês. */
    const insp = IDX_INSPETOR[r[1]];
    const eq   = IDX_EQUIPE[r[2]];
    return {
      id: r[0], inspetor: insp ? r[1] : "", inspetorBruto: r[1],
      equipe: eq ? r[2] : "", equipeBruta: r[2],
      tipo: r[3], data: new Date(y, m - 1, d),
      dataStr: r[4], mesAno, serial: "" + y + String(m).padStart(2, "0"),
      ano: "" + y, mes: "" + m,
      polo: insp ? insp[1] : "", funcao: insp ? insp[2] : "",
      supervisor: eq ? eq[2] : "", tipoEquipe: eq ? eq[1] : ""
    };

     em vez de uma lista fixa para não precisar mexer aqui a cada mês novo. */
  MESES_COM_INSPECAO = new Set(FATO.map(x => x.mesAno));

}

function fatoFiltrado(ignorar) {
  const ig = new Set(ignorar || []);
  const ok = (c, v) => ig.has(c) || bate(c, v);
  return FATO.filter(f =>
    ok("ano", f.ano) && ok("mes", f.mes) && ok("polo", f.polo) &&
    ok("inspetor", f.inspetor) && ok("funcao", f.funcao) &&
    ok("supervisor", f.supervisor) && ok("equipe", f.equipe));
}

/* ---------- Medidas ---------- */
// #Medidas
function Dias_uteis(ms)          { return (ms || mesesAtivos()).reduce((a, d) => a + d[2], 0); }
function Dias_uteis_ate_hoje(ms) { return (ms || mesesAtivos()).reduce((a, d) => a + d[3], 0); }

function inspetoresValidos() {
  return INSPETORES.filter(i => bate("polo", i[1]) && bate("inspetor", i[0]) && bate("funcao", i[2]));
}
function Qtd_Inspetor(ms) {
  const meses = (ms || mesesAtivos()).map(d => d[0]).filter(m => META_MESES.includes(m));
  return inspetoresValidos().length * meses.length;
}
// Meta_Insp = SUMX('Meta Inspetores'; [META INSPEÇÃO DINAMICA]) — metas versionadas por mês
function Meta_Insp(ms) {
  const meses = (ms || mesesAtivos()).map(d => d[0]).filter(m => META_MESES.includes(m));
  const porMes = inspetoresValidos().reduce((a, i) => a + i[3], 0);
  return porMes * meses.length;
}
// Meta_insp_dia = Meta_Insp / Dias_uteis * Dias_uteis_até_hoje
function Meta_insp_dia(ms) {
  const du = Dias_uteis(ms);
  return du ? Meta_Insp(ms) / du * Dias_uteis_ate_hoje(ms) : 0;
}

// #Medidas_Teccel
const Qtd_Insp        = f => f.length;
const linhasNC        = f => f.flatMap(x => NC_BY_ID[x.id] || []);
const Qtd_NC          = f => linhasNC(f).length;
const Qtd_Inspecao_NC = f => new Set(linhasNC(f).map(r => r[0])).size;
const ICIT            = f => f.length ? (f.length - Qtd_Inspecao_NC(f)) / f.length : null;
const PontosNC        = f => linhasNC(f).reduce((a, r) => a + r[4], 0);

const pct = (a, b) => (b ? a / b : null);
// % Atingida = MIN(DIVIDE([Qtd]; [Meta_insp_dia]); 1) — o original limita em 100%
const pctAtingida = (a, b) => (b ? Math.min(a / b, 1) : null);

/* Pacote de KPIs do cabeçalho */
function kpis(f, ms) {
  f  = f  || fatoFiltrado();
  ms = ms || mesesAtivos();
  const q = Qtd_Insp(f), nc = Qtd_Inspecao_NC(f), meta = Meta_Insp(ms), md = Meta_insp_dia(ms);
  return {
    Qtd_Insp: q, Qtd_Inspecao_NC: nc, Qtd_NC: Qtd_NC(f),
    Meta_Insp: meta, Meta_insp_dia: md,
    Dias_uteis: Dias_uteis(ms), Dias_uteis_ate_hoje: Dias_uteis_ate_hoje(ms),
    Qtd_Inspetor: Qtd_Inspetor(ms),
    ICIT: ICIT(f),
    pctInspecao: pctAtingida(q, md), // %Inspeção_Teccel (= % Atingida, limitado a 100%)
    pctMetaTotal: pct(q, meta)      // %MetaInspTeccelTotal
  };
}

/* Agrupamento genérico: devolve [{chave, fato[], qtd, nc, icit, meta, metaDia, pct}] */
function agrupar(f, campo, ms) {
  ms = ms || mesesAtivos();
  const mapa = new Map();
  f.forEach(x => {
    const k = x[campo] || "(vazio)";
    if (!mapa.has(k)) mapa.set(k, []);
    mapa.get(k).push(x);
  });
  return [...mapa].map(([k, rows]) => {
    let meta = 0, metaDia = 0;
    if (campo === "inspetor") {
      const i = IDX_INSPETOR[k];
      const meses = ms.map(d => d[0]).filter(m => META_MESES.includes(m)).length;
      const du = Dias_uteis(ms);
      meta = i ? i[3] * meses : 0;
      metaDia = du ? meta / du * Dias_uteis_ate_hoje(ms) : 0;
    }
    const nc = Qtd_Inspecao_NC(rows);
    return {
      chave: k, fato: rows, qtd: rows.length, nc, ncLinhas: Qtd_NC(rows),
      icit: ICIT(rows), meta, metaDia, pct: pctAtingida(rows.length, metaDia),
      pctTotal: pct(rows.length, meta), pontosNC: PontosNC(rows)
    };
  });
}

/* Agrupamento por inspetor incluindo quem tem meta mas nenhuma inspeção
   (o original lista todos os cadastrados em "Meta Inspetores") */
function porInspetor(f, ms, comVazio) {
  ms = ms || mesesAtivos();
  const g = agrupar(f, "inspetor", ms);
  const achados = new Set(g.map(x => x.chave));
  const meses = ms.map(d => d[0]).filter(m => META_MESES.includes(m)).length;
  const du = Dias_uteis(ms), duh = Dias_uteis_ate_hoje(ms);
  inspetoresValidos().forEach(i => {
    if (achados.has(i[0])) return;
    const meta = i[3] * meses;
    g.push({
      chave: i[0], fato: [], qtd: 0, nc: 0, ncLinhas: 0, icit: null,
      meta, metaDia: du ? meta / du * duh : 0, pct: 0, pctTotal: 0, pontosNC: 0
    });
  });
  return g.filter(x => comVazio || x.chave !== "(vazio)");
}

/* Jornada Segura — pontuação por equipe */
function jornada(f, ms) {
  ms = ms || mesesAtivos();
  // pontua todo mês que teve inspeção — o mesmo conjunto que gera os descontos
  const mesesPonto = ms.map(d => d[0]).filter(m => MESES_COM_INSPECAO.has(m)).length;
  const linhas = agrupar(f, "equipe", ms).map(g => {
    const eq = IDX_EQUIPE[g.chave];
    const ini = eq ? eq[3] * mesesPonto : null;
    const fim = ini === null ? null : ini + g.pontosNC;
    return {
      equipe: g.chave, supervisor: eq ? eq[2] : "", tipo: eq ? eq[1] : "",
      qtd: g.qtd, nc: g.nc, ncLinhas: g.ncLinhas, icit: g.icit,
      pontosIniciais: ini, pontosNC: g.pontosNC, pontosFinal: fim,
      // Critério Desempate = Pontos Final + (inspeções sem N.C)/10  — confirmado no relatório original
      desempate: fim === null ? null : fim + (g.qtd - g.nc) / 10
    };
  });
  linhas.sort((a, b) => (b.desempate ?? -1e9) - (a.desempate ?? -1e9));
  linhas.forEach((l, i) => l.ranking = l.desempate === null ? null : i + 1);
  return linhas;
}

/* ---------- Resumo mensal ----------
   Uma linha por mês, opcionalmente desdobrada por polo ou por equipe.

   A meta é cadastrada por inspetor, então ela existe por mês e por polo (soma
   das metas de quem é daquele polo) mas NÃO por equipe — na visão por equipe
   entram no lugar os pontos da Jornada Segura.
   Meses fora de META_MESES não têm meta cadastrada: entram com meta zero,
   como no relatório original. */
function nomeMes(mesAno) {
  const [m, y] = mesAno.split("/");
  return MESES_NOME[+m] + "/" + y.slice(2);
}

function resumoMensal(f, ms, campo) {
  ms = ms || mesesAtivos();
  const linhas = [];

  ms.forEach(d => {
    const mesAno = d[0];
    const doMes = f.filter(x => x.mesAno === mesAno);
    const temMeta = META_MESES.includes(mesAno);
    const du = Dias_uteis([d]), duh = Dias_uteis_ate_hoje([d]);
    const proporcional = meta => (du ? meta / du * duh : 0);

    const base = rows => {
      const metaDia = 0;
      return { mes: nomeMes(mesAno), mesAno, qtd: rows.length,
        nc: Qtd_Inspecao_NC(rows), ncLinhas: Qtd_NC(rows), icit: ICIT(rows),
        pontosNC: PontosNC(rows), metaDia };
    };

    if (!campo) {
      const meta = temMeta ? Meta_Insp([d]) : 0, metaDia = proporcional(meta);
      linhas.push(Object.assign(base(doMes), {
        chave: "", meta, metaDia, pct: pctAtingida(doMes.length, metaDia),
        inspetores: temMeta ? inspetoresValidos().length : 0
      }));
      return;
    }

    /* Chaves do mês: as que aparecem nas inspeções mais as cadastradas, para
       quem não fez nenhuma inspeção aparecer com zero em vez de sumir. */
    const chaves = new Map();
    doMes.forEach(x => {
      const k = x[campo] || "(vazio)";
      if (!chaves.has(k)) chaves.set(k, []);
      chaves.get(k).push(x);
    });
    if (campo === "polo" && temMeta)
      inspetoresValidos().forEach(i => { if (!chaves.has(i[1])) chaves.set(i[1], []); });

    // dentro do mês, quem mais inspecionou primeiro; empate resolve pelo nome
    [...chaves].sort((a, b) => b[1].length - a[1].length ||
      String(a[0]).localeCompare(String(b[0]), "pt-BR", { numeric: true }))
    .forEach(([k, rows]) => {
      let meta = 0, extra = {};
      if (campo === "polo") {
        meta = temMeta ? inspetoresValidos().filter(i => i[1] === k)
          .reduce((a, i) => a + i[3], 0) : 0;
        extra.inspetores = temMeta ? inspetoresValidos().filter(i => i[1] === k).length : 0;
      } else {
        // equipe: sem meta cadastrada; o que vale é a pontuação da Jornada Segura
        const eq = IDX_EQUIPE[k];
        extra.supervisor = eq ? eq[2] : "";
        // mesmo critério da Jornada Segura: mês com inspeção pontua
        extra.pontosIniciais = eq && MESES_COM_INSPECAO.has(mesAno) ? eq[3] : null;
      }
      const metaDia = proporcional(meta);
      const l = Object.assign(base(rows), extra, {
        chave: k, meta, metaDia, pct: meta ? pctAtingida(rows.length, metaDia) : null
      });
      if (campo === "equipe")
        l.pontosFinal = l.pontosIniciais === null ? null : l.pontosIniciais + l.pontosNC;
      linhas.push(l);
    });
  });

  /* Linhas sem inspeção e sem meta só poluiriam a tabela */
  return linhas.filter(l => l.qtd > 0 || l.meta > 0 || l.pontosIniciais);
}

/* Séries temporais */
function porMes(f, ms) {
  ms = ms || mesesAtivos();
  return ms.map(d => {
    const rows = f.filter(x => x.mesAno === d[0]);
    const nc = Qtd_Inspecao_NC(rows);
    const temMeta = META_MESES.includes(d[0]);
    const meta = temMeta ? Meta_Insp([d]) : 0;
    return {
      chave: MESES_NOME[+d[0].split("/")[0]] + "/" + d[0].split("/")[1].slice(2),
      mesAno: d[0], qtd: rows.length, nc, ncLinhas: Qtd_NC(rows), icit: ICIT(rows),
      meta, metaDia: Meta_insp_dia([d]), pct: pct(rows.length, Meta_insp_dia([d])),
      qtdInspetor: temMeta ? inspetoresValidos().length : 0
    };
  });
}

function porDia(f) {
  const mapa = new Map();
  f.forEach(x => {
    const k = x.data.getTime();
    if (!mapa.has(k)) mapa.set(k, []);
    mapa.get(k).push(x);
  });
  return [...mapa].sort((a, b) => a[0] - b[0]).map(([k, rows]) => ({
    chave: rows[0].dataStr.slice(0, 5), data: new Date(k),
    qtd: rows.length, nc: Qtd_Inspecao_NC(rows)
  }));
}

/* Inconformidades por categoria / pergunta (grão de resposta) */
function ncPorCampo(f, i) {
  const linhas = linhasNC(f);
  const mapa = new Map();
  linhas.forEach(r => {
    const k = r[i] || "(sem categoria)";
    mapa.set(k, (mapa.get(k) || 0) + 1);
  });
  return [...mapa].map(([chave, qtd]) => ({ chave, qtd })).sort((a, b) => b.qtd - a.qtd);
}
function gravidades(f) {
  const g = { "Leve": 0, "Grave": 0, "Gravíssimo": 0, "": 0 };
  linhasNC(f).forEach(r => g[r[3]] = (g[r[3]] || 0) + 1);
  return g;
}

/* Valores disponíveis para cada slicer (respeitando os demais filtros) */
function opcoes(campo) {
  const base = fatoFiltrado([campo]);
  const vals = new Set();
  if (campo === "ano" || campo === "mes") {
    DDATA.forEach(d => {
      const [m, y] = d[0].split("/");
      vals.add(campo === "ano" ? y : m);
    });
  } else {
    base.forEach(f => { if (f[campo]) vals.add(f[campo]); });
    if (campo === "inspetor") INSPETORES.forEach(i => vals.add(i[0]));
    if (campo === "polo")     INSPETORES.forEach(i => vals.add(i[1]));
    if (campo === "funcao")   INSPETORES.forEach(i => vals.add(i[2]));
  }
  return [...vals].sort((a, b) =>
    campo === "mes" ? a - b : String(a).localeCompare(String(b), "pt-BR", { numeric: true }));
}

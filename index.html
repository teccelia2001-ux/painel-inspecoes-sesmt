<script>
/* ============================================================
   SERVIDOR — cadastros de equipes e inspetores no Supabase

   Leitura é pública: qualquer pessoa que abre o painel recebe os
   cadastros do banco. Escrita exige login (política de RLS).

   Se o banco não responder, o painel segue com os dados embutidos
   em data.js — nunca fica em branco por causa de rede.

   A chave abaixo é a publicável (anon). Ela é pública por natureza:
   quem manda no que pode ser gravado é a RLS, não a chave.
   ============================================================ */

/* ------------------------------------------------------------
   PROJETO SUPABASE DO PAINEL

   Projeto próprio do painel (painel-sesmt, São Paulo). Para trocar:
       url   = Project Settings → API → Project URL
       chave = Project Settings → API → publishable / anon key
   ------------------------------------------------------------ */
const SERVIDOR = {
  url: "https://ldqegnfcjeljvywbravl.supabase.co",   // projeto painel-sesmt, São Paulo
  chave: "sb_publishable_4IcV3231DtKqDuBdoPdG8A_sgt8vbOP",
  // slug da Edge Function que cria o login do inspetor — ver acessoInspetor()
  funcaoAcesso: "smart-worker",
  sessao: "sesmt.sessao.v1"
};

const Banco = {
  ligado: false,          // vira true quando o banco responde
  usuario: null,          // e-mail de quem está autenticado
  admin: false,           // está na lista sesmt_admins?
  erro: null,

  /* Editar exige as três coisas: banco no ar, sessão válida e ser admin.
     Ter conta não basta: o direito de gravar vem da lista sesmt_admins,
     o que permite ter contas que só consultam. */
  podeEditar() { return this.ligado && this.autenticado() && this.admin; },

  /* ---------- sessão ---------- */
  carregarSessao() {
    try {
      const s = JSON.parse(localStorage.getItem(SERVIDOR.sessao) || "null");
      if (s && s.refresh) {
        this.token = s.token; this.usuario = s.email; this.refresh = s.refresh;
        this.expiraEm = s.expira_em;
        return true;
      }
      localStorage.removeItem(SERVIDOR.sessao);
    } catch (e) { /* sessão ilegível: segue deslogado */ }
    return false;
  },
  /* Alguns contextos bloqueiam o armazenamento (navegação privada,
     páginas abertas como data:). Nesses casos a sessão vale só enquanto
     a aba estiver aberta, em vez de a página quebrar. */
  guardarSessao(token, email, segundos, refresh) {
    this.token = token; this.usuario = email;
    if (refresh) this.refresh = refresh;
    this.expiraEm = Date.now() + (segundos || 3600) * 1000;
    try {
      localStorage.setItem(SERVIDOR.sessao, JSON.stringify({
        token, email, refresh: this.refresh, expira_em: this.expiraEm
      }));
    } catch (e) { /* sessão só em memória */ }
  },

  /* O token de acesso do Supabase dura cerca de uma hora. Em vez de mandar
     o usuário entrar de novo, trocamos pelo refresh token guardado. */
  async renovar() {
    if (!this.refresh) return false;
    try {
      const r = await fetch(`${SERVIDOR.url}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: { apikey: SERVIDOR.chave, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: this.refresh })
      });
      const j = await r.json();
      if (!r.ok || !j.access_token) return false;
      this.guardarSessao(j.access_token, this.usuario, j.expires_in, j.refresh_token);
      return true;
    } catch (e) { return false; }
  },
  async entrar(email, senha) {
    const r = await fetch(`${SERVIDOR.url}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SERVIDOR.chave, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password: senha })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.msg || "Não foi possível entrar");
    this.guardarSessao(j.access_token, email, j.expires_in, j.refresh_token);
    await this.verificarAdmin();
    if (!this.admin) throw new Error(
      "Esta conta entrou, mas não tem permissão de administrador do painel. " +
      "Peça para incluírem seu e-mail na lista de administradores.");
    return j;
  },
  sair() {
    this.token = null; this.usuario = null; this.admin = false;
    this.refresh = null; this.expiraEm = 0;
    try { localStorage.removeItem(SERVIDOR.sessao); } catch (e) { /* nada a limpar */ }
  },
  autenticado() { return !!this.token; },

  /* Pergunta ao banco se a conta desta sessão administra o painel.
     A resposta vem da função sesmt_e_admin(), que lê a lista de
     administradores — a lista em si não fica exposta. */
  async verificarAdmin() {
    if (!this.autenticado()) { this.admin = false; return false; }
    try {
      const r = await this.pedir("rpc/sesmt_e_admin", { method: "POST", body: "{}" });
      this.admin = r === true;
    } catch (e) {
      this.admin = false;
    }
    return this.admin;
  },

  /* ---------- REST ---------- */
  cabecalhos(extra) {
    return Object.assign({
      apikey: SERVIDOR.chave,
      Authorization: `Bearer ${this.token || SERVIDOR.chave}`,
      "Content-Type": "application/json"
    }, extra || {});
  },
  async pedir(caminho, opcoes, jaRenovou) {
    // Atenção à ordem: os cabeçalhos precisam ser montados DEPOIS de copiar
    // as opções, senão um `headers` vindo em opcoes (como o Prefer das
    // gravações) substitui o bloco inteiro e a requisição sai sem apikey.
    const req = Object.assign({}, opcoes);
    req.headers = this.cabecalhos(opcoes && opcoes.headers);
    const r = await fetch(`${SERVIDOR.url}/rest/v1/${caminho}`, req);
    const txt = await r.text();
    if (r.ok) return txt ? JSON.parse(txt) : null;

    let corpo = {};
    try { corpo = JSON.parse(txt); } catch (e) {}
    const msg = corpo.message || corpo.error_description || txt || `Erro ${r.status}`;

    // 42501 é violação de RLS: a sessão está boa, faltou permissão.
    // Token vencido vem sem código do Postgres — aí vale tentar renovar.
    const semPermissao = corpo.code === "42501" || r.status === 403;
    if ((r.status === 401 || r.status === 403) && !semPermissao && !jaRenovou && this.refresh) {
      if (await this.renovar()) return this.pedir(caminho, opcoes, true);
    }
    // O detalhe técnico vai junto: sem ele, "não deu certo" não diz onde olhar.
    const detalhe = `[HTTP ${r.status}${corpo.code ? " · " + corpo.code : ""}${
      this.refresh ? "" : " · sem refresh"}] ${msg}`;
    if (semPermissao) throw new Error(
      "O banco recusou a gravação: esta conta não tem permissão de administrador. " +
      "Saia e entre novamente; se persistir, confira se o e-mail está em sesmt_admins. " + detalhe);
    if (r.status === 401) throw new Error(
      "Sua sessão expirou e não foi possível renovar. Clique em Sair e entre de novo. " + detalhe);
    throw new Error(detalhe);
  },

  /* ---------- cadastros ---------- */
  async baixarCadastros() {
    const [eq, insp] = await Promise.all([
      this.pedir("sesmt_equipes?select=*&order=equipe"),
      this.pedir("sesmt_inspetores?select=*&order=inspetor")
    ]);
    this.ligado = true;
    this.erro = null;
    await this.verificarAdmin();
    return { equipes: eq, inspetores: insp };
  },
  /* ---------- acesso do inspetor ao app de inspeções ----------
     Criar conta exige a chave de serviço, que dá poder total sobre o
     banco. Este painel é público no GitHub Pages, então essa chave não
     pode morar aqui. Quem cria é a função criar-acesso, no servidor,
     que guarda a chave como segredo e confere se quem pediu é mesmo
     administrador — com o token de quem pediu, contra a mesma lista
     sesmt_admins que este painel usa. */
  async acessoInspetor(acao, inspetor, email, senha) {
    if (!this.podeEditar()) throw new Error("Só administrador pode mexer em acesso.");
    /* O slug é gerado pelo editor do Supabase e NÃO muda quando se renomeia
       a função: o campo Name de lá é só rótulo. Pior, publicar de novo pelo
       editor cria outra função, com outro slug, em vez de atualizar a que
       existe — foi assim que apareceram três no projeto, cada uma com uma
       versão diferente do código.

       Se a função for publicada de novo, o slug novo aparece na lista de
       Edge Functions, coluna URL, e é esta constante que muda. */
    const r = await fetch(SERVIDOR.url + "/functions/v1/" + SERVIDOR.funcaoAcesso, {
      method: "POST",
      headers: {
        apikey: SERVIDOR.chave,
        Authorization: "Bearer " + this.token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ acao, inspetor, email, senha })
    });
    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) {
      if (r.status === 404 && !j) {
        throw new Error("A função de criar acesso não respondeu. Confira, no Supabase, "
          + `se o slug dela ainda é ${SERVIDOR.funcaoAcesso}.`);
      }
      throw new Error((j && j.erro) || ("erro " + r.status));
    }
    return j;
  },

  criar(tabela, linha)      { return this.pedir(tabela, { method: "POST", body: JSON.stringify(linha), headers: { Prefer: "return=representation" } }); },
  atualizar(tabela, id, linha) { return this.pedir(`${tabela}?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(linha), headers: { Prefer: "return=representation" } }); },
  excluir(tabela, id)       { return this.pedir(`${tabela}?id=eq.${id}`, { method: "DELETE" }); }
};

/* ============================================================
   CADASTROS — o que a aba Ajustes manipula.
   Guarda a forma "rica" (com id e status) e mantém os arrays
   EQUIPES / INSPETORES do modelo sincronizados.
   ============================================================ */
const Cadastros = {
  equipes: [],       // {id, equipe, tipo, supervisor, pontos, ativa}
  inspetores: [],    // {id, inspetor, polo, funcao, meta_dinamica, meta_estatica, ativo}
  origem: "embutido",

  /* Dados de data.js, usados enquanto o banco não responde */
  doArquivo() {
    this.equipes = EQUIPES.map((r, i) => ({
      id: "local-e" + i, equipe: r[0], tipo: r[1], supervisor: r[2], pontos: r[3], ativa: true
    }));
    this.inspetores = INSPETORES.map((r, i) => ({
      id: "local-i" + i, inspetor: r[0], polo: r[1],
      funcao: r[2], meta_dinamica: r[3], meta_estatica: r[4], ativo: true
    }));
    this.origem = "embutido";
  },

  /* Reescreve os arrays que o modelo consome e recalcula tudo */
  aplicarNoModelo() {
    EQUIPES = this.equipes.filter(e => e.ativa)
      .map(e => [e.equipe, e.tipo || "", e.supervisor || "", Number(e.pontos) || 0]);
    INSPETORES = this.inspetores.filter(i => i.ativo)
      .map(i => [i.inspetor, i.polo || i.area || "", i.funcao || "",
                 Number(i.meta_dinamica) || 0, Number(i.meta_estatica) || 0]);
    reconstruirModelo();
  },

  async carregar() {
    this.doArquivo();
    try {
      const d = await Banco.baixarCadastros();
      if (d.equipes.length || d.inspetores.length) {
        this.equipes = d.equipes;
        // "Área" virou "Polo". Enquanto a migração não roda no banco, o valor
        // antigo é aproveitado para o painel não aparecer com o campo vazio.
        this.inspetores = d.inspetores.map(i => {
          if (i.polo === undefined && i.area !== undefined) i.polo = i.area;
          return i;
        });
        this.origem = "banco";
      }
    } catch (e) {
      Banco.ligado = false;
      Banco.erro = e.message;
    }
    this.aplicarNoModelo();
    return this.origem;
  },

  lista(tipo) { return tipo === "equipes" ? this.equipes : this.inspetores; },
  tabela(tipo) { return tipo === "equipes" ? "sesmt_equipes" : "sesmt_inspetores"; },

  async salvar(tipo, registro) {
    const tabela = this.tabela(tipo);
    const novo = !registro.id || String(registro.id).startsWith("local-");
    const corpo = Object.assign({}, registro);
    delete corpo.id; delete corpo.criada_em; delete corpo.atualizada_em;
    // resquício da migração Área→Polo: não mandar a coluna antiga de volta
    delete corpo.area;

    if (Banco.podeEditar()) {
      const r = novo ? await Banco.criar(tabela, corpo)
                     : await Banco.atualizar(tabela, registro.id, corpo);
      const salvo = Array.isArray(r) ? r[0] : r;
      const lista = this.lista(tipo);
      const i = lista.findIndex(x => x.id === registro.id);
      if (i >= 0) lista[i] = salvo; else lista.push(salvo);
    } else {
      // sem banco: vale só nesta sessão, para não travar o uso
      const lista = this.lista(tipo);
      const i = lista.findIndex(x => x.id === registro.id);
      if (i >= 0) lista[i] = Object.assign({}, lista[i], registro);
      else lista.push(Object.assign({ id: "local-" + Date.now() }, registro));
    }
    this.aplicarNoModelo();
  },

  async excluir(tipo, id) {
    if (Banco.podeEditar() && !String(id).startsWith("local-"))
      await Banco.excluir(this.tabela(tipo), id);
    const lista = this.lista(tipo);
    const i = lista.findIndex(x => x.id === id);
    if (i >= 0) lista.splice(i, 1);
    this.aplicarNoModelo();
  }
};

Banco.carregarSessao();
</script>
<script>
/* ============================================================
   VISUAIS — SVG puro, sem bibliotecas externas
   Réplica dos tipos usados no relatório original:
   lineClusteredColumnComboChart, Tachometer, waterfallChart, tableEx, card
   ============================================================ */

const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, txt) => {
  const n = document.createElementNS(NS, t);
  for (const k in a) if (a[k] !== null && a[k] !== undefined) n.setAttribute(k, a[k]);
  if (txt !== undefined) n.textContent = txt;
  return n;
};
const fmtN  = v => v === null || v === undefined ? "—" : Math.round(v).toLocaleString("pt-BR");
const fmtP  = (v, d = 1) => v === null || v === undefined ? "—" : (v * 100).toFixed(d).replace(".", ",") + "%";
const fmtD  = (v, d = 1) => v === null || v === undefined ? "—" : v.toFixed(d).replace(".", ",");
const corta = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

/* ---------- Combo: colunas agrupadas + linha (o visual mais usado) ---------- */
function comboChart(host, dados, opt) {
  opt = Object.assign({
    series: [{ key: "qtd", label: "Realizado", cor: "var(--c1)" }],
    linha: null, rotulo: "chave", pctLinha: true, rotacionar: true,
    metaLinha: null, maxRot: 14, minColuna: 0
  }, opt);

  const H = host.clientHeight;
  // com linha de % o rótulo do ponto sobe 11px: sem folga no topo ele sai cortado
  const m = { t: opt.linha ? 26 : 16, r: opt.linha ? 44 : 14, b: opt.rotacionar ? 62 : 30, l: 40 };

  /* No celular caberiam 68 dias em 500px — as barras viram fios e os rótulos
     somem. Havendo largura mínima por coluna, o gráfico cresce e rola na
     horizontal em vez de espremer (e perder) a informação. */
  const preciso = opt.minColuna ? dados.length * opt.minColuna + m.l + m.r : 0;
  const W = Math.max(host.clientWidth, preciso);
  host.style.overflowX = W > host.clientWidth ? "auto" : "";
  host.style.overflowY = "hidden";
  const iw = Math.max(10, W - m.l - m.r), ih = Math.max(10, H - m.t - m.b);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = "";
  host.appendChild(svg);
  if (!dados.length) { svg.appendChild(el("text", { x: W / 2, y: H / 2, class: "vazio", "text-anchor": "middle" }, "sem dados")); return; }

  const maxV = Math.max(1, ...dados.flatMap(d => opt.series.map(s => d[s.key] || 0)));
  const esc  = v => ih - (v / maxV) * ih;
  const bw   = iw / dados.length;
  const sw   = Math.min(26, (bw * 0.68) / opt.series.length);

  const g = el("g", { transform: `translate(${m.l},${m.t})` });
  svg.appendChild(g);

  /* grade + eixo Y */
  for (let i = 0; i <= 4; i++) {
    const y = ih - (ih / 4) * i, v = (maxV / 4) * i;
    g.appendChild(el("line", { x1: 0, x2: iw, y1: y, y2: y, class: "grade" }));
    g.appendChild(el("text", { x: -8, y: y + 4, class: "eixo", "text-anchor": "end" }, fmtN(v)));
  }

  /* Mantém o texto dentro da área desenhada: sem isso os rótulos da primeira e
     da última coluna saem pela borda do SVG e aparecem cortados. */
  const dentroX = x => Math.max(-m.l + 4, Math.min(iw + m.r - 4, x));
  const dentroY = y => Math.max(-m.t + 9, y);

  /* colunas — rotulos[i] guarda onde cada quantidade foi escrita, para a
     porcentagem depois não ser escrita por cima de nenhuma delas */
  const rotulos = [];
  const anotar = (i, x, y) => { (rotulos[i] = rotulos[i] || []).push({ x, y }); };
  dados.forEach((d, i) => {
    const x0 = i * bw + (bw - sw * opt.series.length) / 2;
    opt.series.forEach((s, j) => {
      const v = d[s.key] || 0, y = esc(v);
      const r = el("rect", { x: x0 + j * sw, y, width: sw - 2, height: Math.max(0, ih - y), fill: s.cor, rx: 2, class: "barra" });
      r.appendChild(el("title", {}, `${d[opt.rotulo]}\n${s.label}: ${fmtN(v)}`));
      g.appendChild(r);
      // a quantidade aparece sempre que a coluna for larga o bastante para ela caber
      if (v > 0 && sw >= 11) {
        const xr = dentroX(x0 + j * sw + (sw - 2) / 2), yr = dentroY(y - 4);
        g.appendChild(el("text", { x: xr, y: yr, class: "rotulo", "text-anchor": "middle" }, fmtN(v)));
        anotar(i, xr, yr);
      }
    });
    /* Colunas estreitas (o gráfico por dia, com o ano inteiro) não têm espaço
       para um número por barra. Em vez de ficar sem informação nenhuma, escreve
       só o valor da primeira série — a quantidade — acima do grupo. */
    if (!rotulos[i] && bw >= 15) {
      const v = d[opt.series[0].key] || 0;
      if (v > 0) {
        const xr = dentroX(i * bw + bw / 2), yr = dentroY(esc(v) - 4);
        g.appendChild(el("text", { x: xr, y: yr, class: "rotulo", "text-anchor": "middle" }, fmtN(v)));
        anotar(i, xr, yr);
      }
    }
  });

  /* meta como linha de referência */
  if (opt.metaLinha !== null && opt.metaLinha !== undefined && opt.metaLinha <= maxV) {
    const y = esc(opt.metaLinha);
    g.appendChild(el("line", { x1: 0, x2: iw, y1: y, y2: y, class: "meta" }));
  }

  /* linha secundária (%) */
  if (opt.linha) {
    const vals = dados.map(d => d[opt.linha.key]);
    const finitos = vals.filter(v => v !== null && v !== undefined);
    const maxL = opt.pctLinha ? Math.max(1, ...finitos) : Math.max(1, ...finitos);
    const escL = v => ih - (v / maxL) * ih;
    let dpath = "", prev = false;
    dados.forEach((d, i) => {
      const v = d[opt.linha.key], x = i * bw + bw / 2;
      if (v === null || v === undefined) { prev = false; return; }
      dpath += (prev ? "L" : "M") + x + " " + escL(v);
      prev = true;
    });
    const cor = opt.linha.cor || "var(--c-linha)";
    // halo branco por baixo: destaca a linha mesmo cruzando as colunas
    g.appendChild(el("path", { d: dpath, fill: "none", stroke: "var(--painel)", "stroke-width": 6,
      "stroke-linejoin": "round", "stroke-linecap": "round", opacity: .9 }));
    g.appendChild(el("path", { d: dpath, fill: "none", stroke: cor, "stroke-width": 3.2,
      "stroke-linejoin": "round", "stroke-linecap": "round" }));
    dados.forEach((d, i) => {
      const v = d[opt.linha.key];
      if (v === null || v === undefined) return;
      const x = i * bw + bw / 2, y = escL(v);
      g.appendChild(el("circle", { cx: x, cy: y, r: 5, fill: "var(--painel)" }));
      const c = el("circle", { cx: x, cy: y, r: 3.4, fill: cor });
      c.appendChild(el("title", {}, `${d[opt.rotulo]}\n${opt.linha.label}: ${opt.pctLinha ? fmtP(v) : fmtD(v)}`));
      g.appendChild(c);
      // valor exato (uma casa decimal) sempre que houver espaço para o rótulo
      if (bw >= 34) {
        const xl = dentroX(x);
        let yl = y - 11;
        /* Enquanto cair em cima de alguma quantidade da mesma coluna, sobe
           para logo acima dela. São no máximo três rótulos por coluna. */
        const perto = () => (rotulos[i] || []).filter(r =>
          Math.abs(r.x - xl) < 16 && Math.abs(r.y - yl) < 11);
        for (let n = 0; n < 4; n++) {
          const c = perto();
          if (!c.length) break;
          yl = Math.min(...c.map(r => r.y)) - 11;
        }
        g.appendChild(el("text", { x: xl, y: dentroY(yl), class: "rotulo-linha", "text-anchor": "middle" },
          opt.pctLinha ? fmtP(v, 1) : fmtD(v, 1)));
      }
    });
    for (let i = 0; i <= 4; i++) {
      const y = ih - (ih / 4) * i, v = (maxL / 4) * i;
      g.appendChild(el("text", { x: iw + 8, y: y + 4, class: "eixo eixo2" }, opt.pctLinha ? fmtP(v, 0) : fmtD(v, 0)));
    }
  }

  /* eixo X */
  dados.forEach((d, i) => {
    const x = i * bw + bw / 2;
    const t = el("text", { x, y: ih + 14, class: "eixo", "text-anchor": opt.rotacionar ? "end" : "middle" },
      corta(String(d[opt.rotulo]), opt.maxRot));
    if (opt.rotacionar) t.setAttribute("transform", `rotate(-35 ${x} ${ih + 14})`);
    g.appendChild(t);
  });
}

/* ---------- Tachometer (velocímetro) ---------- */
function gauge(host, valor, opt) {
  opt = Object.assign({ min: 0, max: 1, faixas: [0.5, 0.8], formato: fmtP, alvo: null }, opt);
  const W = host.clientWidth, H = host.clientHeight;
  const cx = W / 2, cy = H * 0.72, R = Math.min(W * 0.42, H * 0.62), r = R * 0.62;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = ""; host.appendChild(svg);

  const ang = v => Math.PI * (1 - Math.min(1, Math.max(0, (v - opt.min) / (opt.max - opt.min))));
  const arco = (a0, a1, cor) => {
    const p = (a, rr) => [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
    const [x0, y0] = p(a0, R), [x1, y1] = p(a1, R), [x2, y2] = p(a1, r), [x3, y3] = p(a0, r);
    const large = Math.abs(a1 - a0) > Math.PI ? 1 : 0;
    return el("path", {
      d: `M${x0} ${y0} A${R} ${R} 0 ${large} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${large} 0 ${x3} ${y3} Z`,
      fill: cor
    });
  };
  const lim = [opt.min, ...opt.faixas, opt.max];
  const cores = ["var(--ruim)", "var(--medio)", "var(--bom)"];
  for (let i = 0; i < lim.length - 1; i++) svg.appendChild(arco(ang(lim[i]), ang(lim[i + 1]), cores[i] || "var(--bom)"));

  if (valor !== null && valor !== undefined) {
    const a = ang(valor);
    const px = cx + (R * 0.98) * Math.cos(a), py = cy - (R * 0.98) * Math.sin(a);
    svg.appendChild(el("line", { x1: cx, y1: cy, x2: px, y2: py, class: "ponteiro" }));
    svg.appendChild(el("circle", { cx, cy, r: 6, class: "pivo" }));
  }
  svg.appendChild(el("text", { x: cx, y: cy + 34, class: "gauge-valor", "text-anchor": "middle" }, opt.formato(valor)));
  svg.appendChild(el("text", { x: cx - R - 2, y: cy + 16, class: "eixo", "text-anchor": "middle" }, opt.formato(opt.min, 0)));
  svg.appendChild(el("text", { x: cx + R + 2, y: cy + 16, class: "eixo", "text-anchor": "middle" }, opt.formato(opt.max, 0)));
}

/* ---------- Waterfall (inconformidades por categoria) ---------- */
function waterfall(host, dados) {
  const W = host.clientWidth, H = host.clientHeight;
  const m = { t: 18, r: 12, b: 58, l: 38 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = ""; host.appendChild(svg);
  if (!dados.length) { svg.appendChild(el("text", { x: W / 2, y: H / 2, class: "vazio", "text-anchor": "middle" }, "sem dados")); return; }

  const total = dados.reduce((a, d) => a + d.qtd, 0);
  const passos = [...dados, { chave: "Total", qtd: total, total: true }];
  const max = total;
  const bw = iw / passos.length, sw = Math.min(40, bw * 0.62);
  const g = el("g", { transform: `translate(${m.l},${m.t})` });
  svg.appendChild(g);
  for (let i = 0; i <= 4; i++) {
    const y = ih - (ih / 4) * i;
    g.appendChild(el("line", { x1: 0, x2: iw, y1: y, y2: y, class: "grade" }));
    g.appendChild(el("text", { x: -8, y: y + 4, class: "eixo", "text-anchor": "end" }, fmtN((max / 4) * i)));
  }
  let acc = 0;
  passos.forEach((d, i) => {
    const x = i * bw + (bw - sw) / 2;
    const y0 = ih - (acc / max) * ih;
    const alt = (d.qtd / max) * ih;
    const y = d.total ? ih - alt : y0 - alt;
    const rect = el("rect", { x, y, width: sw, height: Math.max(1, alt), rx: 2, fill: d.total ? "var(--c-total)" : "var(--ruim)" });
    rect.appendChild(el("title", {}, `${d.chave}: ${d.qtd}`));
    g.appendChild(rect);
    g.appendChild(el("text", { x: x + sw / 2, y: y - 5, class: "rotulo", "text-anchor": "middle" }, fmtN(d.qtd)));
    if (!d.total) acc += d.qtd;
    const t = el("text", { x: x + sw / 2, y: ih + 14, class: "eixo", "text-anchor": "end" }, corta(d.chave, 16));
    t.setAttribute("transform", `rotate(-35 ${x + sw / 2} ${ih + 14})`);
    g.appendChild(t);
  });
}

/* ---------- Barras horizontais (TOP 5 inconformidades) ---------- */
function barrasH(host, dados, opt) {
  opt = Object.assign({ cor: "var(--ruim)", maxRot: 46 }, opt);
  const W = host.clientWidth, H = host.clientHeight;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = ""; host.appendChild(svg);
  if (!dados.length) { svg.appendChild(el("text", { x: W / 2, y: H / 2, class: "vazio", "text-anchor": "middle" }, "sem dados")); return; }
  const max = Math.max(...dados.map(d => d.qtd));
  const alt = Math.min(34, (H - 12) / dados.length);
  dados.forEach((d, i) => {
    const y = 8 + i * alt;
    const larg = (d.qtd / max) * (W - 40);
    const r = el("rect", { x: 0, y, width: Math.max(2, larg), height: alt - 8, rx: 2, fill: opt.cor });
    r.appendChild(el("title", {}, `${d.chave}\n${d.qtd} ocorrência(s)`));
    svg.appendChild(r);
    svg.appendChild(el("text", { x: 6, y: y + (alt - 8) / 2 + 4, class: "rotulo-barra" }, corta(d.chave, opt.maxRot)));
    svg.appendChild(el("text", { x: Math.max(2, larg) + 6, y: y + (alt - 8) / 2 + 4, class: "rotulo" }, d.qtd));
  });
}

/* ---------- Tabela (tableEx) ---------- */
function tabela(host, colunas, linhas) {
  const t = document.createElement("table");
  t.className = "tbl";
  const thead = document.createElement("thead"), tr = document.createElement("tr");
  colunas.forEach(c => {
    const th = document.createElement("th");
    th.textContent = c.titulo;
    if (c.num) th.classList.add("num");
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb = document.createElement("tbody");
  linhas.forEach(l => {
    const r = document.createElement("tr");
    colunas.forEach(c => {
      const td = document.createElement("td");
      const v = c.valor(l);
      if (v instanceof Node) td.appendChild(v); else td.textContent = v;
      if (c.num) td.classList.add("num");
      if (c.classe) td.className += " " + (c.classe(l) || "");
      r.appendChild(td);
    });
    tb.appendChild(r);
  });
  t.appendChild(tb);
  host.innerHTML = ""; host.appendChild(t);
}
</script>
<script>
/* ============================================================
   AJUSTES — cadastro de equipes e inspetores
   Tabela com filtros, ações por linha e diálogo de criação/edição.
   ============================================================ */

/* Sugestão de e-mail a partir do nome: "José Pereira" -> jose.pereira */
const semAcentoAj = t => String(t || "").normalize("NFD")
  .replace(/[̀-ͯ]/g, "").toLowerCase().trim();

const CAMPOS_EQUIPE = [
  { k: "equipe", rot: "Nome da equipe", obrigatorio: true },
  { k: "tipo", rot: "Tipo de equipe", tipo: "select", opcoes: [
      ["LM", "Linha morta (rede desligada)"], ["LV", "Linha viva"], ["MAN", "Manutenção"],
      ["PER", "Perdas"], ["PLA", "Plantão"], ["POD", "Poda"], ["REA", "Reaviso"]] },
  { k: "supervisor", rot: "Supervisor", tipo: "select-livre", origem: () => [...new Set(
      Cadastros.inspetores.map(i => i.inspetor)
        .concat(Cadastros.equipes.map(e => e.supervisor)))].filter(Boolean).sort() },
  { k: "pontos", rot: "Pontos iniciais por mês", tipo: "numero", padrao: 100 },
  { k: "ativa", rot: "Situação", tipo: "booleano", rotSim: "Ativa", rotNao: "Inativa", padrao: true }
];

const CAMPOS_INSPETOR = [
  { k: "inspetor", rot: "Nome do inspetor", obrigatorio: true },
  { k: "funcao", rot: "Função", tipo: "select-livre", origem: () => [...new Set(
      Cadastros.inspetores.map(i => i.funcao))].filter(Boolean).sort() },
  { k: "polo", rot: "Polo", tipo: "select-livre", origem: () => [...new Set(
      Cadastros.inspetores.map(i => i.polo))].filter(Boolean).sort() },
  { k: "meta_dinamica", rot: "Meta de inspeção dinâmica (por mês)", tipo: "numero", padrao: 0 },
  { k: "meta_estatica", rot: "Meta de inspeção estática (por mês)", tipo: "numero", padrao: 0 },
  { k: "ativo", rot: "Situação", tipo: "booleano", rotSim: "Ativo", rotNao: "Inativo", padrao: true }
];

const SECOES = {
  equipes: {
    titulo: "Equipes", desc: "Equipes de campo avaliadas na Jornada Segura.",
    novo: "Nova equipe", chave: "equipe", campos: CAMPOS_EQUIPE, statusK: "ativa",
    filtros: [["supervisor", "Supervisor"], ["tipo", "Tipo"], ["ativa", "Situação"]],
    colunas: [
      { t: "Equipe", v: r => r.equipe, forte: true },
      { t: "Supervisor", v: r => r.supervisor || "—" },
      { t: "Tipo", v: r => TIPOS_EQUIPE[r.tipo] || r.tipo || "—", etiqueta: true },
      { t: "Pontos", v: r => fmtN(r.pontos), num: true }
    ]
  },
  inspetores: {
    titulo: "Inspetores", desc: "Quem faz as inspeções e a meta individual de cada um.",
    novo: "Novo inspetor", chave: "inspetor", campos: CAMPOS_INSPETOR, statusK: "ativo",
    filtros: [["funcao", "Função"], ["polo", "Polo"], ["ativo", "Situação"]],
    /* "acesso" não é coluna do banco: é derivado do user_id, para dar
       um filtro de "quem ainda não tem login" sem inventar campo. */
    colunas: [
      { t: "Inspetor", v: r => r.inspetor, forte: true },
      { t: "Função", v: r => r.funcao || "—" },
      { t: "Polo", v: r => r.polo || "—", etiqueta: true },
      { t: "Meta dinâmica", v: r => fmtN(r.meta_dinamica), num: true },
      { t: "Meta estática", v: r => fmtN(r.meta_estatica), num: true },
      { t: "Acesso", v: r => r.user_id ? "tem login" : "—", etiqueta: true }
    ]
  }
};
const TIPOS_EQUIPE = { LM: "Linha morta", LV: "Linha viva", MAN: "Manutenção",
  PER: "Perdas", PLA: "Plantão", POD: "Poda", REA: "Reaviso" };

/* Ordem de exibição dos inspetores: hierarquia de campo, não alfabeto.
   Quem não estiver na lista vai para o fim. */
const ORDEM_FUNCAO = ["Supervisor", "Técnico Segurança", "Engenheiro Segurança",
  "Coordenador Operacional", "Gerente Operacional"];
const postoFuncao = f => {
  const i = ORDEM_FUNCAO.findIndex(o => o.toLowerCase() === String(f || "").trim().toLowerCase());
  return i < 0 ? ORDEM_FUNCAO.length : i;
};
/* CONST 2 antes de CONST 10: comparação numérica, não alfabética */
const ordemNatural = (a, b) =>
  String(a || "").localeCompare(String(b || ""), "pt-BR", { numeric: true, sensitivity: "base" });

const Ajustes = {
  secao: "equipes",
  busca: "",
  filtros: {},

  montar(pg) {
    pg.innerHTML = "";
    const topo = document.createElement("div"); topo.className = "faixa-topo"; pg.appendChild(topo);
    const marca = document.createElement("div"); marca.className = "marca";
    marca.innerHTML = marcaHTML(); pg.appendChild(marca);

    const voltar = document.createElement("button");
    voltar.className = "voltar"; voltar.textContent = "←"; voltar.title = "Voltar ao painel";
    voltar.onclick = () => irPara("painel");
    pg.appendChild(voltar);

    this.estado = document.createElement("div");
    this.estado.className = "aj-estado";
    pg.appendChild(this.estado);

    const corpo = document.createElement("div");
    corpo.className = "aj";
    corpo.innerHTML = `
      <div class="aj-abas"></div>
      <div class="aj-cab">
        <div><h2 class="aj-tit"></h2><p class="aj-desc"></p></div>
        <button class="aj-novo">+ <span></span></button>
      </div>
      <div class="aj-filtros"></div>
      <div class="aj-tabela rolagem"></div>`;
    pg.appendChild(corpo);
    this.el = corpo;

    Object.keys(SECOES).forEach(k => {
      const b = document.createElement("button");
      b.textContent = SECOES[k].titulo;
      b.dataset.sec = k;
      b.onclick = () => { this.secao = k; this.busca = ""; this.filtros = {}; this.render(); };
      corpo.querySelector(".aj-abas").appendChild(b);
    });
    corpo.querySelector(".aj-novo").onclick = () => this.abrirDialogo(null);
    return pg;
  },

  linhasVisiveis() {
    const s = SECOES[this.secao];
    const busca = this.busca.trim().toLowerCase();
    return Cadastros.lista(this.secao).filter(r => {
      for (const [campo] of s.filtros) {
        const sel = this.filtros[campo];
        if (!sel) continue;
        const val = campo === s.statusK ? (r[campo] ? "Ativo" : "Inativo") : (r[campo] || "");
        if (String(val) !== sel) return false;
      }
      if (!busca) return true;
      return Object.values(r).some(v => String(v).toLowerCase().includes(busca));
    }).sort(this.secao === "equipes"
      ? (a, b) => ordemNatural(a.equipe, b.equipe)
      // inspetores: primeiro pela função, depois pelo nome
      : (a, b) => (postoFuncao(a.funcao) - postoFuncao(b.funcao)) || ordemNatural(a.inspetor, b.inspetor));
  },

  render() {
    if (!this.el) return;
    const s = SECOES[this.secao];
    this.el.querySelectorAll(".aj-abas button").forEach(b =>
      b.classList.toggle("on", b.dataset.sec === this.secao));
    this.el.querySelector(".aj-tit").textContent = s.titulo;
    this.el.querySelector(".aj-desc").textContent = s.desc;
    this.el.querySelector(".aj-novo span").textContent = s.novo;

    this.renderEstado();
    this.renderFiltros();

    const linhas = this.linhasVisiveis();
    const host = this.el.querySelector(".aj-tabela");
    const podeEditar = Banco.podeEditar();

    tabela(host, [
      { titulo: "Ações", valor: r => this.menuAcoes(r, podeEditar) },
      ...s.colunas.map(c => ({
        titulo: c.t, num: c.num,
        valor: r => c.etiqueta
          ? Object.assign(document.createElement("span"), { className: "etiqueta", textContent: c.v(r) })
          : c.v(r),
        classe: () => c.forte ? "forte" : ""
      })),
      { titulo: "Situação", valor: r => {
          const campo = s.campos.find(c => c.k === s.statusK);
          const e = document.createElement("span");
          const ativo = r[s.statusK];
          e.className = "situacao " + (ativo ? "sim" : "nao");
          e.textContent = ativo ? campo.rotSim : campo.rotNao;
          return e;
        } }
    ], linhas);

    const total = Cadastros.lista(this.secao).length;
    const cont = this.el.querySelector(".aj-cont");
    if (cont) cont.textContent = linhas.length === total
      ? `${total} ${total === 1 ? "registro" : "registros"}`
      : `${linhas.length} de ${total}`;
  },

  renderEstado() {
    if (Banco.podeEditar()) {
      this.estado.className = "aj-estado ok";
      this.estado.innerHTML = `<span>✓ <b>${Banco.usuario}</b> — administrador.
        As alterações valem para todos.</span>
        <button class="aj-sair">Sair</button>`;
      this.estado.querySelector(".aj-sair").onclick = () => { Banco.sair(); this.render(); };
    } else if (Banco.ligado && Banco.autenticado()) {
      this.estado.className = "aj-estado aviso";
      this.estado.innerHTML = `<span><b>${Banco.usuario}</b> entrou, mas não é administrador do painel —
        só é possível consultar. Peça para incluírem seu e-mail na lista de administradores.</span>
        <button class="aj-sair">Sair</button>`;
      this.estado.querySelector(".aj-sair").onclick = () => { Banco.sair(); this.render(); };
    } else if (Banco.ligado) {
      this.estado.className = "aj-estado aviso";
      this.estado.innerHTML = `<span>Você está vendo os cadastros do banco. Para alterar,
        entre com uma conta de administrador.</span>
        <button class="aj-entrar">Entrar para editar</button>`;
      this.estado.querySelector(".aj-entrar").onclick = () => this.abrirLogin();
    } else {
      this.estado.className = "aj-estado erro";
      this.estado.innerHTML = `<span>Sem conexão com o banco — mostrando os cadastros embutidos no painel.
        ${Banco.erro ? `<i>${Banco.erro}</i>` : ""} As alterações valem só nesta sessão.</span>
        <button class="aj-tentar">Tentar de novo</button>`;
      this.estado.querySelector(".aj-tentar").onclick = async () => {
        this.estado.innerHTML = "<span>Conectando…</span>";
        await Cadastros.carregar(); this.render(); render();
      };
    }
  },

  renderFiltros() {
    const s = SECOES[this.secao];
    const host = this.el.querySelector(".aj-filtros");
    host.innerHTML = "";
    s.filtros.forEach(([campo, rot]) => {
      const vals = campo === s.statusK ? ["Ativo", "Inativo"]
        : [...new Set(Cadastros.lista(this.secao).map(r => r[campo]).filter(Boolean))].sort();
      const d = document.createElement("label");
      d.className = "aj-filtro";
      d.innerHTML = `<span>${rot}</span><select><option value="">Todos</option>
        ${vals.map(v => `<option${this.filtros[campo] === String(v) ? " selected" : ""}>${v}</option>`).join("")}</select>`;
      d.querySelector("select").onchange = e => {
        this.filtros[campo] = e.target.value; this.render();
      };
      host.appendChild(d);
    });

    const busca = document.createElement("label");
    busca.className = "aj-filtro aj-busca";
    busca.innerHTML = `<span>Buscar</span><input type="search" placeholder="nome, supervisor…" value="${this.busca}">`;
    busca.querySelector("input").oninput = e => {
      this.busca = e.target.value;
      const host2 = this.el.querySelector(".aj-tabela");
      const foco = e.target;
      this.render();
      const novo = this.el.querySelector(".aj-busca input");
      if (novo) { novo.focus(); novo.setSelectionRange(foco.value.length, foco.value.length); }
    };
    host.appendChild(busca);

    const cont = document.createElement("span");
    cont.className = "aj-cont";
    host.appendChild(cont);
  },

  menuAcoes(registro, podeEditar) {
    const d = document.createElement("div");
    d.className = "aj-acoes";
    /* Acesso ao app de inspeções é assunto de inspetor, não de equipe */
    const temAcesso = !!registro.user_id;
    const acesso = this.secao !== "inspetores" ? "" : (temAcesso
      ? `<button data-a="redefinir">🔑 Redefinir senha</button>
         <button data-a="tirar-acesso" class="perigo">⊘ Remover acesso</button>`
      : `<button data-a="criar-acesso">🔑 Criar acesso</button>`);
    d.innerHTML = `<button class="aj-pontos" title="Ações">⋮</button>
      <div class="aj-menu">
        <button data-a="editar">✎ Editar</button>
        ${acesso}
        <button data-a="excluir" class="perigo">🗑 Excluir</button>
      </div>`;
    d.querySelector(".aj-pontos").onclick = e => {
      e.stopPropagation();
      const aberto = d.classList.contains("aberto");
      document.querySelectorAll(".aj-acoes.aberto").forEach(x => x.classList.remove("aberto"));
      if (aberto) return;
      /* Nas últimas linhas da tabela o menu não cabe para baixo e ficava
         cortado pelo rodapé. Mede o espaço livre e decide o lado. */
      const r = d.querySelector(".aj-pontos").getBoundingClientRect();
      /* mede o menu de verdade: com os itens de acesso ele fica bem
         mais alto do que os 84px de quando eram só duas opções */
      const menu = d.querySelector(".aj-menu");
      const ALTURA = menu.scrollHeight || 84, LARGURA = 190;
      d.classList.toggle("cima", window.innerHeight - r.bottom < ALTURA);
      d.classList.toggle("direita", window.innerWidth - r.left < LARGURA);
      d.classList.add("aberto");
    };
    d.querySelectorAll(".aj-menu button").forEach(b => {
      if (!podeEditar) { b.disabled = true; b.title = Banco.autenticado() ? "Sua conta não é administradora do painel" : "Entre com uma conta de administrador para editar"; }
      b.onclick = e => {
        e.stopPropagation();
        d.classList.remove("aberto");
        const a = b.dataset.a;
        if (a === "editar") this.abrirDialogo(registro);
        else if (a === "criar-acesso") this.criarAcesso(registro);
        else if (a === "redefinir") this.redefinirSenha(registro);
        else if (a === "tirar-acesso") this.tirarAcesso(registro);
        else this.confirmarExclusao(registro);
      };
    });
    return d;
  },


  /* ---------- acesso do inspetor ao app de inspeções ----------
     O painel nunca vê a chave de serviço: quem cria a conta é a função
     no servidor. Aqui é só a tela.

     A senha é escolhida pelo administrador, que vai combiná-la com o
     inspetor. Ela não fica guardada em lugar nenhum: vai para a função,
     que manda para o Supabase, e lá só o hash é gravado. */
  criarAcesso(registro) {
    const sugestao = semAcentoAj(registro.inspetor).replace(/[^a-z0-9]+/g, ".") + "@teccel.com.br";
    this.dialogo(`Criar acesso para ${registro.inspetor}`,
      `<p class="aj-dtexto">Cria o login do app de inspeções e já liga a este
         cadastro. Combine a senha com ${registro.inspetor} — ela não fica
         guardada e depois só dá para trocar, não para consultar.</p>
       <label class="aj-campo"><span>E-mail do inspetor</span>
         <input name="email" type="email" required value="${sugestao}"
                autocapitalize="none" spellcheck="false"></label>
       ${this.camposSenha()}`,
      "Criar acesso",
      async form => {
        const email = form.email.value.trim();
        if (!email) throw new Error("Informe o e-mail.");
        const senha = this.senhaConferida(form);
        await Banco.acessoInspetor("criar", registro.inspetor, email, senha);
        await Cadastros.carregar();
        Cadastros.aplicarNoModelo();
        this.render();
      });
  },

  redefinirSenha(registro) {
    this.dialogo(`Redefinir a senha de ${registro.inspetor}`,
      `<p class="aj-dtexto">A senha anterior deixa de valer na hora, então
         ${registro.inspetor} vai precisar da nova para entrar.</p>
       ${this.camposSenha()}`,
      "Redefinir",
      async form => {
        const senha = this.senhaConferida(form);
        await Banco.acessoInspetor("redefinir", registro.inspetor, null, senha);
      });
  },

  tirarAcesso(registro) {
    this.dialogo(`Remover o acesso de ${registro.inspetor}?`,
      `<p class="aj-dtexto">Ele deixa de conseguir criar inspeções pelo app.
         As inspeções que já enviou continuam onde estão.<br><br>
         A conta em si não é apagada — só deixa de ser deste inspetor. Apagar
         conta é feito no painel do Supabase, de propósito.</p>`,
      "Remover acesso",
      async () => {
        await Banco.acessoInspetor("remover", registro.inspetor);
        await Cadastros.carregar();
        Cadastros.aplicarNoModelo();
        this.render();
      }, true);
  },

  /* Senha digitada duas vezes: é o admin quem digita, e quem vai usar é
     outra pessoa — um erro de digitação só apareceria quando o inspetor
     tentasse entrar, longe daqui e sem saber o que houve. */
  camposSenha() {
    return `<label class="aj-campo"><span>Senha</span>
        <input name="senha" type="password" required minlength="6"
               autocomplete="new-password" placeholder="ao menos 6 caracteres"></label>
      <label class="aj-campo"><span>Repita a senha</span>
        <input name="senha2" type="password" required minlength="6"
               autocomplete="new-password"></label>
      <label class="aj-vermostrar"><input type="checkbox" name="ver"> Mostrar a senha</label>`;
  },

  senhaConferida(form) {
    const a = form.senha.value, b = form.senha2.value;
    if (!a) throw new Error("Informe a senha.");
    if (a.length < 6) throw new Error("A senha precisa de pelo menos 6 caracteres.");
    if (a !== b) throw new Error("As duas senhas não são iguais.");
    return a;
  },

  /* ---------- diálogo de criação/edição ---------- */
  abrirDialogo(registro) {
    const s = SECOES[this.secao];
    if (!Banco.podeEditar() && Banco.ligado && !Banco.autenticado()) return this.abrirLogin();
    const novo = !registro;
    const dados = Object.assign({}, registro || {});
    s.campos.forEach(c => { if (dados[c.k] === undefined) dados[c.k] = c.padrao !== undefined ? c.padrao : ""; });

    const corpo = s.campos.map(c => {
      if (c.tipo === "select") return `<label class="aj-campo"><span>${c.rot}</span>
        <select name="${c.k}">${c.opcoes.map(([v, t]) =>
          `<option value="${v}"${dados[c.k] === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>`;
      if (c.tipo === "select-livre") {
        const ops = c.origem();
        return `<label class="aj-campo"><span>${c.rot}</span>
          <input name="${c.k}" list="lista-${c.k}" value="${dados[c.k] || ""}" autocomplete="off">
          <datalist id="lista-${c.k}">${ops.map(o => `<option value="${o}">`).join("")}</datalist></label>`;
      }
      if (c.tipo === "numero") return `<label class="aj-campo"><span>${c.rot}</span>
        <input type="number" name="${c.k}" value="${dados[c.k]}" min="0" step="1"></label>`;
      if (c.tipo === "booleano") return `<label class="aj-campo"><span>${c.rot}</span>
        <select name="${c.k}"><option value="1"${dados[c.k] ? " selected" : ""}>${c.rotSim}</option>
        <option value="0"${!dados[c.k] ? " selected" : ""}>${c.rotNao}</option></select></label>`;
      return `<label class="aj-campo"><span>${c.rot}</span>
        <input name="${c.k}" value="${dados[c.k] || ""}" ${c.obrigatorio ? "required" : ""} autocomplete="off"></label>`;
    }).join("");

    this.dialogo(novo ? s.novo : `Editar ${dados[s.chave]}`, corpo,
      novo ? "Criar" : "Salvar", async form => {
        const reg = Object.assign({}, registro);
        s.campos.forEach(c => {
          const v = form.elements[c.k].value;
          reg[c.k] = c.tipo === "numero" ? Number(v) || 0
                   : c.tipo === "booleano" ? v === "1"
                   : v.trim();
        });
        if (!reg[s.chave]) throw new Error("O nome é obrigatório.");
        const repetido = Cadastros.lista(this.secao).some(r =>
          r.id !== reg.id && String(r[s.chave]).toLowerCase() === reg[s.chave].toLowerCase());
        if (repetido) throw new Error(`Já existe um cadastro com o nome ${reg[s.chave]}.`);
        await Cadastros.salvar(this.secao, reg);
        this.render(); render();
      });
  },

  confirmarExclusao(registro) {
    const s = SECOES[this.secao];
    const nome = registro[s.chave];
    const usos = FATO.filter(f => this.secao === "equipes"
      ? f.equipeBruta === nome : f.inspetorBruto === nome).length;
    this.dialogo(`Excluir ${nome}?`,
      `<p class="aj-aviso">Esta ação não pode ser desfeita.</p>
       ${usos ? `<p class="aj-aviso forte">Há <b>${usos}</b> inspeç${usos === 1 ? "ão" : "ões"} registrada${usos === 1 ? "" : "s"}
         com este nome. Elas continuam no painel, mas passam a aparecer sem
         ${this.secao === "equipes" ? "equipe" : "inspetor"}. Se a intenção é tirar do ranking sem
         perder o histórico, edite e marque como inativ${this.secao === "equipes" ? "a" : "o"}.</p>` : ""}`,
      "Excluir", async () => {
        await Cadastros.excluir(this.secao, registro.id);
        this.render(); render();
      }, true);
  },

  abrirLogin() {
    this.dialogo("Entrar para editar",
      `<p class="aj-aviso">Use a conta cadastrada no Supabase. Sem entrar, o painel continua
        visível para todos, mas ninguém consegue alterar os cadastros.</p>
       <label class="aj-campo"><span>E-mail</span><input name="email" type="email" required autocomplete="username"></label>
       <label class="aj-campo"><span>Senha</span><input name="senha" type="password" required autocomplete="current-password"></label>`,
      "Entrar", async form => {
        await Banco.entrar(form.elements.email.value.trim(), form.elements.senha.value);
        await Cadastros.carregar();
        this.render(); render();
      });
  },

  dialogo(titulo, corpoHTML, rotuloOk, aoConfirmar, perigo) {
    const fundo = document.createElement("div");
    fundo.className = "aj-fundo";
    fundo.innerHTML = `<form class="aj-dialogo">
      <div class="aj-dcab"><h3>${titulo}</h3><button type="button" class="aj-x" aria-label="Fechar">✕</button></div>
      <div class="aj-dcorpo">${corpoHTML}</div>
      <div class="aj-derro"></div>
      <div class="aj-drod">
        <button type="button" class="aj-cancelar">Cancelar</button>
        <button type="submit" class="aj-ok${perigo ? " perigo" : ""}">${rotuloOk}</button>
      </div></form>`;
    canvas.appendChild(fundo);
    const form = fundo.querySelector("form");

    /* Fechar sem querer apaga o que foi digitado. Clique fora NUNCA fecha:
       só o X, o Cancelar ou o Salvar. O Esc fecha enquanto nada tiver sido
       alterado; havendo mudança, o diálogo chama atenção e fica aberto. */
    const inicial = new FormData(form);
    const alterado = () => {
      const agora = new FormData(form);
      for (const [k, v] of agora) if (String(inicial.get(k)) !== String(v)) return true;
      return false;
    };
    const insistir = () => {
      fundo.querySelector(".aj-dialogo").classList.remove("chama");
      void fundo.offsetWidth;                       // reinicia a animação
      fundo.querySelector(".aj-dialogo").classList.add("chama");
      const erro = fundo.querySelector(".aj-derro");
      erro.textContent = "Há alterações não salvas. Use Cancelar para descartar.";
    };

    const aoTeclar = e => { if (e.key === "Escape") (alterado() ? insistir() : fechar()); };
    const fechar = () => {
      document.removeEventListener("keydown", aoTeclar);
      fundo.remove();
    };
    fundo.querySelector(".aj-x").onclick = fechar;
    fundo.querySelector(".aj-cancelar").onclick = fechar;
    fundo.onclick = e => { if (e.target === fundo && alterado()) insistir(); };
    document.addEventListener("keydown", aoTeclar);

    /* "Mostrar a senha" existe porque o admin está digitando para outra
       pessoa e não tem como conferir de outro jeito. */
    const ver = fundo.querySelector("input[name=ver]");
    if (ver) ver.onchange = () => fundo.querySelectorAll("input[name^=senha]")
      .forEach(i => i.type = ver.checked ? "text" : "password");

    const primeiro = fundo.querySelector("input, select");
    if (primeiro) primeiro.focus();

    fundo.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      const ok = fundo.querySelector(".aj-ok");
      const erro = fundo.querySelector(".aj-derro");
      ok.disabled = true; erro.textContent = "";
      try { await aoConfirmar(e.target); fechar(); }
      catch (x) { erro.textContent = x.message; ok.disabled = false; }
    };
  }
};
document.addEventListener("click", () =>
  document.querySelectorAll(".aj-acoes.aberto").forEach(d => d.classList.remove("aberto")));
</script>
<script>
/* ============================================================
   APP — 7 páginas replicando a estrutura do relatório original
   Coordenadas extraídas do JSON de layout do Power BI (canvas 1510x720)
   ============================================================ */

const canvas = document.getElementById("canvas");

  "Inspeções": "Visitas de inspeção realizadas no período filtrado.",
  "Inspeções realizadas": "Visitas de inspeção realizadas no período filtrado.",
  "Realizado": "Visitas de inspeção realizadas no período filtrado.",
  "Meta inspeção": "Total de inspeções previstas, somando a meta de cada inspetor.",
  "Meta de inspeções": "Total de inspeções previstas, somando a meta de cada inspetor.",
  "Meta até hoje": "Quanto da meta já deveria estar cumprido, rateado pelos dias úteis decorridos.",
  "% atingido": "Realizado dividido pela meta até hoje. O original limita em 100%.",
  "Insp. c/ N.C": "Quantas VISITAS acharam pelo menos um problema — a visita conta uma vez só, "

  "Inspeções com N.C": "Quantas VISITAS acharam pelo menos um problema — a visita conta uma vez só, "

  "N.C apontadas": "Quantos ITENS do checklist foram reprovados no total. Uma mesma visita "

   página, mas não na URL: é escolha de leitura, não um link a compartilhar. */

  { k: "geral",  rot: "Geral",     desc: "Os números do ano inteiro, somados." },

   um recorte de leitura, não um filtro do painel. */

/* Compara ignorando acento e maiúscula: "plantao" acha "PLANTÃO". */
const semAcento = s => String(s || "").normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

/* ---------- helpers de construção ---------- */
function marcaHTML() {
  return `<img class="logo" src="${LOGO_TECCEL}" alt="Teccel Energia">
    <div class="divisor"></div>
    <div><div class="nome">PAINEL DE INSPEÇÕES</div>
    <div class="sub">SESMT · Obras RD · Regional Oeste</div></div>`;
}

/* Marca as siglas conhecidas com a descrição no title (dica ao passar o cursor) */
function marcarSiglas(raiz) {
  raiz.querySelectorAll(".rot, .titulo, th, .tit").forEach(elm => {
    if (elm.dataset.sigla) return;
    const alvo = Object.keys(SIGLAS).find(s =>
      new RegExp(`(^|[^A-Za-zÀ-ú])${s.replace(".", "\\.")}([^A-Za-zÀ-ú]|$)`, "i").test(elm.textContent));
    if (!alvo) return;
    elm.dataset.sigla = alvo;
    /* Dentro de um cartão que já explica o número, a dica do rótulo repetiria
       metade da frase: junta as duas em vez de sobrescrever uma com a outra. */
    const dono = elm.closest(".card.comdica");
    elm.title = dono ? `${dono.title}\n${alvo} = ${SIGLAS[alvo]}`
                     : `${alvo} — ${SIGLAS[alvo]}`;
    elm.classList.add("sigla");
  });
}
function box(pai, x, y, w, h, cls) {
  const d = document.createElement("div");
  d.className = "v " + (cls || "");
  d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  pai.appendChild(d);
  return d;
}
function visual(pai, x, y, w, h, titulo) {
  const d = box(pai, x, y, w, h, "painel");
  if (titulo) d.appendChild(Object.assign(document.createElement("div"), { className: "titulo", textContent: titulo }));
  const c = document.createElement("div");
  c.className = "corpo" + (titulo ? "" : " semtitulo");
  d.appendChild(c);
  return c;
}
function cartao(pai, x, y, w, h, rotulo, classe) {
  const d = box(pai, x, y, w, h, "card " + (classe || ""));
  d.innerHTML = `<div class="valor">—</div><div class="rot">${rotulo}</div>`;
  if (EXPLICACAO[rotulo]) { d.title = EXPLICACAO[rotulo]; d.classList.add("comdica"); }
  return d.querySelector(".valor");
}
function legenda(host, itens) {
  const l = document.createElement("div");
  l.className = "legenda";
  l.innerHTML = itens.map(i => `<span><i style="background:${i.cor}"></i>${i.txt}</span>`).join("");
  host.parentElement.appendChild(l);
}

/* ---------- cabeçalho comum (marca + cards + slicers) ---------- */
function cabecalho(pg, cards) {
  const topo = document.createElement("div");
  topo.className = "faixa-topo";
  pg.appendChild(topo);
  const marca = document.createElement("div");
  marca.className = "marca";
  marca.innerHTML = marcaHTML();
  pg.appendChild(marca);

  const b = document.createElement("button");
  b.className = "voltar"; b.textContent = "←"; b.title = "Voltar ao painel";
  b.onclick = () => irPara("painel");
  pg.appendChild(b);

  const refs = {};
  const larg = 150, gap = 8;
  const x0 = 1494 - cards.length * (larg + gap);
  cards.forEach((c, i) => {
    refs[c.k] = cartao(pg, x0 + i * (larg + gap), 8, larg, 62, c.rot, c.cls);
  });

  // No modo fluido a faixa de filtros fica recolhida atrás deste botão,
  // para não empurrar os gráficos para fora da primeira tela do celular.
  const alt = document.createElement("button");
  alt.className = "btn-filtros";
  alt.innerHTML = `<span>Filtros</span><span class="cont"></span>`;
  alt.onclick = e => { e.stopPropagation(); pg.classList.toggle("filtros-abertos"); };
  pg.appendChild(alt);

  const faixa = document.createElement("div");
  faixa.className = "faixa-slicers";
  pg.appendChild(faixa);
  [["ano", "Ano"], ["mes", "Mês"], ["polo", "Polo"], ["inspetor", "Inspetor"],
   ["funcao", "Função"], ["supervisor", "Supervisor"], ["equipe", "Equipe"]]
    .forEach(([campo, rot]) => faixa.appendChild(montarSlicer(campo, rot)));

  const lim = document.createElement("button");
  lim.className = "limpar"; lim.textContent = "✕ Limpar filtros";
  lim.onclick = () => { CAMPOS.forEach(c => filtros[c].clear()); render(); };
  faixa.appendChild(lim);
  return refs;
}

function montarSlicer(campo, rotulo) {
  const d = document.createElement("div");
  d.className = "slicer";
  d.dataset.campo = campo;
  d.innerHTML = `<button><span class="lb">${rotulo}</span><span class="vl">Tudo</span></button><div class="lista"></div>`;
  d.querySelector("button").onclick = e => {
    e.stopPropagation();
    const aberto = d.classList.contains("aberto");
    document.querySelectorAll(".slicer.aberto").forEach(s => s.classList.remove("aberto"));
    if (!aberto) { preencherLista(d, campo); d.classList.add("aberto"); }
  };
  return d;
}
function preencherLista(d, campo) {
  const lista = d.querySelector(".lista");
  lista.innerHTML = "";
  opcoes(campo).forEach(v => {
    const lab = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = filtros[campo].has(v);
    cb.onchange = () => {
      cb.checked ? filtros[campo].add(v) : filtros[campo].delete(v);
      render();
      preencherLista(d, campo);
      d.classList.add("aberto");
    };
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(campo === "mes" ? MESES_NOME[+v] : v));
    lista.appendChild(lab);
  });
}
document.addEventListener("click", () => document.querySelectorAll(".slicer.aberto").forEach(s => s.classList.remove("aberto")));

/* ---------- abas ---------- */
function abas() {
  const d = document.createElement("div");
  d.className = "abas";
  PAGINAS.forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.nome;
    b.dataset.pg = p.id;
    b.onclick = () => irPara(p.id);
    d.appendChild(b);
  });
  const s = document.createElement("span");
  s.className = "att";
  // A versão ajuda a saber se o navegador está mostrando o build atual
  s.textContent = `Atualizado em ${ATUALIZACAO} · v${VERSAO}`;
  s.title = "Versão do painel — use para conferir se a página está atualizada";
  d.appendChild(s);
  return d;
}

function pgPainel() {
  const pg = document.createElement("div");
  pg.className = "pagina"; pg.id = "pg-painel";

  R.painelAtt = cartao(pg, 1180, 8, 300, 62, "Última atualização");

  /* O passo se ajusta à quantidade de páginas: com 8 itens o espaçamento
     antigo (82px) passava do rodapé do canvas. */
  const itens = PAGINAS.slice(1);
  const topo0 = 122, fundo = 684;
  const passo = Math.min(82, (fundo - topo0) / itens.length);
  const altura = Math.min(66, passo - 10);
  itens.forEach((p, i) => {
    const d = box(pg, 60, topo0 + i * passo, 560, altura);
    const b = document.createElement("button");
    b.className = "menu-btn";
    b.innerHTML = `<span class="ic">${p.icone}</span><span>${p.nome}<span class="desc">${p.desc}</span></span>`;
    b.onclick = () => irPara(p.id);
    d.appendChild(b);
  });

  const res = box(pg, 680, 122, 770, 552, "painel");
  res.innerHTML = `<div class="titulo">Resumo geral (sem filtros)</div>`;
  R.painelTitulo = res.querySelector(".titulo");
  const c = document.createElement("div"); c.className = "corpo"; res.appendChild(c);

  /* Seletor do que aparece no resumo — mesmas pílulas do resto do painel */
  const sel = document.createElement("div");
  sel.className = "pilulas rp-sel";
  VISOES_RESUMO.forEach(v => {
    const b = document.createElement("button");
    b.textContent = v.rot; b.dataset.visao = v.k; b.title = v.desc;
    b.onclick = () => { visaoResumo = v.k; detalheResumo = null; buscaResumo = ""; resumoPainel(); };
    sel.appendChild(b);
  });
  c.appendChild(sel);
  R.painelSel = sel;

  const conteudo = document.createElement("div");
  conteudo.className = "rp-conteudo";
  c.appendChild(conteudo);
  R.painelResumo = conteudo;
  return pg;
}

[pgPainel(), pgTaxa(), pgRanking(), pgAvanco(), pgIcit(), pgDia(), pgJornada(), pgAjustes()]

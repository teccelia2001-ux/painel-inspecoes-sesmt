    FOTOS_POR_INSPECAO = {};
    /* O texto livre que o inspetor escreveu em "Desvios encontrados". Não
       entra em número nenhum, mas é o que explica o que a foto mostra — some
       do modelo se não for guardado aqui, e o relatório individual perderia
       justamente a parte escrita por gente. */
    TEXTO_DESVIOS = {};
    /* O caminho de volta: do id curto do painel para o uuid do banco. É o que
       permite editar ou excluir uma inspeção a partir da tela — sem ele, o
       painel sabe mostrar mas não sabe apontar. */
    UUID_POR_ID = {};
    const idPorUuid = {};
    d.inspecoes.forEach(x => {
      idPorUuid[x.id] = idDe(x);
      UUID_POR_ID[idDe(x)] = x.id;
      if (x.desvios) TEXTO_DESVIOS[idDe(x)] = x.desvios;
    });
    (d.fotos || []).forEach(f => {
      const id = idPorUuid[f.inspecao];
      if (!id) return;                    // foto de rascunho: não vem em inspecoes
      (FOTOS_POR_INSPECAO[id] = FOTOS_POR_INSPECAO[id] || []).push(f);
    });

    this.ncContadas = nc.length;
    this.bancoTemHistorico = d.inspecoes.some(x => x.origem === "historico");
    INSPECOES = this.bancoTemHistorico ? inspecoes : HISTORICO.inspecoes.concat(inspecoes);
    NC = this.bancoTemHistorico ? nc : HISTORICO.nc.concat(nc);
    reconstruirModelo();
  },

  /* Volta a mostrar só o histórico — usado ao sair da conta. */
  esquecer() {
    this.doBanco = null; this.em = null; this.erro = null;
    this.bancoTemHistorico = false; this.ncContadas = 0;
    FOTOS_POR_INSPECAO = {};      // foto não é pública: sai da tela com a sessão
    TEXTO_DESVIOS = {};
    INSPECOES = HISTORICO.inspecoes;
    NC = HISTORICO.nc;
    reconstruirModelo();
  },

  resumo() {
    if (!this.doBanco) return null;
    const doApp = this.doBanco.inspecoes.filter(x => x.origem !== "historico").length;
    return {
      inspecoes: this.doBanco.inspecoes.length,
      doApp: doApp,
      nc: this.ncContadas,
      fonteUnica: this.bancoTemHistorico,
      em: this.em
    };
  }
};

/* ---------- Filtros ---------- */
/* "tipo" é o DEPARTAMENTO da inspeção (DCMD C&M, DEOP…). Entrou em
   27/08/2026: sem ele não dava para olhar o ICIT de um departamento só. */
const CAMPOS = ["ano", "mes", "polo", "inspetor", "funcao", "supervisor", "equipe", "tipo"];
const filtros = Object.fromEntries(CAMPOS.map(c => [c, new Set()]));

const ativo = c => filtros[c].size > 0;
const bate  = (c, v) => !ativo(c) || filtros[c].has(v);

/* Meses (Mês/Ano) que sobrevivem aos filtros de data */
function mesesAtivos() {
  return DDATA.filter(d => {
    const [m, y] = d[0].split("/");
    return bate("ano", y) && bate("mes", m);
  });
}

/* Inspeções filtradas */
function fatoFiltrado(ignorar) {
  const ig = new Set(ignorar || []);
  const ok = (c, v) => ig.has(c) || bate(c, v);
  return FATO.filter(f =>
    ok("ano", f.ano) && ok("mes", f.mes) && ok("polo", f.polo) &&
    ok("inspetor", f.inspetor) && ok("funcao", f.funcao) &&
    ok("supervisor", f.supervisor) && ok("equipe", f.equipe) && ok("tipo", f.tipo));
}

/* ---------- Medidas ---------- */
// #Medidas
function Dias_uteis(ms)          { return (ms || mesesAtivos()).reduce((a, d) => a + d[2], 0); }
function Dias_uteis_ate_hoje(ms) { return (ms || mesesAtivos()).reduce((a, d) => a + d[3], 0); }

function inspetoresValidos() {
  return INSPETORES.filter(i => bate("polo", i[1]) && bate("inspetor", i[0]) && bate("funcao", i[2]));
}
/* Meses que contam meta: do PRIMEIRO MÊS COM INSPEÇÃO até o MÊS CORRENTE.

   Decidido em 27/08/2026. Antes a meta era versionada por mês numa lista fixa
   (META_MESES, abr–jul/2026) e agosto aparecia com meta 0 e 0,0% atingida para
   todo mundo. A meta passou a ser a do inspetor, mas valer nos 12 meses do ano
   punia duas vezes sem motivo: jan–mar, antes de as inspeções começarem, e
   set–dez, que ainda não chegaram — o atingido caía de 31% para 19%.

   O corte é pelo serial (d[1], "202604"), não por "tem inspeção no mês": assim
   um mês recém-começado já nasce com meta, em vez de zerar até alguém
   inspecionar — que é justamente o defeito que isto conserta. */
const serialDe = mesAno => {
  const [m, y] = mesAno.split("/");
  return "" + y + String(m).padStart(2, "0");
};
function mesesComMeta(ms) {
  const seriais = [...MESES_COM_INSPECAO].map(serialDe).sort();
  if (!seriais.length) return [];
  const inicio = seriais[0];             // "202604" — primeira inspeção
  const anoInicio = inicio.slice(0, 4);
  const agora = new Date();
  const fim = "" + agora.getFullYear() + String(agora.getMonth() + 1).padStart(2, "0");

  /* 2026 é a exceção: as inspeções começaram em abril, e dar meta a jan–mar
     seria cobrar de um período em que o programa nem existia. Do ano seguinte
     em diante a meta vale o ANO INTEIRO, inclusive os meses que ainda não
     chegaram — assim o painel mostra a meta anual cheia desde janeiro, e não
     uma meta que cresce mês a mês. */
  return (ms || mesesAtivos()).filter(d => {
    if (d[1] < inicio) return false;
    return d[1].slice(0, 4) > anoInicio || d[1] <= fim;
  });
}

function Qtd_Inspetor(ms) {
  return inspetoresValidos().length * mesesComMeta(ms).length;
}
// Meta_Insp — a meta cadastrada no inspetor, em cada mês que conta meta
function Meta_Insp(ms) {
  const porMes = inspetoresValidos().reduce((a, i) => a + i[3], 0);
  return porMes * mesesComMeta(ms).length;
}
/* Meta_insp_dia = Meta_Insp / Dias_uteis * Dias_uteis_até_hoje

   Os dias úteis são os dos MESES QUE TÊM META, não os de todos os meses da
   tela. Usar os 12 meses do ano dividia uma meta de 5 meses por 260 dias
   úteis: a meta até hoje saía 265 em vez de 395, e o atingido aparecia 46%
   quando era 31%. */
function Meta_insp_dia(ms) {
  const comMeta = mesesComMeta(ms);
  const du = Dias_uteis(comMeta);
  return du ? Meta_Insp(ms) / du * Dias_uteis_ate_hoje(comMeta) : 0;
}

// #Medidas_Teccel
const Qtd_Insp        = f => f.length;
const linhasNC        = f => f.flatMap(x => NC_BY_ID[x.id] || []);
const Qtd_NC          = f => linhasNC(f).length;
const Qtd_Inspecao_NC = f => new Set(linhasNC(f).map(r => r[0])).size;
const ICIT            = f => f.length ? (f.length - Qtd_Inspecao_NC(f)) / f.length : null;
const PontosNC        = f => linhasNC(f).reduce((a, r) => a + r[4], 0);

const pct = (a, b) => (b ? a / b : null);
// % Atingida = MIN(DIVIDE([Qtd]; [Meta_insp_dia]); 1) — o original limita em 100%
const pctAtingida = (a, b) => (b ? Math.min(a / b, 1) : null);

/* Pacote de KPIs do cabeçalho */
function kpis(f, ms) {
  f  = f  || fatoFiltrado();
  ms = ms || mesesAtivos();
  const q = Qtd_Insp(f), nc = Qtd_Inspecao_NC(f), meta = Meta_Insp(ms), md = Meta_insp_dia(ms);
  return {
    Qtd_Insp: q, Qtd_Inspecao_NC: nc, Qtd_NC: Qtd_NC(f),
    Meta_Insp: meta, Meta_insp_dia: md,
    /* Dias úteis DOS MESES COM META — é a base que divide a meta em
       Meta_insp_dia. Mostrar aqui os dias do ano inteiro (261/169) ao lado de
       uma meta de 5 meses fazia o rodapé desmentir a própria conta. */
    Dias_uteis: Dias_uteis(mesesComMeta(ms)),
    Dias_uteis_ate_hoje: Dias_uteis_ate_hoje(mesesComMeta(ms)),
    Qtd_Inspetor: Qtd_Inspetor(ms),
    ICIT: ICIT(f),
    pctInspecao: pctAtingida(q, md), // %Inspeção_Teccel (= % Atingida, limitado a 100%)
    pctMetaTotal: pct(q, meta)      // %MetaInspTeccelTotal
  };
}

/* Agrupamento genérico: devolve [{chave, fato[], qtd, nc, icit, meta, metaDia, pct}] */
function agrupar(f, campo, ms) {
  ms = ms || mesesAtivos();
  const mapa = new Map();
  f.forEach(x => {
    const k = x[campo] || "(vazio)";
    if (!mapa.has(k)) mapa.set(k, []);
    mapa.get(k).push(x);
  });
  return [...mapa].map(([k, rows]) => {
    let meta = 0, metaDia = 0;
    if (campo === "inspetor") {
      const i = IDX_INSPETOR[k];
      const comMeta = mesesComMeta(ms);
      const du = Dias_uteis(comMeta);
      meta = i ? i[3] * comMeta.length : 0;
      metaDia = du ? meta / du * Dias_uteis_ate_hoje(comMeta) : 0;
    }
    const nc = Qtd_Inspecao_NC(rows);
    return {
      chave: k, fato: rows, qtd: rows.length, nc, ncLinhas: Qtd_NC(rows),
      icit: ICIT(rows), meta, metaDia, pct: pctAtingida(rows.length, metaDia),
      pctTotal: pct(rows.length, meta), pontosNC: PontosNC(rows)
    };
  });
}

/* Agrupamento por inspetor incluindo quem tem meta mas nenhuma inspeção
   (o original lista todos os cadastrados em "Meta Inspetores") */
function porInspetor(f, ms, comVazio) {
  ms = ms || mesesAtivos();
  const g = agrupar(f, "inspetor", ms);
  const achados = new Set(g.map(x => x.chave));
  const comMeta = mesesComMeta(ms);
  const meses = comMeta.length;
  const du = Dias_uteis(comMeta), duh = Dias_uteis_ate_hoje(comMeta);
  inspetoresValidos().forEach(i => {
    if (achados.has(i[0])) return;
    const meta = i[3] * meses;
    g.push({
      chave: i[0], fato: [], qtd: 0, nc: 0, ncLinhas: 0, icit: null,
      meta, metaDia: du ? meta / du * duh : 0, pct: 0, pctTotal: 0, pontosNC: 0
    });
  });
  return g.filter(x => comVazio || x.chave !== "(vazio)");
}

/* Jornada Segura — pontuação por equipe */
function jornada(f, ms) {
  ms = ms || mesesAtivos();
  // pontua todo mês que teve inspeção — o mesmo conjunto que gera os descontos
  const mesesPonto = ms.map(d => d[0]).filter(m => MESES_COM_INSPECAO.has(m)).length;
  const linhas = agrupar(f, "equipe", ms).map(g => {
    const eq = IDX_EQUIPE[g.chave];
    const ini = eq ? eq[3] * mesesPonto : null;
    const fim = ini === null ? null : ini + g.pontosNC;
    return {
      equipe: g.chave, supervisor: eq ? eq[2] : "", tipo: eq ? eq[1] : "",
      qtd: g.qtd, nc: g.nc, ncLinhas: g.ncLinhas, icit: g.icit,
      pontosIniciais: ini, pontosNC: g.pontosNC, pontosFinal: fim,
      // Critério Desempate = Pontos Final + (inspeções sem N.C)/10  — confirmado no relatório original
      desempate: fim === null ? null : fim + (g.qtd - g.nc) / 10
    };
  });
  linhas.sort((a, b) => (b.desempate ?? -1e9) - (a.desempate ?? -1e9));
  linhas.forEach((l, i) => l.ranking = l.desempate === null ? null : i + 1);
  return linhas;
}

/* ---------- Resumo mensal ----------
   Uma linha por mês, opcionalmente desdobrada por polo ou por equipe.

   A meta é cadastrada por inspetor, então ela existe por mês e por polo (soma
   das metas de quem é daquele polo) mas NÃO por equipe — na visão por equipe
   entram no lugar os pontos da Jornada Segura.
   Todo mês tem meta: a do inspetor vale sempre (mudou em 27/08/2026). */
function nomeMes(mesAno) {
  const [m, y] = mesAno.split("/");
  return MESES_NOME[+m] + "/" + y.slice(2);
}

function resumoMensal(f, ms, campo) {
  ms = ms || mesesAtivos();
  const linhas = [];

  ms.forEach(d => {
    const mesAno = d[0];
    const doMes = f.filter(x => x.mesAno === mesAno);
    const temMeta = mesesComMeta([d]).length > 0;
    const du = Dias_uteis([d]), duh = Dias_uteis_ate_hoje([d]);
    const proporcional = meta => (du ? meta / du * duh : 0);

    const base = rows => {
      const metaDia = 0;
      return { mes: nomeMes(mesAno), mesAno, qtd: rows.length,
        nc: Qtd_Inspecao_NC(rows), ncLinhas: Qtd_NC(rows), icit: ICIT(rows),
        pontosNC: PontosNC(rows), metaDia };
    };

    if (!campo) {
      const meta = Meta_Insp([d]), metaDia = proporcional(meta);
      linhas.push(Object.assign(base(doMes), {
        chave: "", meta, metaDia, pct: pctAtingida(doMes.length, metaDia),
        inspetores: temMeta ? inspetoresValidos().length : 0
      }));
      return;
    }

    /* Chaves do mês: as que aparecem nas inspeções mais as cadastradas, para
       quem não fez nenhuma inspeção aparecer com zero em vez de sumir. */
    const chaves = new Map();
    doMes.forEach(x => {
      const k = x[campo] || "(vazio)";
      if (!chaves.has(k)) chaves.set(k, []);
      chaves.get(k).push(x);
    });
    if (campo === "polo" && temMeta)
      inspetoresValidos().forEach(i => { if (!chaves.has(i[1])) chaves.set(i[1], []); });

    // dentro do mês, quem mais inspecionou primeiro; empate resolve pelo nome
    [...chaves].sort((a, b) => b[1].length - a[1].length ||
      String(a[0]).localeCompare(String(b[0]), "pt-BR", { numeric: true }))
    .forEach(([k, rows]) => {
      let meta = 0, extra = {};
      if (campo === "polo") {
        meta = temMeta ? inspetoresValidos().filter(i => i[1] === k)
          .reduce((a, i) => a + i[3], 0) : 0;
        extra.inspetores = temMeta ? inspetoresValidos().filter(i => i[1] === k).length : 0;
      } else {
        // equipe: sem meta cadastrada; o que vale é a pontuação da Jornada Segura
        const eq = IDX_EQUIPE[k];
        extra.supervisor = eq ? eq[2] : "";
        // mesmo critério da Jornada Segura: mês com inspeção pontua
        extra.pontosIniciais = eq && MESES_COM_INSPECAO.has(mesAno) ? eq[3] : null;
      }
      const metaDia = proporcional(meta);
      const l = Object.assign(base(rows), extra, {
        chave: k, meta, metaDia, pct: meta ? pctAtingida(rows.length, metaDia) : null
      });
      if (campo === "equipe")
        l.pontosFinal = l.pontosIniciais === null ? null : l.pontosIniciais + l.pontosNC;
      linhas.push(l);
    });
  });

  /* Linhas sem inspeção e sem meta só poluiriam a tabela */
  return linhas.filter(l => l.qtd > 0 || l.meta > 0 || l.pontosIniciais);
}

/* Séries temporais */
function porMes(f, ms) {
  ms = ms || mesesAtivos();
  return ms.map(d => {
    const rows = f.filter(x => x.mesAno === d[0]);
    const nc = Qtd_Inspecao_NC(rows);
    const meta = Meta_Insp([d]);
    return {
      chave: MESES_NOME[+d[0].split("/")[0]] + "/" + d[0].split("/")[1].slice(2),
      mesAno: d[0], qtd: rows.length, nc, ncLinhas: Qtd_NC(rows), icit: ICIT(rows),
      meta, metaDia: Meta_insp_dia([d]), pct: pct(rows.length, Meta_insp_dia([d])),
      qtdInspetor: inspetoresValidos().length
    };
  });
}

function porDia(f) {
  const mapa = new Map();
  f.forEach(x => {
    const k = x.data.getTime();
    if (!mapa.has(k)) mapa.set(k, []);
    mapa.get(k).push(x);
  });
  return [...mapa].sort((a, b) => a[0] - b[0]).map(([k, rows]) => ({
    chave: rows[0].dataStr.slice(0, 5), data: new Date(k),
    qtd: rows.length, nc: Qtd_Inspecao_NC(rows)
  }));
}

/* Inconformidades por categoria / pergunta (grão de resposta) */
function ncPorCampo(f, i) {
  const linhas = linhasNC(f);
  const mapa = new Map();
  /* Guarda também QUAIS perguntas caíram em cada grupo. Serve para "(sem
     categoria)" dizer de quais itens se trata — perguntado em 27/08/2026:
     um balde sem nome não diz o que corrigir, e é onde o dado da origem
     estava incompleto. */
  const itens = new Map();
  linhas.forEach(r => {
    const k = r[i] || "(sem categoria)";
    mapa.set(k, (mapa.get(k) || 0) + 1);
    const q = itens.get(k) || new Map();
    q.set(r[1], (q.get(r[1]) || 0) + 1);
    itens.set(k, q);
  });
  return [...mapa].map(([chave, qtd]) => ({
    chave, qtd,
    /* do mais frequente para o menos, que é a ordem em que se ataca */
    itens: [...(itens.get(chave) || new Map())]
      .sort((a, b) => b[1] - a[1])
      .map(([texto, n]) => ({ texto, n }))
  })).sort((a, b) => b.qtd - a.qtd);
}
function gravidades(f) {
  const g = { "Leve": 0, "Grave": 0, "Gravíssimo": 0, "": 0 };
  linhasNC(f).forEach(r => g[r[3]] = (g[r[3]] || 0) + 1);
  return g;
}

/* Valores disponíveis para cada slicer (respeitando os demais filtros) */
function opcoes(campo) {
  const base = fatoFiltrado([campo]);
  const vals = new Set();
  if (campo === "ano" || campo === "mes") {
    DDATA.forEach(d => {
      const [m, y] = d[0].split("/");
      vals.add(campo === "ano" ? y : m);
    });
  } else {
    base.forEach(f => { if (f[campo]) vals.add(f[campo]); });
    if (campo === "inspetor") INSPETORES.forEach(i => vals.add(i[0]));
    if (campo === "polo")     INSPETORES.forEach(i => vals.add(i[1]));
    if (campo === "funcao")   INSPETORES.forEach(i => vals.add(i[2]));
  }
  return [...vals].sort((a, b) =>
    campo === "mes" ? a - b : String(a).localeCompare(String(b), "pt-BR", { numeric: true }));
}
</script>
<script>
/* ============================================================
   SERVIDOR — cadastros de equipes e inspetores no Supabase

   Leitura é pública: qualquer pessoa que abre o painel recebe os
   cadastros do banco. Escrita exige login (política de RLS).

   Se o banco não responder, o painel segue com os dados embutidos
   em data.js — nunca fica em branco por causa de rede.

   A chave abaixo é a publicável (anon). Ela é pública por natureza:
   quem manda no que pode ser gravado é a RLS, não a chave.
   ============================================================ */

/* ------------------------------------------------------------
   PROJETO SUPABASE DO PAINEL

   Projeto próprio do painel (painel-sesmt, São Paulo). Para trocar:
       url   = Project Settings → API → Project URL
       chave = Project Settings → API → publishable / anon key
   ------------------------------------------------------------ */
const SERVIDOR = {
  url: "https://ldqegnfcjeljvywbravl.supabase.co",   // projeto painel-sesmt, São Paulo
  chave: "sb_publishable_4IcV3231DtKqDuBdoPdG8A_sgt8vbOP",
  // slug da Edge Function que cria o login do inspetor — ver acessoInspetor()
  funcaoAcesso: "swift-responder",
  sessao: "sesmt.sessao.v1"
};

const Banco = {
  ligado: false,          // vira true quando o banco responde
  usuario: null,          // e-mail de quem está autenticado
  admin: false,           // está na lista sesmt_admins?
  erro: null,

  /* Editar exige as três coisas: banco no ar, sessão válida e ser admin.
     Ter conta não basta: o direito de gravar vem da lista sesmt_admins,
     o que permite ter contas que só consultam. */
  podeEditar() { return this.ligado && this.autenticado() && this.admin; },

  /* ---------- sessão ---------- */
  carregarSessao() {
    try {
      const s = JSON.parse(localStorage.getItem(SERVIDOR.sessao) || "null");
      if (s && s.refresh) {
        this.token = s.token; this.usuario = s.email; this.refresh = s.refresh;
        this.expiraEm = s.expira_em;
        return true;
      }
      localStorage.removeItem(SERVIDOR.sessao);
    } catch (e) { /* sessão ilegível: segue deslogado */ }
    return false;
  },
  /* Alguns contextos bloqueiam o armazenamento (navegação privada,
     páginas abertas como data:). Nesses casos a sessão vale só enquanto
     a aba estiver aberta, em vez de a página quebrar. */
  guardarSessao(token, email, segundos, refresh) {
    this.token = token; this.usuario = email;
    if (refresh) this.refresh = refresh;
    this.expiraEm = Date.now() + (segundos || 3600) * 1000;
    try {
      localStorage.setItem(SERVIDOR.sessao, JSON.stringify({
        token, email, refresh: this.refresh, expira_em: this.expiraEm
      }));
    } catch (e) { /* sessão só em memória */ }
  },

  /* O token de acesso do Supabase dura cerca de uma hora. Em vez de mandar
     o usuário entrar de novo, trocamos pelo refresh token guardado. */
  async renovar() {
    if (!this.refresh) return false;
    try {
      const r = await fetch(`${SERVIDOR.url}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: { apikey: SERVIDOR.chave, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: this.refresh })
      });
      const j = await r.json();
      if (!r.ok || !j.access_token) return false;
      this.guardarSessao(j.access_token, this.usuario, j.expires_in, j.refresh_token);
      return true;
    } catch (e) { return false; }
  },
  async entrar(email, senha) {
    const r = await fetch(`${SERVIDOR.url}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SERVIDOR.chave, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password: senha })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.msg || "Não foi possível entrar");
    this.guardarSessao(j.access_token, email, j.expires_in, j.refresh_token);
    /* Não ser administrador NÃO barra a entrada. Desde a migração 10, quem
       tem conta lê o painel inteiro — o inspetor precisa ver os próprios
       números. O que continua restrito é escrever, e disso cuida
       podeEditar(): os botões de Ajustes ficam desligados e o banco
       recusaria a gravação de qualquer jeito. */
    await this.verificarAdmin();
    return j;
  },
  sair() {
    this.token = null; this.usuario = null; this.admin = false;
    this.refresh = null; this.expiraEm = 0;
    try { localStorage.removeItem(SERVIDOR.sessao); } catch (e) { /* nada a limpar */ }
  },
  autenticado() { return !!this.token; },

  /* Pergunta ao banco se a conta desta sessão administra o painel.
     A resposta vem da função sesmt_e_admin(), que lê a lista de
     administradores — a lista em si não fica exposta. */
  async verificarAdmin() {
    if (!this.autenticado()) { this.admin = false; return false; }
    try {
      const r = await this.pedir("rpc/sesmt_e_admin", { method: "POST", body: "{}" });
      this.admin = r === true;
    } catch (e) {
      this.admin = false;
    }
    return this.admin;
  },

  /* ---------- REST ---------- */
  cabecalhos(extra) {
    return Object.assign({
      apikey: SERVIDOR.chave,
      Authorization: `Bearer ${this.token || SERVIDOR.chave}`,
      "Content-Type": "application/json"
    }, extra || {});
  },
  async pedir(caminho, opcoes, jaRenovou) {
    // Atenção à ordem: os cabeçalhos precisam ser montados DEPOIS de copiar
    // as opções, senão um `headers` vindo em opcoes (como o Prefer das
    // gravações) substitui o bloco inteiro e a requisição sai sem apikey.
    const req = Object.assign({}, opcoes);
    req.headers = this.cabecalhos(opcoes && opcoes.headers);
    const r = await fetch(`${SERVIDOR.url}/rest/v1/${caminho}`, req);
    const txt = await r.text();
    if (r.ok) return txt ? JSON.parse(txt) : null;

    let corpo = {};
    try { corpo = JSON.parse(txt); } catch (e) {}
    const msg = corpo.message || corpo.error_description || txt || `Erro ${r.status}`;

    // 42501 é violação de RLS: a sessão está boa, faltou permissão.
    // Token vencido vem sem código do Postgres — aí vale tentar renovar.
    const semPermissao = corpo.code === "42501" || r.status === 403;
    if ((r.status === 401 || r.status === 403) && !semPermissao && !jaRenovou && this.refresh) {
      if (await this.renovar()) return this.pedir(caminho, opcoes, true);
    }
    // O detalhe técnico vai junto: sem ele, "não deu certo" não diz onde olhar.
    const detalhe = `[HTTP ${r.status}${corpo.code ? " · " + corpo.code : ""}${
      this.refresh ? "" : " · sem refresh"}] ${msg}`;
    if (semPermissao) throw new Error(
      "O banco recusou a gravação: esta conta não tem permissão de administrador. " +
      "Saia e entre novamente; se persistir, confira se o e-mail está em sesmt_admins. " + detalhe);
    if (r.status === 401) throw new Error(
      "Sua sessão expirou e não foi possível renovar. Clique em Sair e entre de novo. " + detalhe);
    throw new Error(detalhe);
  },

  /* O e-mail com que cada inspetor entra no app.

     Vem de uma função no banco (sesmt_acessos), não de uma consulta: o
     endereço mora em auth.users, que não é — nem deve ser — exposta ao
     PostgREST. A função devolve só inspetor e e-mail, e só para
     administrador; para inspetor volta vazio.

     Falhar aqui não pode derrubar o cadastro: sem o e-mail a tela ainda
     mostra quem tem login, que era o comportamento até 28/08/2026. */
  async baixarAcessos() {
    if (!this.autenticado() || !this.admin) return {};
    try {
      const linhas = await this.pedir("rpc/sesmt_acessos", { method: "POST", body: "{}" });
      const mapa = {};
      (linhas || []).forEach(x => { if (x.inspetor) mapa[x.inspetor] = x.email; });
      return mapa;
    } catch (e) { return {}; }
  },

  /* ---------- cadastros ---------- */
  async baixarCadastros() {
    const [eq, insp] = await Promise.all([
      this.pedir("sesmt_equipes?select=*&order=equipe"),
      this.pedir("sesmt_inspetores?select=*&order=inspetor")
    ]);
    this.ligado = true;
    this.erro = null;
    await this.verificarAdmin();
    return { equipes: eq, inspetores: insp };
  },
  /* ---------- acesso do inspetor ao app de inspeções ----------
     Criar conta exige a chave de serviço, que dá poder total sobre o
     banco. Este painel é público no GitHub Pages, então essa chave não
     pode morar aqui. Quem cria é a função criar-acesso, no servidor,
     que guarda a chave como segredo e confere se quem pediu é mesmo
     administrador — com o token de quem pediu, contra a mesma lista
     sesmt_admins que este painel usa. */
  async acessoInspetor(acao, inspetor, email, senha) {
    if (!this.podeEditar()) throw new Error("Só administrador pode mexer em acesso.");
    /* O slug é gerado pelo editor do Supabase e NÃO muda quando se renomeia
       a função: o campo Name de lá é só rótulo. Pior, publicar de novo pelo
       editor cria outra função, com outro slug, em vez de atualizar a que
       existe — foi assim que apareceram três no projeto, cada uma com uma
       versão diferente do código.

       Se a função for publicada de novo, o slug novo aparece na lista de
       Edge Functions, coluna URL, e é esta constante que muda. */
    const r = await fetch(SERVIDOR.url + "/functions/v1/" + SERVIDOR.funcaoAcesso, {
      method: "POST",
      headers: {
        apikey: SERVIDOR.chave,
        Authorization: "Bearer " + this.token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ acao, inspetor, email, senha })
    });
    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) {
      if (r.status === 404 && !j) {
        throw new Error("A função de criar acesso não respondeu. Confira, no Supabase, "
          + `se o slug dela ainda é ${SERVIDOR.funcaoAcesso}.`);
      }
      throw new Error((j && j.erro) || ("erro " + r.status));
    }
    return j;
  },

  /* ---------- inspeções feitas pelo app ----------
     Ficam no banco, não no data.js. Só quem tem login enxerga: foi a
     decisão de 26/08/2026, e o RLS é quem manda — para anônimo estas
     consultas voltam vazias, sem erro.

     Traz só o que foi ENVIADO. Rascunho é papel de rabisco do inspetor
     e não pode entrar em número nenhum. */
  async baixarInspecoes() {
    if (!this.autenticado()) return { inspecoes: [], nc: [], motivo: "sem-login" };
    const [insp, respostas, perguntas, fotos] = await Promise.all([
      this.pedir("sesmt_inspecoes?select=id,origem,origem_id,departamento,inspetor,equipe,data,desvios"
                 + "&enviada_em=not.is.null&order=data"),
      /* Só as não conformes: é o que vira linha de N.C no painel. As
         conformes e as N/A não entram em conta nenhuma. */
      this.pedir("sesmt_respostas?select=inspecao,pergunta&resposta=eq.nao_conforme"),
      this.pedir("sesmt_perguntas?select=codigo,texto,categoria,gravidade,pontos_nc"),
      /* As fotos vêm junto, e não sob demanda: são poucas linhas (só o
         caminho), e pedi-las por inspeção faria uma consulta por linha
         aberta na tela. O arquivo em si só é buscado ao abrir a foto. */
      this.pedir("sesmt_fotos?select=inspecao,tipo,caminho&order=enviada_em")
    ]);
    return { inspecoes: insp, respostas, perguntas, fotos };
  },

  /* URLs assinadas para as fotos. O bucket é privado — foto de inspeção
     mostra rosto, placa e o interior da instalação do cliente —, então o
     painel pede um link temporário para cada arquivo.

     Em UMA chamada para todas: assinar de uma em uma seria uma requisição
     por miniatura, e uma inspeção com 8 fotos abriria 8 conexões. */
  async assinarFotos(caminhos) {
    if (!caminhos.length) return {};
    const r = await fetch(`${SERVIDOR.url}/storage/v1/object/sign/inspecoes`, {
      method: "POST",
      headers: {
        apikey: SERVIDOR.chave,
        Authorization: "Bearer " + this.token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ expiresIn: 3600, paths: caminhos })
    });
    if (!r.ok) throw new Error("não deu para abrir as fotos");
    const lista = await r.json();
    const mapa = {};
    (lista || []).forEach(x => {
      const u = x.signedURL || x.signedUrl || "";
      if (x.path && u) mapa[x.path] = u.startsWith("http") ? u : SERVIDOR.url + "/storage/v1" + u;
    });
    return mapa;
  },

  /* Inspeções COMEÇADAS e não enviadas. Não entram em número nenhum do
     painel — de propósito: rascunho não é inspeção feita. Ficam numa aba
     à parte para o administrador ver o que ficou pelo caminho, já que o
     rascunho nasce no banco antes da primeira resposta e o abandonado
     não se anuncia. O inspetor apaga o dele pelo app.
     O count vem embutido: quantas respostas cada um já tem. */
  async baixarRascunhos() {
    if (!this.autenticado()) return [];
    return this.pedir("sesmt_inspecoes?select=id,departamento,inspetor,equipe,data,criada_em,"
                      + "sesmt_respostas(count)&enviada_em=is.null&order=criada_em.desc");
  }
,

  criar(tabela, linha)      { return this.pedir(tabela, { method: "POST", body: JSON.stringify(linha), headers: { Prefer: "return=representation" } }); },
  atualizar(tabela, id, linha) { return this.pedir(`${tabela}?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(linha), headers: { Prefer: "return=representation" } }); },
  excluir(tabela, id)       { return this.pedir(`${tabela}?id=eq.${id}`, { method: "DELETE" }); }
};

/* ============================================================
   CADASTROS — o que a aba Ajustes manipula.
   Guarda a forma "rica" (com id e status) e mantém os arrays
   EQUIPES / INSPETORES do modelo sincronizados.
   ============================================================ */
const Cadastros = {
  equipes: [],       // {id, equipe, tipo, supervisor, pontos, ativa}
  inspetores: [],    // {id, inspetor, polo, funcao, meta, ativo}
  acessos: {},       // inspetor -> e-mail de login (só para administrador)
  origem: "embutido",

  /* Dados de data.js, usados enquanto o banco não responde */
  /* Lê a CÓPIA CONGELADA, não as variáveis vivas: aplicarNoModelo() sobrescreve
     EQUIPES e INSPETORES com o que veio do banco, e ler dali fazia a reserva
     desaparecer assim que o banco respondia uma vez. Ver data.js. */
  doArquivo() {
    this.equipes = EQUIPES_ARQUIVO.map((r, i) => ({
      id: "local-e" + i, equipe: r[0], tipo: r[1], supervisor: r[2], pontos: r[3],
      nomes_anteriores: r[4] || [], ativa: true
    }));
    this.inspetores = INSPETORES_ARQUIVO.map((r, i) => ({
      id: "local-i" + i, inspetor: r[0], polo: r[1],
      funcao: r[2], meta: r[3],
      nomes_anteriores: r[4] || [], ativo: true
    }));
    this.origem = "embutido";
  },

  /* Reescreve os arrays que o modelo consome e recalcula tudo */
  aplicarNoModelo() {
    /* A última posição leva os nomes que a linha já teve. É o que
       permite ao modelo achar uma inspeção feita antes do rename —
       ver reconstruirModelo(). Banco antigo, sem a coluna, entra
       como lista vazia e nada muda. */
    EQUIPES = this.equipes.filter(e => e.ativa)
      .map(e => [e.equipe, e.tipo || "", e.supervisor || "", Number(e.pontos) || 0,
                 e.nomes_anteriores || []]);
    INSPETORES = this.inspetores.filter(i => i.ativo)
      .map(i => [i.inspetor, i.polo || i.area || "", i.funcao || "",
                 Number(i.meta) || 0,
                 i.nomes_anteriores || []]);
    reconstruirModelo();
  },

  async carregar() {
    this.doArquivo();
    try {
      const d = await Banco.baixarCadastros();
      /* Cada lista decide por si. Antes bastava UMA delas ter conteúdo para as
         DUAS substituírem a reserva — e o banco devolve [] sem erro quando a
         política nega a leitura (sessão vencida, por exemplo). Bastava isso
         para a tabela de equipes ficar vazia com o painel dizendo que estava
         mostrando os cadastros embutidos. */
      if (d.equipes.length) {
        this.equipes = d.equipes;
        this.origem = "banco";
      }
      if (d.inspetores.length) {
        // "Área" virou "Polo". Enquanto a migração não roda no banco, o valor
        // antigo é aproveitado para o painel não aparecer com o campo vazio.
        this.inspetores = d.inspetores.map(i => {
          if (i.polo === undefined && i.area !== undefined) i.polo = i.area;
          // "Meta dinâmica" virou a meta única, e a estática foi excluída.
          // Mesma ponte: banco ainda sem a migração continua alimentando o painel.
          if (i.meta === undefined && i.meta_dinamica !== undefined) i.meta = i.meta_dinamica;
          return i;
        });
        this.origem = "banco";
      }
    } catch (e) {
      Banco.ligado = false;
      Banco.erro = e.message;
    }
    /* Depois de verificarAdmin(), que roda dentro de baixarCadastros: antes
       dela a função do banco devolveria vazio mesmo para o administrador. */
    this.acessos = await Banco.baixarAcessos();
    this.aplicarNoModelo();
    return this.origem;
  },

  lista(tipo) { return tipo === "equipes" ? this.equipes : this.inspetores; },
  tabela(tipo) { return tipo === "equipes" ? "sesmt_equipes" : "sesmt_inspetores"; },

  async salvar(tipo, registro) {
    const tabela = this.tabela(tipo);
    const novo = !registro.id || String(registro.id).startsWith("local-");
    const corpo = Object.assign({}, registro);
    delete corpo.id; delete corpo.criada_em; delete corpo.atualizada_em;
    // resquício da migração Área→Polo: não mandar a coluna antiga de volta
    delete corpo.area;
    // idem para a meta: colunas antigas não voltam para o banco
    delete corpo.meta_dinamica; delete corpo.meta_estatica;

    if (Banco.podeEditar()) {
      const r = novo ? await Banco.criar(tabela, corpo)
                     : await Banco.atualizar(tabela, registro.id, corpo);
      const salvo = Array.isArray(r) ? r[0] : r;
      const lista = this.lista(tipo);
      const i = lista.findIndex(x => x.id === registro.id);
      if (i >= 0) lista[i] = salvo; else lista.push(salvo);
    } else {
      // sem banco: vale só nesta sessão, para não travar o uso
      const lista = this.lista(tipo);
      const i = lista.findIndex(x => x.id === registro.id);
      if (i >= 0) lista[i] = Object.assign({}, lista[i], registro);
      else lista.push(Object.assign({ id: "local-" + Date.now() }, registro));
    }
    this.aplicarNoModelo();
  },

  async excluir(tipo, id) {
    if (Banco.podeEditar() && !String(id).startsWith("local-"))
      await Banco.excluir(this.tabela(tipo), id);
    const lista = this.lista(tipo);
    const i = lista.findIndex(x => x.id === id);
    if (i >= 0) lista.splice(i, 1);
    this.aplicarNoModelo();
  }
};

Banco.carregarSessao();
</script>
<script>
/* ============================================================
   VISUAIS — SVG puro, sem bibliotecas externas
   Réplica dos tipos usados no relatório original:
   lineClusteredColumnComboChart, Tachometer, waterfallChart, tableEx, card
   ============================================================ */

const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, txt) => {
  const n = document.createElementNS(NS, t);
  for (const k in a) if (a[k] !== null && a[k] !== undefined) n.setAttribute(k, a[k]);
  if (txt !== undefined) n.textContent = txt;
  return n;
};
const fmtN  = v => v === null || v === undefined ? "—" : Math.round(v).toLocaleString("pt-BR");
const fmtP  = (v, d = 1) => v === null || v === undefined ? "—" : (v * 100).toFixed(d).replace(".", ",") + "%";
const fmtD  = (v, d = 1) => v === null || v === undefined ? "—" : v.toFixed(d).replace(".", ",");
const corta = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

/* ---------- Combo: colunas agrupadas + linha (o visual mais usado) ---------- */
function comboChart(host, dados, opt) {
  opt = Object.assign({
    series: [{ key: "qtd", label: "Realizado", cor: "var(--c1)" }],
    linha: null, rotulo: "chave", pctLinha: true, rotacionar: true,
    metaLinha: null, maxRot: 14, minColuna: 0,
    /* Largura mínima de coluna para escrever o valor da linha, e quantas casas
       decimais usar. Padrão 34px com uma casa ("57,4%"). Em gráficos de muitas
       colunas — o de inspeções por dia tem ~60 em 1482px, 24px cada — o rótulo
       simplesmente não aparecia. Baixando o mínimo e tirando a casa decimal,
       "100%" cabe em 24px. */
    larguraRotuloLinha: 34, casasLinha: 1
  }, opt);

  const H = host.clientHeight;

  /* Visual ampliado: o painel triplica de tamanho e a fonte tem que crescer
     junto, senão o gráfico grande fica com letra de gráfico pequeno — foi o
     que se viu ao ampliar o ICIT por inspetor. O fator vale para o TEXTO (no
     CSS, por .v.ampliado) e para tudo que é medido em pixel aqui: margens,
     folgas dos rótulos e a largura máxima da barra. Sem isso o rótulo do eixo
     cresce e sai cortado na margem de baixo, que continuaria com 62px. */
  const amp = host.closest && host.closest(".ampliado") ? 1.6 : 1;
  // ampliado cabe mais texto no rótulo do eixo: "PLANTÃO - P…" volta inteiro
  const maxRot = Math.round(opt.maxRot * amp);
  const largRotLinha = opt.larguraRotuloLinha * amp;

  /* O rótulo do eixo X é inclinado a -35°: quanto mais longo, mais fundo ele
     desce. Ampliado o texto cresce E cabe mais caractere, então a margem de
     baixo tem que sair do maior rótulo — com os 62px de sempre, "PLANTÃO -
     PTSCX02" passava por baixo da borda do quadro. Em tamanho normal a conta
     dá menos que 62 e nada muda. */
  const maiorRot = opt.rotacionar
    ? Math.max(0, ...dados.map(d => corta(String(d[opt.rotulo]), maxRot).length))
    : 0;
  const alturaRot = maiorRot * 9.5 * amp * 0.55 * 0.574 + 16 * amp;

  // com linha de % o rótulo do ponto sobe 11px: sem folga no topo ele sai cortado
  const m = { t: (opt.linha ? 26 : 16) * amp, r: (opt.linha ? 44 : 14) * amp,
              b: Math.max((opt.rotacionar ? 62 : 30) * amp, alturaRot), l: 40 * amp };

  /* No celular caberiam 68 dias em 500px — as barras viram fios e os rótulos
     somem. Havendo largura mínima por coluna, o gráfico cresce e rola na
     horizontal em vez de espremer (e perder) a informação. */
  const preciso = opt.minColuna ? dados.length * opt.minColuna + m.l + m.r : 0;
  const W = Math.max(host.clientWidth, preciso);
  host.style.overflowX = W > host.clientWidth ? "auto" : "";
  host.style.overflowY = "hidden";
  const iw = Math.max(10, W - m.l - m.r), ih = Math.max(10, H - m.t - m.b);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = "";
  host.appendChild(svg);
  if (!dados.length) { svg.appendChild(el("text", { x: W / 2, y: H / 2, class: "vazio", "text-anchor": "middle" }, "sem dados")); return; }

  const maxV = Math.max(1, ...dados.flatMap(d => opt.series.map(s => d[s.key] || 0)));
  const esc  = v => ih - (v / maxV) * ih;
  const bw   = iw / dados.length;
  const sw   = Math.min(26 * amp, (bw * 0.68) / opt.series.length);

  const g = el("g", { transform: `translate(${m.l},${m.t})` });
  svg.appendChild(g);

  /* grade + eixo Y */
  for (let i = 0; i <= 4; i++) {
    const y = ih - (ih / 4) * i, v = (maxV / 4) * i;
    g.appendChild(el("line", { x1: 0, x2: iw, y1: y, y2: y, class: "grade" }));
    g.appendChild(el("text", { x: -8 * amp, y: y + 4 * amp, class: "eixo", "text-anchor": "end" }, fmtN(v)));
  }

  /* Mantém o texto dentro da área desenhada: sem isso os rótulos da primeira e
     da última coluna saem pela borda do SVG e aparecem cortados. */
  const dentroX = x => Math.max(-m.l + 4, Math.min(iw + m.r - 4, x));
  const dentroY = y => Math.max(-m.t + 9 * amp, y);

  /* colunas — rotulos[i] guarda onde cada quantidade foi escrita, para a
     porcentagem depois não ser escrita por cima de nenhuma delas */
  const rotulos = [];
  const anotar = (i, x, y) => { (rotulos[i] = rotulos[i] || []).push({ x, y }); };
  dados.forEach((d, i) => {
    const x0 = i * bw + (bw - sw * opt.series.length) / 2;
    opt.series.forEach((s, j) => {
      const v = d[s.key] || 0, y = esc(v);
      const r = el("rect", { x: x0 + j * sw, y, width: sw - 2, height: Math.max(0, ih - y), fill: s.cor, rx: 2, class: "barra" });
      r.appendChild(el("title", {}, `${d[opt.rotulo]}\n${s.label}: ${fmtN(v)}`));
      g.appendChild(r);
      // a quantidade aparece sempre que a coluna for larga o bastante para ela caber
      if (v > 0 && sw >= 11) {
        const xr = dentroX(x0 + j * sw + (sw - 2) / 2), yr = dentroY(y - 4 * amp);
        g.appendChild(el("text", { x: xr, y: yr, class: "rotulo", "text-anchor": "middle" }, fmtN(v)));
        anotar(i, xr, yr);
      }
    });
    /* Colunas estreitas (o gráfico por dia, com o ano inteiro) não têm espaço
       para um número por barra. Em vez de ficar sem informação nenhuma, escreve
       só o valor da primeira série — a quantidade — acima do grupo. */
    if (!rotulos[i] && bw >= 15) {
      const v = d[opt.series[0].key] || 0;
      if (v > 0) {
        const xr = dentroX(i * bw + bw / 2), yr = dentroY(esc(v) - 4 * amp);
        g.appendChild(el("text", { x: xr, y: yr, class: "rotulo", "text-anchor": "middle" }, fmtN(v)));
        anotar(i, xr, yr);
      }
    }
  });

  /* meta como linha de referência */
  if (opt.metaLinha !== null && opt.metaLinha !== undefined && opt.metaLinha <= maxV) {
    const y = esc(opt.metaLinha);
    g.appendChild(el("line", { x1: 0, x2: iw, y1: y, y2: y, class: "meta" }));
  }

  /* linha secundária (%) */
  if (opt.linha) {
    const vals = dados.map(d => d[opt.linha.key]);
    const finitos = vals.filter(v => v !== null && v !== undefined);
    const maxL = opt.pctLinha ? Math.max(1, ...finitos) : Math.max(1, ...finitos);
    const escL = v => ih - (v / maxL) * ih;
    let dpath = "", prev = false;
    dados.forEach((d, i) => {
      const v = d[opt.linha.key], x = i * bw + bw / 2;
      if (v === null || v === undefined) { prev = false; return; }
      dpath += (prev ? "L" : "M") + x + " " + escL(v);
      prev = true;
    });
    const cor = opt.linha.cor || "var(--c-linha)";
    // halo branco por baixo: destaca a linha mesmo cruzando as colunas
    g.appendChild(el("path", { d: dpath, fill: "none", stroke: "var(--painel)", "stroke-width": 6 * amp,
      "stroke-linejoin": "round", "stroke-linecap": "round", opacity: .9 }));
    g.appendChild(el("path", { d: dpath, fill: "none", stroke: cor, "stroke-width": 3.2 * amp,
      "stroke-linejoin": "round", "stroke-linecap": "round" }));
    dados.forEach((d, i) => {
      const v = d[opt.linha.key];
      if (v === null || v === undefined) return;
      const x = i * bw + bw / 2, y = escL(v);
      g.appendChild(el("circle", { cx: x, cy: y, r: 5 * amp, fill: "var(--painel)" }));
      const c = el("circle", { cx: x, cy: y, r: 3.4 * amp, fill: cor });
      c.appendChild(el("title", {}, `${d[opt.rotulo]}\n${opt.linha.label}: ${opt.pctLinha ? fmtP(v) : fmtD(v)}`));
      g.appendChild(c);
      // valor exato (uma casa decimal) sempre que houver espaço para o rótulo
      if (bw >= largRotLinha) {
        const xl = dentroX(x);
        let yl = y - 11 * amp;
        /* Enquanto cair em cima de alguma quantidade da mesma coluna, sobe
           para logo acima dela. São no máximo três rótulos por coluna. */
        const perto = () => (rotulos[i] || []).filter(r =>
          Math.abs(r.x - xl) < 16 * amp && Math.abs(r.y - yl) < 11 * amp);
        for (let n = 0; n < 4; n++) {
          const c = perto();
          if (!c.length) break;
          yl = Math.min(...c.map(r => r.y)) - 11 * amp;
        }
        /* Coluna estreita ganha texto menor: com 24px por dia, o rótulo do
           tamanho normal encostaria no vizinho. */
        g.appendChild(el("text", {
          x: xl, y: dentroY(yl), "text-anchor": "middle",
          class: "rotulo-linha" + (bw < 30 * amp ? " miudo" : "")
        }, opt.pctLinha ? fmtP(v, opt.casasLinha) : fmtD(v, opt.casasLinha)));
      }
    });
    for (let i = 0; i <= 4; i++) {
      const y = ih - (ih / 4) * i, v = (maxL / 4) * i;
      g.appendChild(el("text", { x: iw + 8 * amp, y: y + 4 * amp, class: "eixo eixo2" }, opt.pctLinha ? fmtP(v, 0) : fmtD(v, 0)));
    }
  }

  /* eixo X */
  dados.forEach((d, i) => {
    const x = i * bw + bw / 2;
    const t = el("text", { x, y: ih + 14 * amp, class: "eixo", "text-anchor": opt.rotacionar ? "end" : "middle" },
      corta(String(d[opt.rotulo]), maxRot));
    if (opt.rotacionar) t.setAttribute("transform", `rotate(-35 ${x} ${ih + 14 * amp})`);
    g.appendChild(t);
  });
}

/* ---------- Tachometer (velocímetro) ---------- */
function gauge(host, valor, opt) {
  opt = Object.assign({ min: 0, max: 1, faixas: [0.5, 0.8], formato: fmtP, alvo: null }, opt);
  const W = host.clientWidth, H = host.clientHeight;
  // mesmo fator de ampliação do comboChart — ver o comentário de lá
  const amp = host.closest && host.closest(".ampliado") ? 1.6 : 1;
  const cx = W / 2, cy = H * 0.72, R = Math.min(W * 0.42, H * 0.62), r = R * 0.62;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = ""; host.appendChild(svg);

  const ang = v => Math.PI * (1 - Math.min(1, Math.max(0, (v - opt.min) / (opt.max - opt.min))));
  const arco = (a0, a1, cor) => {
    const p = (a, rr) => [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
    const [x0, y0] = p(a0, R), [x1, y1] = p(a1, R), [x2, y2] = p(a1, r), [x3, y3] = p(a0, r);
    const large = Math.abs(a1 - a0) > Math.PI ? 1 : 0;
    return el("path", {
      d: `M${x0} ${y0} A${R} ${R} 0 ${large} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${large} 0 ${x3} ${y3} Z`,
      fill: cor
    });
  };
  const lim = [opt.min, ...opt.faixas, opt.max];
  const cores = ["var(--ruim)", "var(--medio)", "var(--bom)"];
  for (let i = 0; i < lim.length - 1; i++) svg.appendChild(arco(ang(lim[i]), ang(lim[i + 1]), cores[i] || "var(--bom)"));

  if (valor !== null && valor !== undefined) {
    const a = ang(valor);
    const px = cx + (R * 0.98) * Math.cos(a), py = cy - (R * 0.98) * Math.sin(a);
    svg.appendChild(el("line", { x1: cx, y1: cy, x2: px, y2: py, class: "ponteiro" }));
    svg.appendChild(el("circle", { cx, cy, r: 6 * amp, class: "pivo" }));
  }
  svg.appendChild(el("text", { x: cx, y: cy + 34 * amp, class: "gauge-valor", "text-anchor": "middle" }, opt.formato(valor)));
  svg.appendChild(el("text", { x: cx - R - 2, y: cy + 16 * amp, class: "eixo", "text-anchor": "middle" }, opt.formato(opt.min, 0)));
  svg.appendChild(el("text", { x: cx + R + 2, y: cy + 16 * amp, class: "eixo", "text-anchor": "middle" }, opt.formato(opt.max, 0)));
}

/* ---------- Waterfall (inconformidades por categoria) ---------- */
function waterfall(host, dados) {
  const W = host.clientWidth, H = host.clientHeight;
  // mesmo fator de ampliação do comboChart — ver o comentário de lá
  const amp = host.closest && host.closest(".ampliado") ? 1.6 : 1;
  const m = { t: 18 * amp, r: 12 * amp, b: 58 * amp, l: 38 * amp };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = ""; host.appendChild(svg);
  if (!dados.length) { svg.appendChild(el("text", { x: W / 2, y: H / 2, class: "vazio", "text-anchor": "middle" }, "sem dados")); return; }

  const total = dados.reduce((a, d) => a + d.qtd, 0);
  const passos = [...dados, { chave: "Total", qtd: total, total: true }];
  const max = total;
  const bw = iw / passos.length, sw = Math.min(40 * amp, bw * 0.62);
  const g = el("g", { transform: `translate(${m.l},${m.t})` });
  svg.appendChild(g);
  for (let i = 0; i <= 4; i++) {
    const y = ih - (ih / 4) * i;
    g.appendChild(el("line", { x1: 0, x2: iw, y1: y, y2: y, class: "grade" }));
    g.appendChild(el("text", { x: -8 * amp, y: y + 4 * amp, class: "eixo", "text-anchor": "end" }, fmtN((max / 4) * i)));
  }
  let acc = 0;
  passos.forEach((d, i) => {
    const x = i * bw + (bw - sw) / 2;
    const y0 = ih - (acc / max) * ih;
    const alt = (d.qtd / max) * ih;
    const y = d.total ? ih - alt : y0 - alt;
    const rect = el("rect", { x, y, width: sw, height: Math.max(1, alt), rx: 2, fill: d.total ? "var(--c-total)" : "var(--ruim)" });
    /* A dica lista QUAIS itens formam a coluna. Nasceu de "(sem categoria)":
       uma coluna sem nome não diz o que corrigir. Vale para todas — passar o
       cursor em "Procedimentos" mostra quais procedimentos foram reprovados. */
    const detalhe = (d.itens || []).slice(0, 12)
      .map(x => `• ${corta(x.texto, 70)}${x.n > 1 ? ` (${x.n}×)` : ""}`).join("\n");
    const sobra = (d.itens || []).length - 12;
    rect.appendChild(el("title", {},
      `${d.chave}: ${d.qtd}` + (detalhe ? `\n\n${detalhe}` : "")
      + (sobra > 0 ? `\n… e mais ${sobra}` : "")));
    g.appendChild(rect);
    g.appendChild(el("text", { x: x + sw / 2, y: y - 5 * amp, class: "rotulo", "text-anchor": "middle" }, fmtN(d.qtd)));
    if (!d.total) acc += d.qtd;
    const t = el("text", { x: x + sw / 2, y: ih + 14 * amp, class: "eixo", "text-anchor": "end" }, corta(d.chave, Math.round(16 * amp)));
    t.setAttribute("transform", `rotate(-35 ${x + sw / 2} ${ih + 14 * amp})`);
    g.appendChild(t);
  });
}

/* ---------- Barras horizontais (TOP 5 inconformidades) ---------- */
function barrasH(host, dados, opt) {
  opt = Object.assign({ cor: "var(--ruim)", maxRot: 46 }, opt);
  const W = host.clientWidth, H = host.clientHeight;
  // mesmo fator de ampliação do comboChart — ver o comentário de lá
  const amp = host.closest && host.closest(".ampliado") ? 1.6 : 1;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = ""; host.appendChild(svg);
  if (!dados.length) { svg.appendChild(el("text", { x: W / 2, y: H / 2, class: "vazio", "text-anchor": "middle" }, "sem dados")); return; }
  /* A descrição vai ACIMA da barra, não dentro dela.

     Dentro, o texto era branco e começava no x=6: barra curta deixava metade
     da frase caindo no fundo branco, ilegível — e o número da ponta ainda
     colidia com ela. Acima, a frase tem a largura inteira do quadro e a barra
     vira só a medida. Pedido de 27/08/2026.

     O corte é calculado pela largura disponível, e não por um número fixo de
     caracteres: o mesmo visual aparece em quadros de tamanhos diferentes. */
  const max = Math.max(...dados.map(d => d.qtd));
  const alt = Math.min(56 * amp, (H - 8) / dados.length);
  const hBarra = Math.max(8 * amp, Math.min(13 * amp, alt - 32 * amp));
  /* Quantos caracteres cabem numa linha, pela largura real do quadro. */
  const cabe = Math.max(20, Math.floor((W - 30) / (5.4 * amp)));

  /* Quebra em ATÉ DUAS linhas, sem partir palavra ao meio. Antes era uma
     linha cortada com "…", e a frase morria justamente onde começava a
     dizer o que foi reprovado: "Os veículos utlizados na atividade estão em
     boas co…". Duas linhas cobrem quase toda pergunta do checklist. */
  const quebrar = (txt, largura, linhas) => {
    const palavras = String(txt).split(/\s+/);
    const saida = [];
    let atual = "";
    palavras.forEach(p => {
      const teste = atual ? atual + " " + p : p;
      if (teste.length <= largura) { atual = teste; return; }
      if (saida.length + 1 === linhas) { atual = corta(teste, largura); return; }
      if (atual) saida.push(atual);
      atual = p;
    });
    if (atual && saida.length < linhas) saida.push(atual);
    return saida.slice(0, linhas);
  };

  dados.forEach((d, i) => {
    const y = 6 + i * alt;
    const larg = (d.qtd / max) * (W - 34 * amp);
    const partes = quebrar(d.chave, cabe, 2);
    const dica = `${d.chave}\n${d.qtd} ocorrência(s)`;

    const t = el("text", { x: 0, y: y + 10 * amp, class: "rotulo-barra-fora" });
    partes.forEach((linha, n) => t.appendChild(
      el("tspan", { x: 0, dy: n ? 12 * amp : 0 }, linha)));
    t.appendChild(el("title", {}, dica));
    svg.appendChild(t);

    const yBarra = y + (10 + (partes.length - 1) * 12 + 7) * amp;
    const r = el("rect", { x: 0, y: yBarra, width: Math.max(2, larg), height: hBarra, rx: 2, fill: opt.cor });
    r.appendChild(el("title", {}, dica));
    svg.appendChild(r);
    svg.appendChild(el("text", { x: Math.max(2, larg) + 6 * amp, y: yBarra + hBarra - 1, class: "rotulo" }, d.qtd));
  });
}

/* ---------- Tabela (tableEx) ---------- */
function tabela(host, colunas, linhas) {
  const t = document.createElement("table");
  t.className = "tbl";
  const thead = document.createElement("thead"), tr = document.createElement("tr");
  colunas.forEach(c => {
    const th = document.createElement("th");
    th.textContent = c.titulo;
    if (c.num) th.classList.add("num");
    /* Cabeçalho abreviado que se explica ao passar o cursor. "C/ N.C" e
       "Insp." economizam largura, mas quem lê pela primeira vez não adivinha
       — e a abreviação sozinha já causou a confusão entre VISITAS com
       problema e ITENS reprovados. Pedido de 27/08/2026. */
    if (c.dica) { th.title = c.dica; th.classList.add("sigla"); }
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb = document.createElement("tbody");
  linhas.forEach(l => {
    const r = document.createElement("tr");
    colunas.forEach(c => {
      const td = document.createElement("td");
      const v = c.valor(l);
      if (v instanceof Node) td.appendChild(v); else td.textContent = v;
      if (c.num) td.classList.add("num");
      if (c.classe) td.className += " " + (c.classe(l) || "");
      r.appendChild(td);
    });
    tb.appendChild(r);
  });
  t.appendChild(tb);
  host.innerHTML = ""; host.appendChild(t);
}
</script>
<script>
/* ============================================================
   AJUSTES — cadastro de equipes e inspetores
   Tabela com filtros, ações por linha e diálogo de criação/edição.
   ============================================================ */

/* Sugestão de e-mail a partir do nome: "José Pereira" -> jose.pereira */
const semAcentoAj = t => String(t || "").normalize("NFD")
  .replace(/[̀-ͯ]/g, "").toLowerCase().trim();


/* Meta de inspeção que cada função ganha por padrão, ao ser escolhida no
   cadastro. É sugestão, não trava: o administrador pode digitar outro
   número por cima, e aí o campo para de acompanhar a função.

   A chave é a função sem acento e em minúsculas, e o "de" é opcional —
   "Técnico Segurança" (como está cadastrado) e "Técnico de Segurança"
   (como se escreve) caem na mesma linha. */
const META_POR_FUNCAO = {
  "supervisor": 4,
  "tecnico seguranca": 12,
  "engenheiro seguranca": 4,
  "coordenador operacional": 4,
  "gerente operacional": 2
};
const metaDaFuncao = f => META_POR_FUNCAO[
  semAcentoAj(f).replace(/\bde\b/g, " ").replace(/\s+/g, " ").trim()];
const CAMPOS_EQUIPE = [
  { k: "equipe", rot: "Nome da equipe", obrigatorio: true },
  /* O tipo define o departamento, e é por ele que o app decide quais
     equipes mostrar ao inspetor. Por isso o departamento aparece aqui,
     no rótulo: escolher o tipo É escolher o departamento. */
  { k: "tipo", rot: "Tipo de equipe (define o departamento)", tipo: "select", opcoes: [
      ["LM", "Linha morta (rede desligada) — DCMD C&M"],
      ["MAN", "Manutenção — DCMD C&M"],
      ["LV", "Linha viva — DCMD LINHA VIVA"],
      ["POD", "Poda — DCMD PODA"],
      ["PER", "Perdas — DECP"],
      ["REA", "Reaviso — DECP"],
      ["PLA", "Plantão — DEOP"]] },
  { k: "supervisor", rot: "Supervisor", tipo: "select-livre", origem: () => [...new Set(
      Cadastros.inspetores.map(i => i.inspetor)
        .concat(Cadastros.equipes.map(e => e.supervisor)))].filter(Boolean).sort() },
  { k: "pontos", rot: "Pontos iniciais por mês", tipo: "numero", padrao: 100 },
  { k: "ativa", rot: "Situação", tipo: "booleano", rotSim: "Ativa", rotNao: "Inativa", padrao: true }
];

const CAMPOS_INSPETOR = [
  { k: "inspetor", rot: "Nome do inspetor", obrigatorio: true },
  { k: "funcao", rot: "Função", tipo: "select-livre", origem: () => [...new Set(
      Cadastros.inspetores.map(i => i.funcao))].filter(Boolean).sort() },
  { k: "polo", rot: "Polo", tipo: "select-livre", origem: () => [...new Set(
      Cadastros.inspetores.map(i => i.polo))].filter(Boolean).sort() },
  { k: "meta", rot: "Meta de inspeção (por mês)", tipo: "numero", padrao: 0 },
  { k: "ativo", rot: "Situação", tipo: "booleano", rotSim: "Ativo", rotNao: "Inativo", padrao: true }
];

const SECOES = {
  equipes: {
    titulo: "Equipes", desc: "Equipes de campo avaliadas na Jornada Segura.",
    novo: "Nova equipe", chave: "equipe", campos: CAMPOS_EQUIPE, statusK: "ativa",
    filtros: [["supervisor", "Supervisor"], ["tipo", "Tipo"], ["ativa", "Situação"]],
    /* "departamento" não é campo do banco: vem do tipo, pela mesma regra
       que o app usa. Ver DEPARTAMENTO_DO_TIPO. */
    colunas: [
      { t: "Equipe", v: r => r.equipe, forte: true },
      { t: "Supervisor", v: r => r.supervisor || "—" },
      { t: "Tipo", v: r => TIPOS_EQUIPE[r.tipo] || r.tipo || "—", etiqueta: true },
      { t: "Departamento", v: r => DEPARTAMENTO_DO_TIPO[r.tipo] || "—", etiqueta: true },
      { t: "Pontos", v: r => fmtN(r.pontos), num: true }
    ]
  },
  inspetores: {
    titulo: "Inspetores", desc: "Quem faz as inspeções e a meta individual de cada um.",
    novo: "Novo inspetor", chave: "inspetor", campos: CAMPOS_INSPETOR, statusK: "ativo",
    filtros: [["funcao", "Função"], ["polo", "Polo"], ["ativo", "Situação"]],
    /* "acesso" não é coluna do banco: é derivado do user_id, para dar
       um filtro de "quem ainda não tem login" sem inventar campo. */
    colunas: [
      { t: "Inspetor", v: r => r.inspetor, forte: true },
      { t: "Função", v: r => r.funcao || "—" },
      { t: "Polo", v: r => r.polo || "—", etiqueta: true },
      { t: "Meta", v: r => fmtN(r.meta), num: true },
      /* O e-mail em si, e não "tem login": é ele que o administrador precisa
         para avisar a pessoa, conferir se está no padrão do cadastro ou
         perceber que duas contas ficaram parecidas. Só aparece para
         administrador — para os outros, a função do banco devolve vazio e
         a coluna cai no "tem login" de antes. */
      { t: "Acesso", v: r => !r.user_id ? "—"
          : (Cadastros.acessos[r.inspetor] || "tem login") }
    ]
  },
  /* Inspeções — as feitas, para consultar e baixar.

     Sai do modelo já montado (FATO), não de uma consulta nova: é o mesmo
     conjunto que alimenta os números do painel. Assim a planilha baixada
     bate com a tela — se saísse de outra consulta, um dia divergiria e
     ninguém saberia qual das duas está certa. */
  inspecoes: {
    titulo: "Inspeções", desc: "Uma linha por não conformidade encontrada. "
      + "Use os filtros e baixe em PDF o que ficar na tela.",
    somenteLeitura: true, chave: "id", baixar: "⭳ Baixar PDF",
    /* O terceiro item da tupla é a ordem das opções, quando alfabética não
       serve: mês tem de sair jan→dez, e gravidade da pior para a mais leve. */
    filtros: [["ano", "Ano"], ["mesNome", "Mês", (a, b) => ORDEM_MES.indexOf(a) - ORDEM_MES.indexOf(b)],
              ["polo", "Polo"], ["equipe", "Equipe"], ["inspetor", "Inspetor"],
              ["gravidade", "Gravidade", (a, b) => postoGravidade(a) - postoGravidade(b)],
              ["tipo", "Departamento"]],
    /* UMA LINHA POR NÃO CONFORMIDADE, não por inspeção (27/08/2026).

       A inspeção com três desvios ocupa três linhas, repetindo data, equipe,
       inspetor e polo. Repetição é justamente o que torna a planilha
       utilizável: dá para ordenar por gravidade, filtrar por polo e contar
       desvio sem abrir nada. Escondê-los atrás de um clique ficava bonito na
       tela e inútil no papel.

       Inspeção sem desvio aparece uma vez, com "Sem desvio" — some da lista
       seria pior: pareceria que ninguém inspecionou aquela equipe. */
    colunas: [
      { t: "Data", v: r => r.dataStr },
      { t: "Equipe", v: r => r.equipe || r.equipeBruta || "—", forte: true },
      { t: "Inspetor", v: r => r.inspetor || r.inspetorBruto || "—" },
      { t: "Polo", v: r => r.polo || "—", etiqueta: true },
      { t: "Gravidade", v: r => r.gravidade, etiqueta: true },
      { t: "Não conformidade", v: r => r.descricao },
      /* A foto é da INSPEÇÃO, não do desvio: o app não pergunta a qual item
         ela se refere. Por isso o número se repete nas linhas da mesma
         inspeção, e abrir mostra todas de uma vez. */
      { t: "Fotos", v: r => { const n = (FOTOS_POR_INSPECAO[r.id] || []).length;
          return n ? "📷 " + n : "—"; }, num: true }
    ]
  },
  /* Rascunhos — só leitura, e de outra fonte: vem do banco na hora, não
     do cadastro. Fica aqui, e não numa página do painel, porque é
     manutenção do sistema e não indicador: rascunho NÃO conta como
     inspeção feita em lugar nenhum. Quem apaga é o inspetor, pelo app. */
  rascunhos: {
    titulo: "Rascunhos", desc: "Inspeções começadas no app e ainda não enviadas. "
      + "Não entram em nenhum número do painel.",
    somenteLeitura: true, chave: "id",
    filtros: [["inspetor", "Inspetor"], ["departamento", "Departamento"]],
    colunas: [
      { t: "Equipe", v: r => r.equipe || "—", forte: true },
      { t: "Inspetor", v: r => r.inspetor || "—" },
      { t: "Departamento", v: r => NOME_DEPARTAMENTO[r.departamento] || r.departamento || "—",
        etiqueta: true },
      { t: "Data", v: r => r.data ? r.data.slice(8, 10) + "/" + r.data.slice(5, 7)
                                    + "/" + r.data.slice(0, 4) : "—" },
      { t: "Respostas", v: r => fmtN(contaRespostas(r)), num: true },
      { t: "Começada em", v: r => r.criada_em
          ? new Date(r.criada_em).toLocaleString("pt-BR",
              { day: "2-digit", month: "2-digit", year: "2-digit",
                hour: "2-digit", minute: "2-digit" })
          : "—" }
    ]
  }
};
/* As não conformidades de uma inspeção: [id, pergunta, categoria, gravidade, pontos] */
const ncDe = r => NC_BY_ID[r.id] || [];

/* A tabela de fato desdobrada: uma linha por não conformidade, e uma linha
   para a inspeção que não teve nenhuma.

   Feito sob demanda, não guardado: FATO muda a cada sincronização e a cada
   edição de cadastro, e uma cópia velha aqui mostraria desvio de equipe que
   já foi renomeada. São ~120 inspeções — o custo é irrelevante. */
function inspecoesPorNC() {
  const linhas = [];
  FATO.forEach(r => {
    /* "ago" em vez de "8": o filtro de mês é lido por gente. O ano fica de
       fora do rótulo porque já existe filtro de ano — juntar os dois faria
       12 opções virarem 24 sem necessidade. */
    const base = Object.assign({}, r, { mesNome: MESES_NOME[+r.mes] });
    const nc = ncDe(r);
    if (!nc.length) {
      linhas.push(Object.assign({}, base, {
        gravidade: "Sem desvio", descricao: "—", pontosNC: 0, temNC: false
      }));
      return;
    }
    nc.forEach(x => linhas.push(Object.assign({}, base, {
      gravidade: x[3] || "Sem classificação",
      descricao: x[1] || "—",
      categoria: x[2] || "",
      pontosNC: x[4] || 0,
      temNC: true
    })));
  });
  return linhas;
}
const ORDEM_MES = MESES_NOME.slice(1);   // jan…dez, sem o vazio da posição 0

/* Da mais grave para a mais leve — é a ordem em que se lê um relatório de
   segurança. "Sem desvio" fica por último, e não no meio do alfabeto. */
const ORDEM_GRAVIDADE = ["Gravíssimo", "Grave", "Leve", "Sem classificação", "Sem desvio"];
const postoGravidade = g => {
  const i = ORDEM_GRAVIDADE.findIndex(o =>
    o.toLowerCase() === String(g || "").trim().toLowerCase());
  return i < 0 ? ORDEM_GRAVIDADE.length : i;
};

/* O count embutido do PostgREST chega como [{count: n}] */
const contaRespostas = r => (r.sesmt_respostas && r.sesmt_respostas[0]
  ? r.sesmt_respostas[0].count : 0);
const NOME_DEPARTAMENTO = { DCMD_CM: "DCMD C&M", DCMD_LV: "DCMD LINHA VIVA",
  DCMD_PODA: "DCMD PODA", DECP: "DECP", DEOP: "DEOP" };
const TIPOS_EQUIPE = { LM: "Linha morta", LV: "Linha viva", MAN: "Manutenção",
  PER: "Perdas", PLA: "Plantão", POD: "Poda", REA: "Reaviso" };

/* De qual departamento é cada tipo de equipe. É o que o app usa para
   mostrar ao inspetor só as equipes do departamento que ele escolheu.
   A regra oficial mora no banco, em sesmt_tipos_equipe; esta cópia serve
   só para rotular a tela do painel. Mudou lá, mude aqui. */
const DEPARTAMENTO_DO_TIPO = { LM: "DCMD C&M", MAN: "DCMD C&M", LV: "DCMD LINHA VIVA",
  POD: "DCMD PODA", PER: "DECP", REA: "DECP", PLA: "DEOP" };

/* Ordem de exibição dos inspetores: hierarquia de campo, não alfabeto.

const ORDEM_FUNCAO = ["Supervisor", "Técnico Segurança", "Engenheiro Segurança",
  "Coordenador Operacional", "Gerente Operacional"];
const postoFuncao = f => {
  const i = ORDEM_FUNCAO.findIndex(o => o.toLowerCase() === String(f || "").trim().toLowerCase());
  return i < 0 ? ORDEM_FUNCAO.length : i;
};
/* CONST 2 antes de CONST 10: comparação numérica, não alfabética */
const ordemNatural = (a, b) =>
  String(a || "").localeCompare(String(b || ""), "pt-BR", { numeric: true, sensitivity: "base" });

const Ajustes = {

    /* A trava não é por desempenho: carregarRascunhos() termina em render(),

  fonte(secao) {

  /* Relatório em PDF do que está na tela — com os filtros aplicados, não a

  /* Editar a inspeção — só o cabeçalho: equipe, data e departamento.

  editarInspecao(linha) {

        if (equipes.length && !equipes.includes(equipe)) {

  /* Relatório de UMA inspeção, com as fotos dentro.

  async baixarInspecao(linha, botao) {

<style>
/* ============================================================
   Tema claro: fundo branco, destaques em laranja.
   Neutros com leve viés quente para conversar com o acento.
   ============================================================ */
:root{
  --fundo:#ffffff;          /* ground da página */
  --canvas:#ffffff;
  --painel:#ffffff;         /* superfície dos visuais */
  --painel-alt:#fbf8f4;     /* cabeçalhos de tabela, faixas */
  --linha-borda:#e6e0d8;
  --sombra:0 1px 3px rgba(60,44,28,.08);

  --txt:#241f1a;
  --txt2:#7b7168;
  --txt3:#a49a90;

  --acento:#ef6c00;         /* laranja de destaque */
  --acento-forte:#c25100;   /* laranja escuro, para texto sobre branco */
  --acento-suave:#fdf0e3;   /* fundo de realce */

  --c1:#ef6c00;             /* série principal (realizado) */
  --c2:#b9c4ce;             /* série de referência (meta) */
  --c3:#7a5cff;
  --c-linha:#8c3b00;        /* linha de % */
  --c-total:#8a9aa8;

  --ruim:#c62828; --medio:#ef8f00; --bom:#2e7d32;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--txt);
  font-family:"Segoe UI","Open Sans",system-ui,-apple-system,sans-serif;overflow:hidden}

/* ---- palco: canvas 1510x720 escalado ---- */
#palco{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#canvas{position:relative;flex:0 0 auto;width:1510px;height:720px;transform-origin:center center;
  background:var(--canvas);
  box-shadow:0 10px 40px rgba(60,44,28,.14);border-radius:6px;overflow:hidden}
.pagina{position:absolute;inset:0;display:none}
.pagina.ativa{display:block}

/* ---- visuais ---- */
.v{position:absolute}
.painel{background:var(--painel);border:1px solid var(--linha-borda);border-radius:8px;
  box-shadow:var(--sombra)}
.titulo{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--txt2);
  text-transform:uppercase;padding:8px 10px 0}
.corpo{position:absolute;left:6px;right:6px;top:26px;bottom:6px}
.corpo.semtitulo{top:6px}

/* cards de KPI */
.card{background:var(--painel);border:1px solid var(--linha-borda);border-radius:8px;
  box-shadow:var(--sombra);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.card .valor{font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.card .rot{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2)}
.card.destaque{border-color:var(--acento)}
.card.destaque .valor{color:var(--acento-forte)}
.card.alerta .valor{color:var(--ruim)}
.card.ok .valor{color:var(--bom)}

/* cabeçalho */
.faixa-topo{position:absolute;left:0;right:0;top:0;height:78px;
  background:var(--painel-alt);border-bottom:3px solid var(--acento)}
.marca{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:10px}
.marca .logo{width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,var(--acento),var(--acento-forte));
  display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.marca .nome{font-size:15px;font-weight:700;letter-spacing:.04em}
.marca .sub{font-size:10px;color:var(--txt2);letter-spacing:.1em;text-transform:uppercase}
.voltar{position:absolute;left:16px;top:86px;width:44px;height:44px;border-radius:10px;
  background:var(--painel);border:1px solid var(--linha-borda);color:var(--txt);
  cursor:pointer;font-size:18px}
.voltar:hover{border-color:var(--acento);color:var(--acento-forte);background:var(--acento-suave)}

/* slicers */
.faixa-slicers{position:absolute;left:70px;right:16px;top:88px;height:44px;
  display:flex;gap:8px;align-items:center}
.slicer{position:relative;flex:1;max-width:150px}
.slicer>button{width:100%;height:40px;border-radius:8px;background:var(--painel);
  border:1px solid var(--linha-borda);color:var(--txt);text-align:left;padding:4px 22px 4px 9px;
  cursor:pointer;font-size:11px;line-height:1.15}
.slicer>button .lb{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2)}
.slicer>button .vl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slicer>button::after{content:"▾";position:absolute;right:8px;top:12px;color:var(--txt3)}
.slicer.on>button{border-color:var(--acento);background:var(--acento-suave);color:var(--acento-forte)}
.lista{position:absolute;z-index:40;top:42px;left:0;min-width:100%;max-height:230px;overflow:auto;
  background:var(--painel);border:1px solid var(--acento);border-radius:8px;padding:4px;display:none;
  box-shadow:0 8px 24px rgba(60,44,28,.16)}
.slicer.aberto .lista{display:block}
.lista label{display:flex;gap:6px;align-items:center;padding:4px 6px;font-size:11px;
  border-radius:5px;cursor:pointer;white-space:nowrap}
.lista label:hover{background:var(--acento-suave)}
.lista input{accent-color:var(--acento)}
.limpar{flex:0 0 auto;height:40px;padding:0 12px;border-radius:8px;white-space:nowrap;
  background:transparent;border:1px solid var(--linha-borda);color:var(--txt2);cursor:pointer;font-size:11px}
.limpar:hover{border-color:var(--ruim);color:var(--ruim)}
.btn-filtros{display:none}

/* navegação (PAINEL) */
.menu-btn{display:flex;align-items:center;gap:14px;width:100%;height:100%;
  background:var(--painel);border:1px solid var(--linha-borda);
  border-left:4px solid var(--acento);border-radius:10px;color:var(--txt);cursor:pointer;
  padding:0 18px;font-size:16px;font-weight:600;letter-spacing:.03em;text-align:left;
  box-shadow:var(--sombra);transition:.15s}
.menu-btn:hover{background:var(--acento-suave);border-color:var(--acento);transform:translateX(3px)}
.menu-btn .ic{font-size:20px;width:26px;text-align:center}
.menu-btn .desc{display:block;font-size:10.5px;font-weight:400;color:var(--txt2)}

/* rodapé de páginas */
.abas{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--painel-alt);
  border-top:1px solid var(--linha-borda);display:flex;align-items:center;gap:2px;padding:0 8px;z-index:30}
.abas button{background:transparent;border:0;color:var(--txt2);font-size:11px;padding:5px 10px;
  border-radius:5px;cursor:pointer}
.abas button:hover{color:var(--acento-forte);background:var(--acento-suave)}
.abas button.on{background:var(--acento);color:#fff;font-weight:700}
.abas .att{margin-left:auto;font-size:10px;color:var(--txt3);padding-right:6px}

/* tabelas */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl thead th{position:sticky;top:0;background:var(--painel-alt);color:var(--txt2);text-align:left;
  padding:6px 8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  border-bottom:2px solid var(--acento);white-space:nowrap}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--linha-borda)}
.tbl tbody tr:hover{background:var(--acento-suave)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .ok{color:var(--bom);font-weight:600}
.tbl .nok{color:var(--ruim);font-weight:600}
.rolagem{overflow:auto;height:100%}
.medalha{font-size:14px}

/* svg */
.chart{display:block}
.grade{stroke:#eee7de;stroke-width:1}
.eixo{fill:var(--txt2);font-size:9.5px}
.eixo2{fill:var(--c-linha)}
.rotulo{fill:var(--txt);font-size:9px;font-weight:600}
.rotulo-linha{fill:var(--c-linha);font-size:9px;font-weight:700}
/* o rótulo fica por cima da barra colorida: contorno branco garante leitura
   tanto sobre a barra quanto sobre o fundo, quando o texto passa dela */
.rotulo-barra{fill:var(--txt);font-size:10px;
  paint-order:stroke fill;stroke:var(--painel);stroke-width:3px;stroke-linejoin:round}
.vazio{fill:var(--txt3);font-size:12px}
.meta{stroke:var(--c2);stroke-width:1.5;stroke-dasharray:5 4}
.ponteiro{stroke:var(--txt);stroke-width:3;stroke-linecap:round}
.pivo{fill:var(--txt)}
.gauge-valor{fill:var(--txt);font-size:22px;font-weight:800}
.legenda{position:absolute;right:8px;top:6px;display:flex;gap:10px;font-size:9px;color:var(--txt2)}
.legenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ============================================================
   MODO FLUIDO — telas estreitas (celular / tablet retrato)
   Os mesmos visuais, reempilhados numa grade de 2 colunas.
   ============================================================ */
@media (max-width:1099px){
  html,body{overflow:auto;height:auto;-webkit-text-size-adjust:100%}
  #palco{position:static;display:block}
  #canvas{width:100%;height:auto;min-height:100vh;transform:none;border-radius:0;box-shadow:none}
  .pagina{position:static;inset:auto}
  .pagina.ativa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;padding:10px 10px 66px;align-content:start}

  .faixa-topo{display:none}
  .marca{position:static;grid-column:1/-1;padding:4px 0}
  .voltar{position:static;grid-column:1/-1;width:auto;height:38px;padding:0 14px;
    justify-self:start;font-size:14px}

  /* todo visual perde o posicionamento absoluto e vira item da grade */
  .v{position:relative;left:auto!important;top:auto!important;
    width:auto!important;height:auto!important}
  .card{grid-column:span 1;min-height:74px;padding:8px 4px}
  /* no fluido o painel vira coluna flex: o título pode quebrar em 2 linhas
     sem passar por cima do conteúdo */
  .painel{grid-column:1/-1;min-height:290px;display:flex;flex-direction:column}
  .titulo{position:static;flex:0 0 auto;padding:9px 10px 4px;font-size:11px}
  .corpo{position:static;flex:1 1 auto;min-height:240px;margin:0 6px 6px}
  .legenda{position:static;justify-content:flex-end;padding:0 8px 4px}

  /* filtros recolhidos atrás de um botão */
  .btn-filtros{display:flex;align-items:center;justify-content:center;gap:8px;
    grid-column:1/-1;height:42px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
    background:var(--painel);border:1px solid var(--linha-borda);color:var(--txt);
    box-shadow:var(--sombra)}
  .btn-filtros .cont{font-size:11px;color:var(--txt2)}
  .btn-filtros.on{border-color:var(--acento);color:var(--acento-forte);background:var(--acento-suave)}
  .faixa-slicers{display:none}
  .pagina.filtros-abertos .faixa-slicers{position:static;grid-column:1/-1;height:auto;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
  .slicer{max-width:none}
  .limpar{grid-column:1/-1;width:100%;height:42px}
  .lista{max-height:52vh}

  /* tabela rola na horizontal em vez de espremer as colunas */
  .rolagem{max-height:66vh}
  .tbl{font-size:12.5px;min-width:620px}
  .tbl td,.tbl thead th{padding:8px 9px;white-space:nowrap}

  .abas{position:fixed;bottom:0;overflow-x:auto;flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    box-shadow:0 -2px 10px rgba(60,44,28,.10)}
  .abas::-webkit-scrollbar{display:none}
  .abas button{white-space:nowrap;flex:0 0 auto}
  .abas .att{display:none}

  /* alvos de toque maiores */
  .lista label{padding:9px 8px}
  .slicer>button{height:46px}
}

/* celular estreito: 2 cards por linha, visuais mais altos */
@media (max-width:520px){
  .pagina.ativa{padding:8px 8px 66px;gap:8px}
  .card{min-height:62px;padding:6px 4px}
  .card .valor{font-size:20px}
  .card .rot{font-size:8.5px}
  .painel{min-height:300px}
  .marca .nome{font-size:14px}
  .voltar{height:36px}
}

/* pódio */
.podio{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px}
.podio .tit{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt2)}
.podio .eq{font-size:30px;font-weight:800;color:var(--acento-forte)}
.podio .pts{font-size:13px;color:var(--txt2)}
.podio .lugar{display:flex;align-items:center;gap:10px;width:80%;padding:8px 14px;border-radius:8px;
  background:var(--painel-alt);border:1px solid var(--linha-borda);font-size:13px}
.podio .lugar b{margin-left:auto;font-variant-numeric:tabular-nums}

<script>
/* ============================================================
   MODELO SEMÂNTICO — réplica em JS das medidas DAX do relatório
   ============================================================ */

const IDX_INSPETOR = Object.fromEntries(INSPETORES.map(r => [r[0], r]));
const IDX_EQUIPE   = Object.fromEntries(EQUIPES.map(r => [r[0], r]));
const NC_BY_ID     = NC.reduce((a, r) => ((a[r[0]] = a[r[0]] || []).push(r), a), {});
const MESES_NOME   = ["","jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

/* Enriquecimento das inspeções: {id, inspetor, equipe, tipo, data, mesAno, serial, dia, area, funcao, supervisor, tipoEquipe} */
const FATO = INSPECOES.map(r => {
  const [d, m, y] = r[4].split("/").map(Number);
  const mesAno = m + "/" + y;
  // As dimensões INSPETOR e EQUIPE se ligam ao fato por chaves versionadas por mês
  // (INSPETOR_ID / EQUIPE_ID em "Meta Inspetores" e "Equipes"). Meses sem cadastro
  // não casam e caem no grupo "(vazio)", exatamente como no relatório original.
  const vigente = META_MESES.includes(mesAno);
  const insp = vigente ? IDX_INSPETOR[r[1]] : null;
  const eq   = vigente ? IDX_EQUIPE[r[2]]   : null;
  return {
    id: r[0], inspetor: insp ? r[1] : "", inspetorBruto: r[1],
    equipe: eq ? r[2] : "", equipeBruta: r[2],
    tipo: r[3], data: new Date(y, m - 1, d),
    dataStr: r[4], mesAno, serial: "" + y + String(m).padStart(2, "0"),
    ano: "" + y, mes: "" + m,
    area: insp ? insp[2] : "", funcao: insp ? insp[4] : "", cargo: insp ? insp[1] : "",
    supervisor: eq ? eq[2] : "", tipoEquipe: eq ? eq[1] : ""
  };
});

/* ---------- Filtros ---------- */
const CAMPOS = ["ano", "mes", "area", "inspetor", "funcao", "supervisor", "equipe"];
const filtros = Object.fromEntries(CAMPOS.map(c => [c, new Set()]));

const ativo = c => filtros[c].size > 0;
const bate  = (c, v) => !ativo(c) || filtros[c].has(v);

/* Meses (Mês/Ano) que sobrevivem aos filtros de data */
function mesesAtivos() {
  return DDATA.filter(d => {
    const [m, y] = d[0].split("/");
    return bate("ano", y) && bate("mes", m);
  });
}

/* Inspeções filtradas */
function fatoFiltrado(ignorar) {
  const ig = new Set(ignorar || []);
  const ok = (c, v) => ig.has(c) || bate(c, v);
  return FATO.filter(f =>
    ok("ano", f.ano) && ok("mes", f.mes) && ok("area", f.area) &&
    ok("inspetor", f.inspetor) && ok("funcao", f.funcao) &&
    ok("supervisor", f.supervisor) && ok("equipe", f.equipe));
}

/* ---------- Medidas ---------- */
// #Medidas
function Dias_uteis(ms)          { return (ms || mesesAtivos()).reduce((a, d) => a + d[2], 0); }
function Dias_uteis_ate_hoje(ms) { return (ms || mesesAtivos()).reduce((a, d) => a + d[3], 0); }

function inspetoresValidos() {
  return INSPETORES.filter(i => bate("area", i[2]) && bate("inspetor", i[0]) && bate("funcao", i[4]));
}
function Qtd_Inspetor(ms) {
  const meses = (ms || mesesAtivos()).map(d => d[0]).filter(m => META_MESES.includes(m));
  return inspetoresValidos().length * meses.length;
}
// Meta_Insp = SUMX('Meta Inspetores'; [META INSPEÇÃO DINAMICA]) — metas versionadas por mês
function Meta_Insp(ms) {
  const meses = (ms || mesesAtivos()).map(d => d[0]).filter(m => META_MESES.includes(m));
  const porMes = inspetoresValidos().reduce((a, i) => a + i[5], 0);
  return porMes * meses.length;
}
// Meta_insp_dia = Meta_Insp / Dias_uteis * Dias_uteis_até_hoje
function Meta_insp_dia(ms) {
  const du = Dias_uteis(ms);
  return du ? Meta_Insp(ms) / du * Dias_uteis_ate_hoje(ms) : 0;
}

// #Medidas_Teccel
const Qtd_Insp        = f => f.length;
const linhasNC        = f => f.flatMap(x => NC_BY_ID[x.id] || []);
const Qtd_NC          = f => linhasNC(f).length;
const Qtd_Inspecao_NC = f => new Set(linhasNC(f).map(r => r[0])).size;
const ICIT            = f => f.length ? (f.length - Qtd_Inspecao_NC(f)) / f.length : null;
const PontosNC        = f => linhasNC(f).reduce((a, r) => a + r[4], 0);

const pct = (a, b) => (b ? a / b : null);
// % Atingida = MIN(DIVIDE([Qtd]; [Meta_insp_dia]); 1) — o original limita em 100%
const pctAtingida = (a, b) => (b ? Math.min(a / b, 1) : null);

/* Pacote de KPIs do cabeçalho */
function kpis(f, ms) {
  f  = f  || fatoFiltrado();
  ms = ms || mesesAtivos();
  const q = Qtd_Insp(f), nc = Qtd_Inspecao_NC(f), meta = Meta_Insp(ms), md = Meta_insp_dia(ms);
  return {
    Qtd_Insp: q, Qtd_Inspecao_NC: nc, Qtd_NC: Qtd_NC(f),
    Meta_Insp: meta, Meta_insp_dia: md,
    Dias_uteis: Dias_uteis(ms), Dias_uteis_ate_hoje: Dias_uteis_ate_hoje(ms),
    Qtd_Inspetor: Qtd_Inspetor(ms),
    ICIT: ICIT(f),
    pctInspecao: pctAtingida(q, md), // %Inspeção_Teccel (= % Atingida, limitado a 100%)
    pctMetaTotal: pct(q, meta)      // %MetaInspTeccelTotal
  };
}

/* Agrupamento genérico: devolve [{chave, fato[], qtd, nc, icit, meta, metaDia, pct}] */
function agrupar(f, campo, ms) {
  ms = ms || mesesAtivos();
  const mapa = new Map();
  f.forEach(x => {
    const k = x[campo] || "(vazio)";
    if (!mapa.has(k)) mapa.set(k, []);
    mapa.get(k).push(x);
  });
  return [...mapa].map(([k, rows]) => {
    let meta = 0, metaDia = 0;
    if (campo === "inspetor") {
      const i = IDX_INSPETOR[k];
      const meses = ms.map(d => d[0]).filter(m => META_MESES.includes(m)).length;
      const du = Dias_uteis(ms);
      meta = i ? i[5] * meses : 0;
      metaDia = du ? meta / du * Dias_uteis_ate_hoje(ms) : 0;
    }
    const nc = Qtd_Inspecao_NC(rows);
    return {
      chave: k, fato: rows, qtd: rows.length, nc, ncLinhas: Qtd_NC(rows),
      icit: ICIT(rows), meta, metaDia, pct: pctAtingida(rows.length, metaDia),
      pctTotal: pct(rows.length, meta), pontosNC: PontosNC(rows)
    };
  });
}

/* Agrupamento por inspetor incluindo quem tem meta mas nenhuma inspeção
   (o original lista todos os cadastrados em "Meta Inspetores") */
function porInspetor(f, ms, comVazio) {
  ms = ms || mesesAtivos();
  const g = agrupar(f, "inspetor", ms);
  const achados = new Set(g.map(x => x.chave));
  const meses = ms.map(d => d[0]).filter(m => META_MESES.includes(m)).length;
  const du = Dias_uteis(ms), duh = Dias_uteis_ate_hoje(ms);
  inspetoresValidos().forEach(i => {
    if (achados.has(i[0])) return;
    const meta = i[5] * meses;
    g.push({
      chave: i[0], fato: [], qtd: 0, nc: 0, ncLinhas: 0, icit: null,
      meta, metaDia: du ? meta / du * duh : 0, pct: 0, pctTotal: 0, pontosNC: 0
    });
  });
  return g.filter(x => comVazio || x.chave !== "(vazio)");
}

/* Jornada Segura — pontuação por equipe */
function jornada(f, ms) {
  ms = ms || mesesAtivos();
  const mesesPonto = ms.map(d => d[0]).filter(m => META_MESES.includes(m)).length;
  const linhas = agrupar(f, "equipe", ms).map(g => {
    const eq = IDX_EQUIPE[g.chave];
    const ini = eq ? eq[3] * mesesPonto : null;
    const fim = ini === null ? null : ini + g.pontosNC;
    return {
      equipe: g.chave, supervisor: eq ? eq[2] : "", tipo: eq ? eq[1] : "",
      qtd: g.qtd, nc: g.nc, ncLinhas: g.ncLinhas, icit: g.icit,
      pontosIniciais: ini, pontosNC: g.pontosNC, pontosFinal: fim,
      // Critério Desempate = Pontos Final + (inspeções sem N.C)/10  — confirmado no relatório original
      desempate: fim === null ? null : fim + (g.qtd - g.nc) / 10
    };
  });
  linhas.sort((a, b) => (b.desempate ?? -1e9) - (a.desempate ?? -1e9));
  linhas.forEach((l, i) => l.ranking = l.desempate === null ? null : i + 1);
  return linhas;
}

/* Séries temporais */
function porMes(f, ms) {
  ms = ms || mesesAtivos();
  return ms.map(d => {
    const rows = f.filter(x => x.mesAno === d[0]);
    const nc = Qtd_Inspecao_NC(rows);
    const temMeta = META_MESES.includes(d[0]);
    const meta = temMeta ? Meta_Insp([d]) : 0;
    return {
      chave: MESES_NOME[+d[0].split("/")[0]] + "/" + d[0].split("/")[1].slice(2),
      mesAno: d[0], qtd: rows.length, nc, ncLinhas: Qtd_NC(rows), icit: ICIT(rows),
      meta, metaDia: Meta_insp_dia([d]), pct: pct(rows.length, Meta_insp_dia([d])),
      qtdInspetor: temMeta ? inspetoresValidos().length : 0
    };
  });
}

function porDia(f) {
  const mapa = new Map();
  f.forEach(x => {
    const k = x.data.getTime();
    if (!mapa.has(k)) mapa.set(k, []);
    mapa.get(k).push(x);
  });
  return [...mapa].sort((a, b) => a[0] - b[0]).map(([k, rows]) => ({
    chave: rows[0].dataStr.slice(0, 5), data: new Date(k),
    qtd: rows.length, nc: Qtd_Inspecao_NC(rows)
  }));
}

/* Inconformidades por categoria / pergunta (grão de resposta) */
function ncPorCampo(f, i) {
  const linhas = linhasNC(f);
  const mapa = new Map();
  linhas.forEach(r => {
    const k = r[i] || "(sem categoria)";
    mapa.set(k, (mapa.get(k) || 0) + 1);
  });
  return [...mapa].map(([chave, qtd]) => ({ chave, qtd })).sort((a, b) => b.qtd - a.qtd);
}
function gravidades(f) {
  const g = { "Leve": 0, "Grave": 0, "Gravíssimo": 0, "": 0 };
  linhasNC(f).forEach(r => g[r[3]] = (g[r[3]] || 0) + 1);
  return g;
}

/* Valores disponíveis para cada slicer (respeitando os demais filtros) */
function opcoes(campo) {
  const base = fatoFiltrado([campo]);
  const vals = new Set();
  if (campo === "ano" || campo === "mes") {
    DDATA.forEach(d => {
      const [m, y] = d[0].split("/");
      vals.add(campo === "ano" ? y : m);
    });
  } else {
    base.forEach(f => { if (f[campo]) vals.add(f[campo]); });
    if (campo === "inspetor") INSPETORES.forEach(i => vals.add(i[0]));
    if (campo === "area")     INSPETORES.forEach(i => vals.add(i[2]));
    if (campo === "funcao")   INSPETORES.forEach(i => vals.add(i[4]));
  }
  return [...vals].sort((a, b) =>
    campo === "mes" ? a - b : String(a).localeCompare(String(b), "pt-BR", { numeric: true }));
}

<script>
/* ============================================================
   VISUAIS — SVG puro, sem bibliotecas externas
   Réplica dos tipos usados no relatório original:
   lineClusteredColumnComboChart, Tachometer, waterfallChart, tableEx, card
   ============================================================ */

const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, txt) => {
  const n = document.createElementNS(NS, t);
  for (const k in a) if (a[k] !== null && a[k] !== undefined) n.setAttribute(k, a[k]);
  if (txt !== undefined) n.textContent = txt;
  return n;
};
const fmtN  = v => v === null || v === undefined ? "—" : Math.round(v).toLocaleString("pt-BR");
const fmtP  = (v, d = 1) => v === null || v === undefined ? "—" : (v * 100).toFixed(d).replace(".", ",") + "%";
const fmtD  = (v, d = 1) => v === null || v === undefined ? "—" : v.toFixed(d).replace(".", ",");
const corta = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

/* ---------- Combo: colunas agrupadas + linha (o visual mais usado) ---------- */
function comboChart(host, dados, opt) {
  opt = Object.assign({
    series: [{ key: "qtd", label: "Realizado", cor: "var(--c1)" }],
    linha: null, rotulo: "chave", pctLinha: true, rotacionar: true,
    metaLinha: null, maxRot: 14
  }, opt);

  const W = host.clientWidth, H = host.clientHeight;
  const m = { t: 16, r: opt.linha ? 44 : 14, b: opt.rotacionar ? 62 : 30, l: 40 };
  const iw = Math.max(10, W - m.l - m.r), ih = Math.max(10, H - m.t - m.b);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = "";
  host.appendChild(svg);
  if (!dados.length) { svg.appendChild(el("text", { x: W / 2, y: H / 2, class: "vazio", "text-anchor": "middle" }, "sem dados")); return; }

  const maxV = Math.max(1, ...dados.flatMap(d => opt.series.map(s => d[s.key] || 0)));
  const esc  = v => ih - (v / maxV) * ih;
  const bw   = iw / dados.length;
  const sw   = Math.min(26, (bw * 0.68) / opt.series.length);

  const g = el("g", { transform: `translate(${m.l},${m.t})` });
  svg.appendChild(g);

  /* grade + eixo Y */
  for (let i = 0; i <= 4; i++) {
    const y = ih - (ih / 4) * i, v = (maxV / 4) * i;
    g.appendChild(el("line", { x1: 0, x2: iw, y1: y, y2: y, class: "grade" }));
    g.appendChild(el("text", { x: -8, y: y + 4, class: "eixo", "text-anchor": "end" }, fmtN(v)));
  }

  /* colunas */
  dados.forEach((d, i) => {
    const x0 = i * bw + (bw - sw * opt.series.length) / 2;
    opt.series.forEach((s, j) => {
      const v = d[s.key] || 0, y = esc(v);
      const r = el("rect", { x: x0 + j * sw, y, width: sw - 2, height: Math.max(0, ih - y), fill: s.cor, rx: 2, class: "barra" });
      r.appendChild(el("title", {}, `${d[opt.rotulo]}\n${s.label}: ${fmtN(v)}`));
      g.appendChild(r);
      if (v > 0 && dados.length <= 20)
        g.appendChild(el("text", { x: x0 + j * sw + (sw - 2) / 2, y: y - 4, class: "rotulo", "text-anchor": "middle" }, fmtN(v)));
    });
  });

  /* meta como linha de referência */
  if (opt.metaLinha !== null && opt.metaLinha !== undefined && opt.metaLinha <= maxV) {
    const y = esc(opt.metaLinha);
    g.appendChild(el("line", { x1: 0, x2: iw, y1: y, y2: y, class: "meta" }));
  }

  /* linha secundária (%) */
  if (opt.linha) {
    const vals = dados.map(d => d[opt.linha.key]);
    const finitos = vals.filter(v => v !== null && v !== undefined);
    const maxL = opt.pctLinha ? Math.max(1, ...finitos) : Math.max(1, ...finitos);
    const escL = v => ih - (v / maxL) * ih;
    let dpath = "", prev = false;
    dados.forEach((d, i) => {
      const v = d[opt.linha.key], x = i * bw + bw / 2;
      if (v === null || v === undefined) { prev = false; return; }
      dpath += (prev ? "L" : "M") + x + " " + escL(v);
      prev = true;
    });
    g.appendChild(el("path", { d: dpath, fill: "none", stroke: opt.linha.cor || "var(--c-linha)", "stroke-width": 2.5, "stroke-linejoin": "round" }));
    dados.forEach((d, i) => {
      const v = d[opt.linha.key];
      if (v === null || v === undefined) return;
      const x = i * bw + bw / 2, y = escL(v);
      const c = el("circle", { cx: x, cy: y, r: 3.5, fill: opt.linha.cor || "var(--c-linha)" });
      c.appendChild(el("title", {}, `${d[opt.rotulo]}\n${opt.linha.label}: ${opt.pctLinha ? fmtP(v) : fmtD(v)}`));
      g.appendChild(c);
      if (dados.length <= 16)
        g.appendChild(el("text", { x, y: y - 9, class: "rotulo-linha", "text-anchor": "middle" }, opt.pctLinha ? fmtP(v, 0) : fmtD(v, 0)));
    });
    for (let i = 0; i <= 4; i++) {
      const y = ih - (ih / 4) * i, v = (maxL / 4) * i;
      g.appendChild(el("text", { x: iw + 8, y: y + 4, class: "eixo eixo2" }, opt.pctLinha ? fmtP(v, 0) : fmtD(v, 0)));
    }
  }

  /* eixo X */
  dados.forEach((d, i) => {
    const x = i * bw + bw / 2;
    const t = el("text", { x, y: ih + 14, class: "eixo", "text-anchor": opt.rotacionar ? "end" : "middle" },
      corta(String(d[opt.rotulo]), opt.maxRot));
    if (opt.rotacionar) t.setAttribute("transform", `rotate(-35 ${x} ${ih + 14})`);
    g.appendChild(t);
  });
}

/* ---------- Tachometer (velocímetro) ---------- */
function gauge(host, valor, opt) {
  opt = Object.assign({ min: 0, max: 1, faixas: [0.5, 0.8], formato: fmtP, alvo: null }, opt);
  const W = host.clientWidth, H = host.clientHeight;
  const cx = W / 2, cy = H * 0.72, R = Math.min(W * 0.42, H * 0.62), r = R * 0.62;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = ""; host.appendChild(svg);

  const ang = v => Math.PI * (1 - Math.min(1, Math.max(0, (v - opt.min) / (opt.max - opt.min))));
  const arco = (a0, a1, cor) => {
    const p = (a, rr) => [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
    const [x0, y0] = p(a0, R), [x1, y1] = p(a1, R), [x2, y2] = p(a1, r), [x3, y3] = p(a0, r);
    const large = Math.abs(a1 - a0) > Math.PI ? 1 : 0;
    return el("path", {
      d: `M${x0} ${y0} A${R} ${R} 0 ${large} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${large} 0 ${x3} ${y3} Z`,
      fill: cor
    });
  };
  const lim = [opt.min, ...opt.faixas, opt.max];
  const cores = ["var(--ruim)", "var(--medio)", "var(--bom)"];
  for (let i = 0; i < lim.length - 1; i++) svg.appendChild(arco(ang(lim[i]), ang(lim[i + 1]), cores[i] || "var(--bom)"));

  if (valor !== null && valor !== undefined) {
    const a = ang(valor);
    const px = cx + (R * 0.98) * Math.cos(a), py = cy - (R * 0.98) * Math.sin(a);
    svg.appendChild(el("line", { x1: cx, y1: cy, x2: px, y2: py, class: "ponteiro" }));
    svg.appendChild(el("circle", { cx, cy, r: 6, class: "pivo" }));
  }
  svg.appendChild(el("text", { x: cx, y: cy + 34, class: "gauge-valor", "text-anchor": "middle" }, opt.formato(valor)));
  svg.appendChild(el("text", { x: cx - R - 2, y: cy + 16, class: "eixo", "text-anchor": "middle" }, opt.formato(opt.min, 0)));
  svg.appendChild(el("text", { x: cx + R + 2, y: cy + 16, class: "eixo", "text-anchor": "middle" }, opt.formato(opt.max, 0)));
}

/* ---------- Waterfall (inconformidades por categoria) ---------- */
function waterfall(host, dados) {
  const W = host.clientWidth, H = host.clientHeight;
  const m = { t: 18, r: 12, b: 58, l: 38 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = ""; host.appendChild(svg);
  if (!dados.length) { svg.appendChild(el("text", { x: W / 2, y: H / 2, class: "vazio", "text-anchor": "middle" }, "sem dados")); return; }

  const total = dados.reduce((a, d) => a + d.qtd, 0);
  const passos = [...dados, { chave: "Total", qtd: total, total: true }];
  const max = total;
  const bw = iw / passos.length, sw = Math.min(40, bw * 0.62);
  const g = el("g", { transform: `translate(${m.l},${m.t})` });
  svg.appendChild(g);
  for (let i = 0; i <= 4; i++) {
    const y = ih - (ih / 4) * i;
    g.appendChild(el("line", { x1: 0, x2: iw, y1: y, y2: y, class: "grade" }));
    g.appendChild(el("text", { x: -8, y: y + 4, class: "eixo", "text-anchor": "end" }, fmtN((max / 4) * i)));
  }
  let acc = 0;
  passos.forEach((d, i) => {
    const x = i * bw + (bw - sw) / 2;
    const y0 = ih - (acc / max) * ih;
    const alt = (d.qtd / max) * ih;
    const y = d.total ? ih - alt : y0 - alt;
    const rect = el("rect", { x, y, width: sw, height: Math.max(1, alt), rx: 2, fill: d.total ? "var(--c-total)" : "var(--ruim)" });
    rect.appendChild(el("title", {}, `${d.chave}: ${d.qtd}`));
    g.appendChild(rect);
    g.appendChild(el("text", { x: x + sw / 2, y: y - 5, class: "rotulo", "text-anchor": "middle" }, fmtN(d.qtd)));
    if (!d.total) acc += d.qtd;
    const t = el("text", { x: x + sw / 2, y: ih + 14, class: "eixo", "text-anchor": "end" }, corta(d.chave, 16));
    t.setAttribute("transform", `rotate(-35 ${x + sw / 2} ${ih + 14})`);
    g.appendChild(t);
  });
}

/* ---------- Barras horizontais (TOP 5 inconformidades) ---------- */
function barrasH(host, dados, opt) {
  opt = Object.assign({ cor: "var(--ruim)", maxRot: 46 }, opt);
  const W = host.clientWidth, H = host.clientHeight;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart" });
  host.innerHTML = ""; host.appendChild(svg);
  if (!dados.length) { svg.appendChild(el("text", { x: W / 2, y: H / 2, class: "vazio", "text-anchor": "middle" }, "sem dados")); return; }
  const max = Math.max(...dados.map(d => d.qtd));
  const alt = Math.min(34, (H - 12) / dados.length);
  dados.forEach((d, i) => {
    const y = 8 + i * alt;
    const larg = (d.qtd / max) * (W - 40);
    const r = el("rect", { x: 0, y, width: Math.max(2, larg), height: alt - 8, rx: 2, fill: opt.cor });
    r.appendChild(el("title", {}, `${d.chave}\n${d.qtd} ocorrência(s)`));
    svg.appendChild(r);
    svg.appendChild(el("text", { x: 6, y: y + (alt - 8) / 2 + 4, class: "rotulo-barra" }, corta(d.chave, opt.maxRot)));
    svg.appendChild(el("text", { x: Math.max(2, larg) + 6, y: y + (alt - 8) / 2 + 4, class: "rotulo" }, d.qtd));
  });
}

/* ---------- Tabela (tableEx) ---------- */
function tabela(host, colunas, linhas) {
  const t = document.createElement("table");
  t.className = "tbl";
  const thead = document.createElement("thead"), tr = document.createElement("tr");
  colunas.forEach(c => {
    const th = document.createElement("th");
    th.textContent = c.titulo;
    if (c.num) th.classList.add("num");
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb = document.createElement("tbody");
  linhas.forEach(l => {
    const r = document.createElement("tr");
    colunas.forEach(c => {
      const td = document.createElement("td");
      const v = c.valor(l);
      if (v instanceof Node) td.appendChild(v); else td.textContent = v;
      if (c.num) td.classList.add("num");
      if (c.classe) td.className += " " + (c.classe(l) || "");
      r.appendChild(td);
    });
    tb.appendChild(r);
  });
  t.appendChild(tb);
  host.innerHTML = ""; host.appendChild(t);
}

<script>
/* ============================================================
   APP — 7 páginas replicando a estrutura do relatório original
   Coordenadas extraídas do JSON de layout do Power BI (canvas 1510x720)
   ============================================================ */

const canvas = document.getElementById("canvas");
const PAGINAS = [
  { id: "painel",  nome: "PAINEL",            icone: "🏠", desc: "Menu principal" },
  { id: "taxa",    nome: "Taxa de Contato",   icone: "📊", desc: "Realizado x meta por inspetor" },
  { id: "ranking", nome: "Ranking",           icone: "🏅", desc: "Desempenho individual dos inspetores" },
  { id: "avanco",  nome: "Avanço Mensal",     icone: "📈", desc: "Evolução mês a mês da taxa e do ICIT" },
  { id: "icit",    nome: "ICIT",              icone: "🛡️", desc: "Conformidade e inconformidades" },
  { id: "dia",     nome: "Inspeções por dia", icone: "📅", desc: "Volume diário de inspeções" },
  { id: "jornada", nome: "Jornada Segura",    icone: "🏆", desc: "Ranking de pontuação das equipes" }
];
let paginaAtual = "painel";

/* ---------- helpers de construção ---------- */
function box(pai, x, y, w, h, cls) {
  const d = document.createElement("div");
  d.className = "v " + (cls || "");
  d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  pai.appendChild(d);
  return d;
}
function visual(pai, x, y, w, h, titulo) {

  const c = document.createElement("div");
  c.className = "corpo" + (titulo ? "" : " semtitulo");
  d.appendChild(c);
  return c;
}
function cartao(pai, x, y, w, h, rotulo, classe) {
  const d = box(pai, x, y, w, h, "card " + (classe || ""));
  d.innerHTML = `<div class="valor">—</div><div class="rot">${rotulo}</div>`;
  return d.querySelector(".valor");
}
function legenda(host, itens) {
  const l = document.createElement("div");
  l.className = "legenda";
  l.innerHTML = itens.map(i => `<span><i style="background:${i.cor}"></i>${i.txt}</span>`).join("");
  host.parentElement.appendChild(l);
}

/* ---------- cabeçalho comum (marca + cards + slicers) ---------- */
function cabecalho(pg, cards) {
  const topo = document.createElement("div");
  topo.className = "faixa-topo";
  pg.appendChild(topo);
  const marca = document.createElement("div");
  marca.className = "marca";
  marca.innerHTML = `<div class="logo">S</div><div><div class="nome">PAINEL DE INSPEÇÕES</div>
    <div class="sub">SESMT · Obras RD · Regional Oeste</div></div>`;
  pg.appendChild(marca);

  const b = document.createElement("button");
  b.className = "voltar"; b.textContent = "←"; b.title = "Voltar ao painel";
  b.onclick = () => irPara("painel");
  pg.appendChild(b);

  const refs = {};
  const larg = 150, gap = 8;
  const x0 = 1494 - cards.length * (larg + gap);
  cards.forEach((c, i) => {
    refs[c.k] = cartao(pg, x0 + i * (larg + gap), 8, larg, 62, c.rot, c.cls);
  });

  // No modo fluido a faixa de filtros fica recolhida atrás deste botão,
  // para não empurrar os gráficos para fora da primeira tela do celular.
  const alt = document.createElement("button");
  alt.className = "btn-filtros";
  alt.innerHTML = `<span>Filtros</span><span class="cont"></span>`;
  alt.onclick = e => { e.stopPropagation(); pg.classList.toggle("filtros-abertos"); };
  pg.appendChild(alt);

  const faixa = document.createElement("div");
  faixa.className = "faixa-slicers";
  pg.appendChild(faixa);
  [["ano", "Ano"], ["mes", "Mês"], ["area", "Área"], ["inspetor", "Inspetor"],
   ["funcao", "Função"], ["supervisor", "Supervisor"], ["equipe", "Equipe"]]
    .forEach(([campo, rot]) => faixa.appendChild(montarSlicer(campo, rot)));

  const lim = document.createElement("button");
  lim.className = "limpar"; lim.textContent = "✕ Limpar filtros";
  lim.onclick = () => { CAMPOS.forEach(c => filtros[c].clear()); render(); };
  faixa.appendChild(lim);
  return refs;
}

function montarSlicer(campo, rotulo) {
  const d = document.createElement("div");
  d.className = "slicer";
  d.dataset.campo = campo;
  d.innerHTML = `<button><span class="lb">${rotulo}</span><span class="vl">Tudo</span></button><div class="lista"></div>`;
  d.querySelector("button").onclick = e => {
    e.stopPropagation();
    const aberto = d.classList.contains("aberto");
    document.querySelectorAll(".slicer.aberto").forEach(s => s.classList.remove("aberto"));
    if (!aberto) { preencherLista(d, campo); d.classList.add("aberto"); }
  };
  return d;
}
function preencherLista(d, campo) {
  const lista = d.querySelector(".lista");
  lista.innerHTML = "";
  opcoes(campo).forEach(v => {
    const lab = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = filtros[campo].has(v);
    cb.onchange = () => {
      cb.checked ? filtros[campo].add(v) : filtros[campo].delete(v);
      render();
      preencherLista(d, campo);
      d.classList.add("aberto");
    };
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(campo === "mes" ? MESES_NOME[+v] : v));
    lista.appendChild(lab);
  });
}
document.addEventListener("click", () => document.querySelectorAll(".slicer.aberto").forEach(s => s.classList.remove("aberto")));

/* ---------- abas ---------- */
function abas() {

}

/* ============================================================
   MONTAGEM DAS PÁGINAS
   ============================================================ */

/* --- 1. PAINEL (menu, 7 visuais no original) --- */
function pgPainel() {

/* --- 2. Taxa de Contato (18 visuais) --- */
function pgTaxa() {
  const pg = document.createElement("div"); pg.className = "pagina"; pg.id = "pg-taxa";

/* ---------- montagem ---------- */
[pgPainel(), pgTaxa(), pgRanking(), pgAvanco(), pgIcit(), pgDia(), pgJornada()]
  .forEach(p => canvas.appendChild(p));
canvas.appendChild(abas());

function irPara(id) {
  if (!PAGINAS.some(p => p.id === id)) id = "painel";
  paginaAtual = id;
  canvas.querySelectorAll(".pagina").forEach(p => p.classList.toggle("ativa", p.id === "pg-" + id));
  canvas.querySelectorAll(".abas button").forEach(b => b.classList.toggle("on", b.dataset.pg === id));
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  window.scrollTo(0, 0);
  render();
}
// permite compartilhar link direto de uma página: ...dashboard.html#icit
window.addEventListener("hashchange", () => irPara(location.hash.slice(1)));

/* ============================================================
   RENDER
   ============================================================ */
function marcarSlicers() {
  document.querySelectorAll(".slicer").forEach(s => {
    const c = s.dataset.campo, sel = [...filtros[c]];
    s.classList.toggle("on", sel.length > 0);
    s.querySelector(".vl").textContent = !sel.length ? "Tudo"
      : sel.length === 1 ? (c === "mes" ? MESES_NOME[+sel[0]] : sel[0])
      : sel.length + " selecionados";
  });
  const n = CAMPOS.filter(c => filtros[c].size > 0).length;
  document.querySelectorAll(".btn-filtros").forEach(b => {
    b.classList.toggle("on", n > 0);
    b.querySelector(".cont").textContent = n ? `${n} ativo${n > 1 ? "s" : ""}` : "todos os dados";
  });
}
function setCards(refs, vals) {
  for (const k in vals) if (refs[k]) refs[k].textContent = vals[k];
}

function render() {
  marcarSlicers();
  const f = fatoFiltrado(), ms = mesesAtivos(), k = kpis(f, ms);
  const base = {
    meta: fmtN(k.Meta_Insp), metaDia: fmtD(k.Meta_insp_dia, 0), qtd: fmtN(k.Qtd_Insp),
    pct: fmtP(k.pctInspecao, 0), icit: fmtP(k.ICIT, 0), insNC: fmtN(k.Qtd_Inspecao_NC)
  };

  if (paginaAtual === "painel") {
    R.painelAtt.textContent = ATUALIZACAO;
    R.painelAtt.style.fontSize = "17px";
    resumoPainel();
  }

  if (paginaAtual === "taxa") {
    setCards(R.taxaCards, base);
    // O original quebra a página em dois blocos por FUNÇÃO: SESMT e OPERAÇÃO
    const porInsp = porInspetor(f, ms);
    const serie = [{ key: "meta", label: "Meta", cor: "var(--c2)" },
                   { key: "qtd", label: "Realizado", cor: "var(--c1)" }];
    const bloco = (host, hostTotal, funcoes) => {
      const d = porInsp.filter(g => funcoes.includes((IDX_INSPETOR[g.chave] || [])[4]))
                       .sort((a, b) => b.qtd - a.qtd);
      comboChart(host, d, { series: serie, linha: { key: "pctTotal", label: "% da meta" } });
      const meta = d.reduce((a, x) => a + x.meta, 0), qtd = d.reduce((a, x) => a + x.qtd, 0);
      comboChart(hostTotal, [{ chave: "Total", meta, qtd, pct: pct(qtd, meta) }],
        { series: serie, linha: { key: "pct", label: "% da meta" }, rotacionar: false });
    };
    bloco(R.taxaSesmt, R.taxaResumo, ["Técnico Segurança", "Engenheiro Segurança"]);
    bloco(R.taxaOper, R.taxaOperR, ["Supervisor", "Coordenador Operacional", "Gerente Operacional"]);
    legendaUnica(R.taxaSesmt, [{ cor: "var(--c2)", txt: "Meta" }, { cor: "var(--c1)", txt: "Realizado" }, { cor: "var(--c-linha)", txt: "% meta" }]);
  }

  if (paginaAtual === "ranking") {
    setCards(R.rkCards, base);
    const linhas = porInspetor(f, ms, true).sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1));
    tabela(R.rkTabela, [
      { titulo: "#", valor: (l, i) => "", num: true },
      { titulo: "Inspetor", valor: l => l.chave },
      { titulo: "Função", valor: l => (IDX_INSPETOR[l.chave] || ["","","","",""])[4] },
      { titulo: "Área", valor: l => (IDX_INSPETOR[l.chave] || ["","",""])[2] },
      { titulo: "Meta inspeção", valor: l => fmtN(l.meta), num: true },
      { titulo: "Meta até hoje", valor: l => fmtD(l.metaDia, 1), num: true },
      { titulo: "Realizado", valor: l => fmtN(l.qtd), num: true },
      { titulo: "% atingida", valor: l => fmtP(l.pct), num: true, classe: l => (l.pct >= 1 ? "ok" : "nok") },
      { titulo: "ICIT", valor: l => fmtP(l.icit), num: true },
      { titulo: "👍🏼 ou 👎🏼", valor: l => l.pct >= 1 ? "👍🏼" : "👎🏼", num: true }
    ], linhas);
    [...R.rkTabela.querySelectorAll("tbody tr")].forEach((tr, i) => tr.cells[0].textContent = i + 1);
  }

  if (paginaAtual === "avanco") {
    setCards(R.avCards, base);
    const meses = porMes(f, ms);
    comboChart(R.avTaxa, meses, {
      series: [{ key: "meta", label: "Meta", cor: "var(--c2)" }, { key: "qtd", label: "Realizado", cor: "var(--c1)" }],
      linha: { key: "pct", label: "% atingido" }, rotacionar: false
    });
    legendaUnica(R.avTaxa, [{ cor: "var(--c2)", txt: "Meta" }, { cor: "var(--c1)", txt: "Realizado" }, { cor: "var(--c-linha)", txt: "% atingido" }]);
    comboChart(R.avIcit, meses, {
      series: [{ key: "qtd", label: "Inspeções", cor: "var(--c1)" }, { key: "nc", label: "Com N.C", cor: "var(--ruim)" }],
      linha: { key: "icit", label: "ICIT" }, rotacionar: false
    });
    legendaUnica(R.avIcit, [{ cor: "var(--c1)", txt: "Inspeções" }, { cor: "var(--ruim)", txt: "Com N.C" }, { cor: "var(--c-linha)", txt: "ICIT" }]);
    gauge(R.avG1, k.pctInspecao, { max: 1.2, faixas: [0.7, 0.95] });
    gauge(R.avG2, k.ICIT, { max: 1, faixas: [0.6, 0.85] });
  }

  if (paginaAtual === "icit") {
    const g = gravidades(f);
    setCards(R.icCards, Object.assign({}, base, { gravissimo: fmtN(g["Gravíssimo"]) }));
    gauge(R.icGauge, k.ICIT, { max: 1, faixas: [0.6, 0.85] });
    const porInsp = porInspetor(f, ms).sort((a, b) => b.qtd - a.qtd);
    comboChart(R.icInsp, porInsp, {
      series: [{ key: "qtd", label: "Inspeções", cor: "var(--c1)" }, { key: "nc", label: "Com N.C", cor: "var(--ruim)" }],
      linha: { key: "icit", label: "ICIT" }
    });
    waterfall(R.icCat, ncPorCampo(f, 2));
    barrasH(R.icTop, ncPorCampo(f, 1).slice(0, 5), { maxRot: 52 });
    const porEq = agrupar(f, "equipe", ms).filter(x => x.qtd > 0).sort((a, b) => b.qtd - a.qtd).slice(0, 22);
    comboChart(R.icEquipe, porEq, {
      series: [{ key: "qtd", label: "Inspeções", cor: "var(--c1)" }, { key: "nc", label: "Com N.C", cor: "var(--ruim)" }],
      linha: { key: "icit", label: "ICIT" }, maxRot: 12
    });
    comboChart(R.icTipo, agrupar(f, "tipo", ms).sort((a, b) => b.qtd - a.qtd), {
      series: [{ key: "qtd", label: "Inspeções", cor: "var(--c1)" }, { key: "nc", label: "Com N.C", cor: "var(--ruim)" }],
      linha: { key: "icit", label: "ICIT" }, maxRot: 10
    });
    comboChart(R.icSup, agrupar(f, "supervisor", ms).filter(x => x.chave !== "(vazio)").sort((a, b) => b.qtd - a.qtd), {
      series: [{ key: "qtd", label: "Inspeções", cor: "var(--c1)" }, { key: "nc", label: "Com N.C", cor: "var(--ruim)" }],
      linha: { key: "icit", label: "ICIT" }, maxRot: 10
    });
  }

  if (paginaAtual === "dia") {
    const dias = porDia(f);
    setCards(R.diCards, Object.assign({}, base, {
      media: dias.length ? fmtD(k.Qtd_Insp / dias.length, 1) : "—"
    }));
    comboChart(R.diChart, dias, {
      series: [{ key: "qtd", label: "Inspeções", cor: "var(--c1)" }, { key: "nc", label: "Com N.C", cor: "var(--ruim)" }],
      maxRot: 6
    });
    legendaUnica(R.diChart, [{ cor: "var(--c1)", txt: "Inspeções" }, { cor: "var(--ruim)", txt: "Com N.C" }]);
  }

  if (paginaAtual === "jornada") {
    const j = jornada(f, ms).filter(l => l.pontosIniciais !== null);
    setCards(R.joCards, Object.assign({}, base, { equipes: fmtN(j.length) }));
    tabela(R.joTabela, [
      { titulo: "#", valor: l => l.ranking, num: true },
      { titulo: "Equipe", valor: l => l.equipe },
      { titulo: "Supervisor", valor: l => l.supervisor },
      { titulo: "Insp.", valor: l => fmtN(l.qtd), num: true },
      { titulo: "C/ N.C", valor: l => fmtN(l.nc), num: true },
      { titulo: "N.C", valor: l => fmtN(l.ncLinhas), num: true },
      { titulo: "ICIT", valor: l => fmtP(l.icit, 0), num: true, classe: l => (l.icit >= 0.8 ? "ok" : l.icit < 0.5 ? "nok" : "") },
      { titulo: "Pts iniciais", valor: l => fmtN(l.pontosIniciais), num: true },
      { titulo: "Pts N.C", valor: l => fmtN(l.pontosNC), num: true, classe: () => "nok" },
      { titulo: "Pts final", valor: l => fmtN(l.pontosFinal), num: true, classe: () => "ok" },
      { titulo: "Desempate", valor: l => fmtD(l.desempate, 1), num: true }
    ], j);
    const top = j.slice(0, 3);
    R.joPodio.innerHTML = top.length ? `
      <div class="podio">
        <div class="tit">🥇 Equipe destaque</div>
        <div class="eq">${top[0].equipe}</div>
        <div class="pts">${fmtN(top[0].pontosFinal)} pontos · ICIT ${fmtP(top[0].icit, 0)} · ${top[0].qtd} inspeções</div>
        ${top.map((l, i) => `<div class="lugar"><span class="medalha">${["🥇","🥈","🥉"][i]}</span>
           <span>${l.equipe}</span><b>${fmtN(l.pontosFinal)}</b></div>`).join("")}
      </div>` : `<div class="podio"><div class="tit">sem dados</div></div>`;
  }
}

function legendaUnica(host, itens) {
  const pai = host.parentElement;
  const velha = pai.querySelector(".legenda");
  if (velha) velha.remove();
  legenda(host, itens);
}

function resumoPainel() {
  const f = FATO, ms = DDATA, k = kpis(f, ms);
  const g = gravidades(f);
  const linhas = [
    ["Inspeções realizadas", fmtN(k.Qtd_Insp)],
    ["Meta de inspeções", fmtN(k.Meta_Insp)],
    ["Meta proporcional aos dias úteis", fmtD(k.Meta_insp_dia, 1)],
    ["% da meta atingida", fmtP(k.pctInspecao)],
    ["Inspeções com não conformidade", fmtN(k.Qtd_Inspecao_NC)],
    ["Não conformidades apontadas", fmtN(k.Qtd_NC)],
    ["ICIT (conformidade)", fmtP(k.ICIT)],
    ["Desvios gravíssimos / graves / leves", `${g["Gravíssimo"]} / ${g["Grave"]} / ${g["Leve"]}`],
    ["Inspetores × meses com meta", fmtN(k.Qtd_Inspetor)],
    ["Dias úteis no ano / até hoje", `${k.Dias_uteis} / ${k.Dias_uteis_ate_hoje}`]
  ];
  tabela(R.painelResumo, [
    { titulo: "Indicador", valor: l => l[0] },
    { titulo: "Valor", valor: l => l[1], num: true }
  ], linhas);
}

/* ---------- dois modos de layout ----------
   "canvas": telas largas — canvas 1510x720 escalado, fiel ao Power BI
   "fluido": telas estreitas — os mesmos visuais reempilhados em grade  */
const LARGURA_CANVAS = 1100;

function escalar() {
  const fluido = window.innerWidth < LARGURA_CANVAS;
  document.body.dataset.modo = fluido ? "fluido" : "canvas";
  if (fluido) {
    canvas.style.transform = "none";
  } else {
    const s = Math.min(window.innerWidth / 1510, window.innerHeight / 720);
    canvas.style.transform = `scale(${s})`;
  }
  return fluido;
}

/* Os gráficos leem clientWidth/clientHeight, então precisam ser redesenhados
   sempre que o layout muda de tamanho. */
let tRedesenho;
function aoRedimensionar() {
  escalar();
  clearTimeout(tRedesenho);
  tRedesenho = setTimeout(render, 120);
}
window.addEventListener("resize", aoRedimensionar);
window.addEventListener("orientationchange", aoRedimensionar);

escalar();
irPara(location.hash.slice(1) || "painel");
</script>
